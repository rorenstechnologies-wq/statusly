<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>
        Appointment Confirmed | Statusly
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f7fa;

            color: #17212b;

            display: flex;

            flex-direction: column;

            overflow-x: hidden;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {

            width: 100%;

            height: 60px;

            background: #ffffff;

            border-bottom:
                1px solid #e7eaed;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 14px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .brand-logo {

            width: 34px;

            height: 34px;

            object-fit: contain;

        }


        .brand-name {

            font-size: 19px;

            font-weight: 800;

            color: #12395b;

        }


        .brand-name span {

            color: #18a66b;

        }


        .live-status {

            display: flex;

            align-items: center;

            gap: 6px;

            background: #ecf9f3;

            color: #168558;

            padding: 6px 9px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

        }


        .live-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #18a66b;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px 14px 35px;

        }


        /* =====================================================
           SUCCESS CARD
        ===================================================== */

        .success-card {

            width: 100%;

            max-width: 460px;

            background: #ffffff;

            border:
                1px solid #e3e8ec;

            border-radius: 20px;

            padding: 28px 20px;

            text-align: center;

            box-shadow:
                0 8px 30px
                rgba(16, 24, 40, 0.07);

            animation:
                cardIn 0.6s ease;

        }


        @keyframes cardIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =====================================================
           SUCCESS ICON
        ===================================================== */

        .success-icon {

            width: 78px;

            height: 78px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #eaf8f1;

            border:
                7px solid #f5fcf8;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #18a66b;

            font-size: 38px;

            font-weight: 800;

            animation:
                successPop .7s ease .15s both;

        }


        @keyframes successPop {

            0% {

                opacity: 0;

                transform: scale(.4);

            }

            70% {

                transform: scale(1.12);

            }

            100% {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* =====================================================
           TEXT
        ===================================================== */

        .success-card h1 {

            color: #168558;

            font-size: 23px;

            line-height: 1.3;

            margin-bottom: 8px;

            animation:
                textIn .6s ease .25s both;

        }


        .thank-you {

            color: #273b4d;

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .message {

            color: #71808c;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        /* =====================================================
           HOSPITAL
        ===================================================== */

        .hospital-box {

            background: #f6f9fb;

            border:
                1px solid #e5eaee;

            border-radius: 12px;

            padding: 13px;

            margin-bottom: 20px;

        }


        .hospital-label {

            color: #89949d;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: .5px;

            font-weight: 700;

            margin-bottom: 3px;

        }


        .hospital-name {

            color: #20364a;

            font-size: 14px;

            font-weight: 750;

            overflow-wrap: anywhere;

        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .back-btn {

            width: 100%;

            min-height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #123f63,
                    #0d6b5f
                );

            color: #ffffff;

            border-radius: 11px;

            font-size: 14px;

            font-weight: 750;

            text-decoration: none;

            transition:
                transform .15s ease,
                box-shadow .15s ease;

            box-shadow:
                0 5px 14px
                rgba(18, 63, 99, .16);

        }


        .back-btn:active {

            transform: scale(.98);

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            text-align: center;

            padding:
                0 10px 18px;

            color: #8a949d;

            font-size: 11px;

            line-height: 1.7;

        }


        .footer strong {

            color: #40515f;

        }


        .tagline {

            color: #a0a9b0;

            font-size: 10px;

            margin-top: 2px;

        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 600px) {

            .topbar {

                height: 70px;

                padding:
                    0 30px;

            }


            .success-card {

                padding:
                    40px 35px;

            }


            .success-card h1 {

                font-size: 27px;

            }


            .success-icon {

                width: 88px;

                height: 88px;

                font-size: 43px;

            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .main {

                padding:
                    18px 9px 25px;

            }


            .success-card {

                padding:
                    24px 15px;

                border-radius: 16px;

            }


            .success-card h1 {

                font-size: 20px;

            }


            .success-icon {

                width: 68px;

                height: 68px;

                font-size: 32px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         STATUSLY HEADER
    ====================================================== -->

    <header class="topbar">


        <div class="brand">


            <img
                class="brand-logo"
                src="{{ url_for('static', filename='statusly-logo.png') }}"
                alt="Statusly"
            >


            <div class="brand-name">

                Status<span>ly</span>

            </div>


        </div>


        <div class="live-status">

            <span class="live-dot"></span>

            Confirmed

        </div>


    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <div class="success-card">


            <!-- SUCCESS ICON -->

            <div class="success-icon">

                ✓

            </div>



            <!-- MAIN MESSAGE -->

            <h1>

                Appointment Booked Successfully!

            </h1>


            <div class="thank-you">

                Thank You

            </div>


            <p class="message">

                Your appointment has been successfully booked.
                Please visit the hospital at your scheduled time.

            </p>



            <!-- HOSPITAL -->

            <div class="hospital-box">


                <div class="hospital-label">

                    Hospital

                </div>


                <div class="hospital-name">

                    {{ hospital_name }}

                </div>


            </div>



            <!-- BACK BUTTON -->

            <a
                class="back-btn"
                href="/"
            >

                ← Back to Home

            </a>


        </div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">


        <div>

            Powered by

            <strong>
                RORENS Technologies Pvt. Ltd.
            </strong>

        </div>


        <div class="tagline">

            Innovation • Technology • Growth

        </div>


    </footer>


</body>

</html>
