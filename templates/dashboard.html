<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediQueue - Hospital Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3")
                no-repeat
                center center /
                cover;

        }

        .overlay {

            min-height: 100vh;

            display: flex;

            background:
                rgba(0, 0, 0, 0.65);

        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            width: 230px;

            min-height: 100vh;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.90);

            color: white;

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            overflow-y: auto;

        }

        .sidebar h2 {

            text-align: center;

            margin-bottom: 25px;

            font-size: 22px;

        }

        .sidebar button {

            width: 100%;

            padding: 13px;

            margin: 7px 0;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #3498db;

            color: white;

            font-size: 15px;

            transition: 0.2s;

        }

        .sidebar button:hover {

            background: #217dbb;

            transform: translateY(-1px);

        }

        .logout-btn {

            background: #e74c3c !important;

        }

        .logout-btn:hover {

            background: #c0392b !important;

        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            margin-left: 230px;

            width: calc(100% - 230px);

            min-height: 100vh;

            padding: 30px;

            color: white;

        }

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }

        .topbar h1 {

            font-size: 30px;

        }

        .hospital-name-display {

            padding: 10px 16px;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(8px);

        }

        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(12px);

            padding: 22px;

            margin-bottom: 20px;

            border-radius: 14px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.25);

        }

        .card h2 {

            margin-bottom: 15px;

        }

        /* =====================================================
           INPUTS
        ===================================================== */

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            margin: 8px 0;

            border: none;

            outline: none;

            border-radius: 8px;

            background: white;

            color: #222;

        }

        textarea {

            min-height: 100px;

            resize: vertical;

        }

        input:disabled {

            background: #ddd;

            color: #555;

        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        button {

            cursor: pointer;

        }

        button.save {

            background: #27ae60;

            color: white;

            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            margin-top: 10px;

        }

        button.save:hover {

            background: #1f8a4c;

        }

        button.add {

            background: #8e44ad;

            color: white;

            padding: 11px 16px;

            border: none;

            border-radius: 8px;

            margin-top: 10px;

        }

        button.add:hover {

            background: #71368a;

        }

        /* =====================================================
           DOCTOR
        ===================================================== */

        .doctor-box {

            background:
                rgba(255,255,255,0.08);

            padding: 15px;

            margin: 15px 0;

            border-radius: 10px;

        }

        .doctor-box h3 {

            margin-bottom: 8px;

        }

        .remove-doctor {

            background: #e74c3c;

            color: white;

            padding: 8px 12px;

            border: none;

            border-radius: 6px;

            margin-top: 5px;

        }

        .remove-doctor:hover {

            background: #c0392b;

        }

        /* =====================================================
           STATUS
        ===================================================== */

        #statusMessage {

            margin-top: 15px;

            padding: 12px;

            display: none;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.15);

        }

        .success {

            background:
                rgba(39,174,96,0.35) !important;

        }

        .error {

            background:
                rgba(231,76,60,0.35) !important;

        }

        .loading {

            opacity: 0.7;

            pointer-events: none;

        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            .sidebar {

                width: 100%;

                min-height: auto;

                position: relative;

            }

            .overlay {

                display: block;

            }

            .content {

                margin-left: 0;

                width: 100%;

                padding: 20px;

            }

            .sidebar {

                display: flex;

                flex-wrap: wrap;

                gap: 8px;

            }

            .sidebar h2 {

                width: 100%;

            }

            .sidebar button {

                width: calc(50% - 4px);

                margin: 0;

            }

        }

    </style>

</head>


<body>

<div class="overlay">


    <!-- =====================================================
         SIDEBAR
    ===================================================== -->

    <aside class="sidebar">

        <h2>
            🏥 MediQueue
        </h2>

        <button
            type="button"
            onclick="showSection('hospital')"
        >
            🏥 Hospital
        </button>

        <button
            type="button"
            onclick="showSection('doctor')"
        >
            👨‍⚕️ Doctors
        </button>

        <button
            type="button"
            onclick="openAppointments()"
        >
            📅 Appointments
        </button>

        <button
            type="button"
            onclick="openFollowups()"
        >
            🔄 Follow-ups
        </button>

        <button
            type="button"
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="content">


        <div class="topbar">

            <h1>
                Hospital Dashboard
            </h1>

            <div
                id="hospitalNameDisplay"
                class="hospital-name-display"
            >
                Loading...
            </div>

        </div>


        <!-- =================================================
             HOSPITAL SECTION
        ================================================= -->

        <section
            id="hospital"
            class="section card"
        >

            <h2>
                Hospital Details
            </h2>

            <input
                id="hospital_id"
                placeholder="Hospital ID"
                disabled
            >

            <input
                id="hospital_name"
                placeholder="Hospital Name"
                required
            >

            <input
                id="date"
                type="date"
            >

            <input
                id="open_time"
                type="time"
            >

            <input
                id="close_time"
                type="time"
            >

            <textarea
                id="info"
                placeholder="Hospital Information"
            ></textarea>

            <button
                id="hospitalSaveButton"
                type="button"
                class="save"
                onclick="saveHospital()"
            >
                💾 Save Hospital
            </button>

            <div
                id="statusMessage"
            ></div>

        </section>


        <!-- =================================================
             DOCTOR SECTION
        ================================================= -->

        <section
            id="doctor"
            class="section card"
            style="display:none;"
        >

            <h2>
                Doctor Details
            </h2>

            <div id="doctor-section">


                <div class="doctor-box">

                    <h3>
                        Doctor 1
                    </h3>

                    <input
                        class="doctor_name"
                        placeholder="Doctor Name"
                    >

                    <input
                        class="specialization"
                        placeholder="Specialization"
                    >

                    <input
                        class="opd_time"
                        placeholder="OPD Time"
                    >

                    <textarea
                        class="doctor_info"
                        placeholder="Doctor Information"
                    ></textarea>

                </div>


            </div>


            <button
                type="button"
                class="add"
                onclick="addDoctor()"
            >
                + Add Doctor
            </button>


            <br>


            <button
                id="doctorSaveButton"
                type="button"
                class="save"
                onclick="saveHospital()"
            >
                💾 Save Hospital & Doctors
            </button>

        </section>


    </main>

</div>


<script type="module">


// =====================================================
// FIREBASE IMPORTS
// =====================================================

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


// =====================================================
// FIREBASE CONFIG
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


// =====================================================
// INITIALIZE FIREBASE
// =====================================================

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


// =====================================================
// CURRENT USER
// =====================================================

let currentUser = null;

let doctorCount = 1;


// =====================================================
// STATUS MESSAGE
// =====================================================

function showStatus(
    message,
    type = ""
) {

    const box =
        document.getElementById(
            "statusMessage"
        );

    box.innerText =
        message;

    box.className =
        type;

    box.style.display =
        "block";

}


// =====================================================
// HIDE STATUS
// =====================================================

function hideStatus() {

    const box =
        document.getElementById(
            "statusMessage"
        );

    box.style.display =
        "none";

}


// =====================================================
// GET FIREBASE TOKEN
// =====================================================

async function getToken() {

    if (!currentUser) {

        throw new Error(
            "User is not logged in."
        );

    }

    const token =
        await currentUser.getIdToken(
            true
        );

    if (!token) {

        throw new Error(
            "Firebase authentication token missing."
        );

    }

    return token;

}


// =====================================================
// AUTH STATE
// =====================================================

onAuthStateChanged(
    auth,
    async function(user) {

        console.log(
            "AUTH STATE:",
            user
        );


        if (!user) {

            window.location.href =
                "/login-page";

            return;

        }


        currentUser =
            user;


        try {

            // ---------------------------------------------
            // GET FRESH TOKEN
            // ---------------------------------------------

            const token =
                await getToken();


            console.log(
                "Firebase UID:",
                currentUser.uid
            );


            // ---------------------------------------------
            // CHECK SUBSCRIPTION
            // ---------------------------------------------

            const response =
                await fetch(
                    "/check-subscription",
                    {

                        method:
                            "POST",

                        headers: {

                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json"

                        }

                    }
                );


            const data =
                await response.json();


            console.log(
                "SUBSCRIPTION:",
                data
            );


            if (!response.ok) {

                alert(
                    data.error ||
                    "Unable to verify subscription."
                );

                await signOut(
                    auth
                );

                window.location.href =
                    "/login-page";

                return;

            }


            // ---------------------------------------------
            // SUBSCRIPTION NOT ACTIVE
            // ---------------------------------------------

            if (
                data.active !== true
            ) {

                alert(
                    "Your subscription has expired or is not active."
                );

                window.location.href =
                    "/payment";

                return;

            }


            // ---------------------------------------------
            // USE AUTHENTICATED UID
            // ---------------------------------------------

            const uid =
                currentUser.uid;


            localStorage.setItem(
                "uid",
                uid
            );


            // ---------------------------------------------
            // HOSPITAL ID
            // ---------------------------------------------

            document.getElementById(
                "hospital_id"
            ).value =
                uid;


            // ---------------------------------------------
            // LOAD HOSPITAL
            // ---------------------------------------------

            await loadSavedHospital();

        }
        catch(error) {

            console.error(
                "DASHBOARD ERROR:",
                error
            );

            alert(
                error.message ||
                "Unable to load dashboard."
            );

            window.location.href =
                "/login-page";

        }

    }
);


// =====================================================
// SHOW SECTION
// =====================================================

window.showSection =
function(id) {

    document
        .querySelectorAll(
            ".section"
        )
        .forEach(
            function(section) {

                section.style.display =
                    "none";

            }
        );


    const selected =
        document.getElementById(
            id
        );


    if (selected) {

        selected.style.display =
            "block";

    }

};


// =====================================================
// OPEN APPOINTMENTS
// =====================================================

window.openAppointments =
function() {

    if (!currentUser) {

        alert(
            "Login required."
        );

        window.location.href =
            "/login-page";

        return;

    }


    const uid =
        currentUser.uid;


    window.location.href =
        "/appointments/" +
        encodeURIComponent(uid);

};


// =====================================================
// OPEN FOLLOWUPS
// =====================================================

window.openFollowups =
function() {

    if (!currentUser) {

        alert(
            "Login required."
        );

        window.location.href =
            "/login-page";

        return;

    }


    const uid =
        currentUser.uid;


    window.location.href =
        "/followups/" +
        encodeURIComponent(uid);

};


// =====================================================
// ADD DOCTOR
// =====================================================

window.addDoctor =
function() {

    doctorCount++;


    const doctorSection =
        document.getElementById(
            "doctor-section"
        );


    const newDoctor =
        document.createElement(
            "div"
        );


    newDoctor.className =
        "doctor-box";


    newDoctor.innerHTML = `

        <h3>
            Doctor ${doctorCount}
        </h3>

        <input
            class="doctor_name"
            placeholder="Doctor Name"
        >

        <input
            class="specialization"
            placeholder="Specialization"
        >

        <input
            class="opd_time"
            placeholder="OPD Time"
        >

        <textarea
            class="doctor_info"
            placeholder="Doctor Information"
        ></textarea>

        <button
            type="button"
            class="remove-doctor"
            onclick="this.parentElement.remove()"
        >
            Remove
        </button>

    `;


    doctorSection.appendChild(
        newDoctor
    );

};


// =====================================================
// LOAD SAVED HOSPITAL
// =====================================================

async function loadSavedHospital() {

    try {

        if (!currentUser) {

            return;

        }


        const uid =
            currentUser.uid;


        const token =
            await getToken();


        /*
        IMPORTANT:

        This endpoint must exist in Flask:

        /api/hospital/<uid>
        */


        const response =
            await fetch(
                "/api/hospital/" +
                encodeURIComponent(uid),
                {

                    method:
                        "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        // ---------------------------------------------
        // NO HOSPITAL YET
        // ---------------------------------------------

        if (response.status === 404) {

            document.getElementById(
                "hospitalNameDisplay"
            ).innerText =
                "Hospital";

            return;

        }


        const data =
            await response.json();


        console.log(
            "HOSPITAL DATA:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load hospital."
            );

        }


        const hospital =
            data.hospital ||
            data;


        // ---------------------------------------------
        // HOSPITAL DETAILS
        // ---------------------------------------------

        document.getElementById(
            "hospital_id"
        ).value =
            uid;


        document.getElementById(
            "hospital_name"
        ).value =
            hospital.hospital_name ||
            "";


        document.getElementById(
            "date"
        ).value =
            hospital.date ||
            "";


        document.getElementById(
            "open_time"
        ).value =
            hospital.open_time ||
            "";


        document.getElementById(
            "close_time"
        ).value =
            hospital.close_time ||
            "";


        document.getElementById(
            "info"
        ).value =
            hospital.info ||
            "";


        document.getElementById(
            "hospitalNameDisplay"
        ).innerText =
            hospital.hospital_name ||
            "Hospital";


        localStorage.setItem(
            "hospitalName",
            hospital.hospital_name ||
            ""
        );


        // ---------------------------------------------
        // DOCTORS
        // ---------------------------------------------

        loadDoctors(
            hospital.doctors || []
        );

    }
    catch(error) {

        console.error(
            "LOAD HOSPITAL ERROR:",
            error
        );

        /*
        If the backend endpoint has not yet
        been created, don't block the dashboard.
        */

        document.getElementById(
            "hospitalNameDisplay"
        ).innerText =
            "Hospital";

    }

}


// =====================================================
// LOAD DOCTORS
// =====================================================

function loadDoctors(
    doctors
) {

    const section =
        document.getElementById(
            "doctor-section"
        );


    section.innerHTML =
        "";


    if (
        !Array.isArray(doctors) ||
        doctors.length === 0
    ) {

        doctorCount = 1;


        addInitialDoctor();

        return;

    }


    doctorCount =
        doctors.length;


    doctors.forEach(
        function(doctor, index) {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "doctor-box";


            box.innerHTML = `

                <h3>
                    Doctor ${index + 1}
                </h3>

                <input
                    class="doctor_name"
                    placeholder="Doctor Name"
                    value="${escapeHtmlAttribute(
                        doctor.doctor_name || ""
                    )}"
                >

                <input
                    class="specialization"
                    placeholder="Specialization"
                    value="${escapeHtmlAttribute(
                        doctor.specialization || ""
                    )}"
                >

                <input
                    class="opd_time"
                    placeholder="OPD Time"
                    value="${escapeHtmlAttribute(
                        doctor.opd_time || ""
                    )}"
                >

                <textarea
                    class="doctor_info"
                    placeholder="Doctor Information"
                >${escapeHtml(
                    doctor.doctor_info || ""
                )}</textarea>

                ${
                    index > 0
                    ?
                    `
                    <button
                        type="button"
                        class="remove-doctor"
                        onclick="this.parentElement.remove()"
                    >
                        Remove
                    </button>
                    `
                    :
                    ""
                }

            `;


            section.appendChild(
                box
            );

        }
    );

}


// =====================================================
// INITIAL DOCTOR
// =====================================================

function addInitialDoctor() {

    const section =
        document.getElementById(
            "doctor-section"
        );


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "doctor-box";


    box.innerHTML = `

        <h3>
            Doctor 1
        </h3>

        <input
            class="doctor_name"
            placeholder="Doctor Name"
        >

        <input
            class="specialization"
            placeholder="Specialization"
        >

        <input
            class="opd_time"
            placeholder="OPD Time"
        >

        <textarea
            class="doctor_info"
            placeholder="Doctor Information"
        ></textarea>

    `;


    section.appendChild(
        box
    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// =====================================================
// ESCAPE ATTRIBUTE
// =====================================================

function escapeHtmlAttribute(
    value
) {

    return escapeHtml(
        value
    );

}


// =====================================================
// SAVE HOSPITAL
// =====================================================

window.saveHospital =
async function() {

    try {

        hideStatus();


        if (!currentUser) {

            alert(
                "Login session expired."
            );

            window.location.href =
                "/login-page";

            return;

        }


        const uid =
            currentUser.uid;


        const hospitalName =
            document.getElementById(
                "hospital_name"
            ).value.trim();


        if (!hospitalName) {

            showStatus(
                "Hospital name is required.",
                "error"
            );

            return;

        }


        // ---------------------------------------------
        // GET TOKEN
        // ---------------------------------------------

        const token =
            await getToken();


        // ---------------------------------------------
        // FORM DATA
        // ---------------------------------------------

        const formData =
            new FormData();


        /*
        IMPORTANT:

        UID comes from Firebase authentication.

        Do NOT trust localStorage.
        */

        formData.append(
            "uid",
            uid
        );


        formData.append(
            "hospital_name",
            hospitalName
        );


        formData.append(
            "date",
            document.getElementById(
                "date"
            ).value
        );


        formData.append(
            "open_time",
            document.getElementById(
                "open_time"
            ).value
        );


        formData.append(
            "close_time",
            document.getElementById(
                "close_time"
            ).value
        );


        formData.append(
            "info",
            document.getElementById(
                "info"
            ).value.trim()
        );


        // ---------------------------------------------
        // DOCTORS
        // ---------------------------------------------

        const names =
            document.querySelectorAll(
                ".doctor_name"
            );


        const specializations =
            document.querySelectorAll(
                ".specialization"
            );


        const opdTimes =
            document.querySelectorAll(
                ".opd_time"
            );


        const doctorInfos =
            document.querySelectorAll(
                ".doctor_info"
            );


        for (
            let i = 0;
            i < names.length;
            i++
        ) {

            formData.append(
                "doctor_name",
                names[i].value.trim()
            );


            formData.append(
                "specialization",
                specializations[i]
                    .value
                    .trim()
            );


            formData.append(
                "opd_time",
                opdTimes[i]
                    .value
                    .trim()
            );


            formData.append(
                "doctor_info",
                doctorInfos[i]
                    .value
                    .trim()
            );

        }


        // ---------------------------------------------
        // BUTTON LOADING
        // ---------------------------------------------

        const buttons =
            document.querySelectorAll(
                ".save"
            );


        buttons.forEach(
            function(button) {

                button.disabled =
                    true;

                button.classList.add(
                    "loading"
                );

                button.innerText =
                    "Saving...";

            }
        );


        // ---------------------------------------------
        // SAVE
        // ---------------------------------------------

        const response =
            await fetch(
                "/save_hospital",
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        formData

                }
            );


        const data =
            await response.json();


        console.log(
            "SAVE HOSPITAL RESPONSE:",
            data
        );


        // ---------------------------------------------
        // SUBSCRIPTION EXPIRED
        // ---------------------------------------------

        if (
            response.status === 403
        ) {

            alert(
                data.error ||
                "Your subscription has expired."
            );


            window.location.href =
                "/payment";


            return;

        }


        // ---------------------------------------------
        // ERROR
        // ---------------------------------------------

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to save hospital."
            );

        }


        // ---------------------------------------------
        // SUCCESS
        // ---------------------------------------------

        localStorage.setItem(
            "uid",
            uid
        );


        localStorage.setItem(
            "hospitalName",
            hospitalName
        );


        document.getElementById(
            "hospitalNameDisplay"
        ).innerText =
            hospitalName;


        showStatus(
            "Hospital and doctors saved successfully.",
            "success"
        );


        /*
        IMPORTANT:

        Correct URL:

        /hospital/<uid>

        NOT:

        /hospital<uid>
        */

        setTimeout(
            function() {

                window.location.href =
                    "/hospital/" +
                    encodeURIComponent(uid);

            },
            700
        );


    }
    catch(error) {

        console.error(
            "SAVE HOSPITAL ERROR:",
            error
        );


        showStatus(
            error.message ||
            "Unable to connect to server.",
            "error"
        );

    }
    finally {

        const buttons =
            document.querySelectorAll(
                ".save"
            );


        buttons.forEach(
            function(button) {

                button.disabled =
                    false;

                button.classList.remove(
                    "loading"
                );

            }
        );


        document.getElementById(
            "hospitalSaveButton"
        ).innerText =
            "💾 Save Hospital";


        document.getElementById(
            "doctorSaveButton"
        ).innerText =
            "💾 Save Hospital & Doctors";

    }

};


// =====================================================
// LOGOUT
// =====================================================

window.logout =
async function() {

    try {

        await signOut(
            auth
        );


        localStorage.removeItem(
            "uid"
        );


        localStorage.removeItem(
            "hospitalId"
        );


        localStorage.removeItem(
            "hospitalName"
        );


        window.location.href =
            "/login-page";

    }
    catch(error) {

        console.error(
            "LOGOUT ERROR:",
            error
        );


        alert(
            "Logout failed."
        );

    }

};


// =====================================================
// DEFAULT SECTION
// =====================================================

showSection(
    "hospital"
);

</script>
