<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hospital Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3")
                no-repeat
                center center /
                cover;
        }

        .overlay {
            min-height: 100vh;

            display: flex;

            background:
                rgba(0, 0, 0, 0.65);
        }

        /* =================================================
           SIDEBAR
        ================================================= */

        .sidebar {

            width: 230px;

            min-height: 100vh;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.88);

            color: white;

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            overflow-y: auto;
        }

        .sidebar h2 {

            text-align: center;

            margin-bottom: 20px;

            font-size: 22px;
        }

        .sidebar button {

            width: 100%;

            padding: 13px;

            margin: 7px 0;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #3498db;

            color: white;

            font-size: 15px;

            transition: 0.2s;
        }

        .sidebar button:hover {

            background: #217dbb;
        }

        .logout-btn {

            background: #e74c3c !important;
        }

        .logout-btn:hover {

            background: #c0392b !important;
        }

        /* =================================================
           CONTENT
        ================================================= */

        .content {

            margin-left: 230px;

            width: calc(100% - 230px);

            min-height: 100vh;

            padding: 30px;

            color: white;
        }

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 20px;
        }

        .topbar h1 {

            font-size: 30px;
        }

        .hospital-name-display {

            padding: 10px 16px;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(8px);
        }

        /* =================================================
           CARD
        ================================================= */

        .card {

            background:
                rgba(255,255,255,0.12);

            backdrop-filter: blur(12px);

            padding: 22px;

            margin-bottom: 20px;

            border-radius: 14px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.25);
        }

        .card h2 {

            margin-bottom: 15px;
        }

        /* =================================================
           INPUTS
        ================================================= */

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            margin: 8px 0;

            border: none;

            outline: none;

            border-radius: 8px;

            background: white;

            color: #222;
        }

        textarea {

            min-height: 100px;

            resize: vertical;
        }

        input:disabled {

            background: #ddd;

            color: #555;
        }

        /* =================================================
           BUTTONS
        ================================================= */

        button {

            cursor: pointer;
        }

        button.save {

            background: #27ae60;

            color: white;

            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            margin-top: 10px;
        }

        button.save:hover {

            background: #1f8a4c;
        }

        button.add {

            background: #8e44ad;

            color: white;

            padding: 11px 16px;

            border: none;

            border-radius: 8px;

            margin-top: 10px;
        }

        button.add:hover {

            background: #71368a;
        }

        /* =================================================
           DOCTOR BOX
        ================================================= */

        .doctor-box {

            background:
                rgba(255,255,255,0.08);

            padding: 15px;

            margin: 15px 0;

            border-radius: 10px;
        }

        .doctor-box h3 {

            margin-bottom: 8px;
        }

        .remove-doctor {

            background: #e74c3c;

            color: white;

            padding: 8px 12px;

            border: none;

            border-radius: 6px;

            margin-top: 5px;
        }

        /* =================================================
           STATUS
        ================================================= */

        #statusMessage {

            margin-top: 15px;

            padding: 12px;

            display: none;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.15);
        }

        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 768px) {

            .sidebar {

                width: 100%;

                min-height: auto;

                position: relative;
            }

            .overlay {

                display: block;
            }

            .content {

                margin-left: 0;

                width: 100%;

                padding: 20px;
            }

            .sidebar {

                display: flex;

                flex-wrap: wrap;

                gap: 8px;
            }

            .sidebar h2 {

                width: 100%;
            }

            .sidebar button {

                width: calc(50% - 4px);

                margin: 0;
            }

        }

    </style>

</head>


<body>

<div class="overlay">


    <!-- =================================================
         SIDEBAR
    ================================================= -->

    <aside class="sidebar">

        <h2>
            🏥 MediQueue
        </h2>


        <button
            onclick="showSection('hospital')"
        >
            🏥 Hospital
        </button>


        <button
            onclick="showSection('doctor')"
        >
            👨‍⚕️ Doctors
        </button>


        <button
            onclick="openAppointments()"
        >
            📅 Appointments
        </button>


        <button
            onclick="openFollowups()"
        >
            🔄 Follow-ups
        </button>


        <!-- =================================================
             ANALYTICS BUTTON
        ================================================= -->

        <button
            onclick="openAnalytics()"
        >
            📊 Analytics
        </button>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </aside>


    <!-- =================================================
         MAIN CONTENT
    ================================================= -->

    <main class="content">


        <div class="topbar">

            <h1>
                Hospital Dashboard
            </h1>

            <div
                id="hospitalNameDisplay"
                class="hospital-name-display"
            >
                Loading...
            </div>

        </div>


        <!-- =================================================
             HOSPITAL SECTION
        ================================================= -->

        <section
            id="hospital"
            class="section card"
        >

            <h2>
                Hospital Details
            </h2>


            <input
                id="hospital_id"
                placeholder="Hospital ID"
                disabled
            >


            <input
                id="hospital_name"
                placeholder="Hospital Name"
            >


            <input
                id="date"
                type="date"
            >


            <input
                id="open_time"
                type="time"
            >


            <input
                id="close_time"
                type="time"
            >


            <textarea
                id="info"
                placeholder="Hospital Information"
            ></textarea>


            <button
                class="save"
                onclick="saveHospital()"
            >
                💾 Save Hospital
            </button>


            <div id="statusMessage"></div>

        </section>


        <!-- =================================================
             DOCTOR SECTION
        ================================================= -->

        <section
            id="doctor"
            class="section card"
            style="display:none;"
        >

            <h2>
                Doctor Details
            </h2>


            <div id="doctor-section">


                <div class="doctor-box">

                    <h3>
                        Doctor 1
                    </h3>


                    <input
                        class="doctor_name"
                        placeholder="Doctor Name"
                    >


                    <input
                        class="specialization"
                        placeholder="Specialization"
                    >


                    <input
                        class="opd_time"
                        placeholder="OPD Time"
                    >


                    <textarea
                        class="doctor_info"
                        placeholder="Doctor Information"
                    ></textarea>

                </div>


            </div>


            <button
                class="add"
                onclick="addDoctor()"
            >
                + Add Doctor
            </button>


            <button
                class="save"
                onclick="saveHospital()"
            >
                💾 Save Hospital & Doctors
            </button>

        </section>


    </main>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


/* =====================================================
   CURRENT USER
===================================================== */

let currentUser = null;


/* =====================================================
   DASHBOARD AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async function(user) {

        console.log(
            "AUTH STATE:",
            user
        );


        if (!user) {

            console.log(
                "User not logged in"
            );

            window.location.href =
                "/login-page";

            return;
        }


        currentUser =
            user;


        try {

            /* -----------------------------------------
               GET FRESH FIREBASE TOKEN
            ----------------------------------------- */

            const token =
                await user.getIdToken(
                    true
                );


            if (!token) {

                window.location.href =
                    "/login-page";

                return;
            }


            /* -----------------------------------------
               CHECK SUBSCRIPTION
            ----------------------------------------- */

            const response =
                await fetch(
                    "/check-subscription",
                    {

                        method:
                            "POST",

                        headers: {

                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json"

                        }

                    }
                );


            const data =
                await response.json();


            console.log(
                "SUBSCRIPTION:",
                data
            );


            if (!response.ok) {

                alert(
                    data.error ||
                    "Unable to verify subscription."
                );

                window.location.href =
                    "/login-page";

                return;
            }


            /* -----------------------------------------
               EXPIRED / NO SUBSCRIPTION
            ----------------------------------------- */

            if (
                data.active !== true
            ) {

                alert(
                    "Your subscription has expired or is not active."
                );

                window.location.href =
                    "/payment";

                return;
            }


            /* -----------------------------------------
               ACTIVE SUBSCRIPTION
            ----------------------------------------- */

            console.log(
                "DASHBOARD ACCESS GRANTED"
            );


            localStorage.setItem(
                "uid",
                user.uid
            );


            /* -----------------------------------------
               SHOW HOSPITAL ID
            ----------------------------------------- */

            const hospitalId =
                localStorage.getItem(
                    "hospitalId"
                ) || "";


            document.getElementById(
                "hospital_id"
            ).value =
                hospitalId;


            /* -----------------------------------------
               SHOW HOSPITAL NAME
            ----------------------------------------- */

            const hospitalName =
                localStorage.getItem(
                    "hospitalName"
                ) || "Hospital";


            document.getElementById(
                "hospitalNameDisplay"
            ).innerText =
                hospitalName;


            /* -----------------------------------------
               LOAD STORED HOSPITAL INFO
            ----------------------------------------- */

            loadSavedHospital();

        }
        catch(error) {

            console.error(
                "DASHBOARD ERROR:",
                error
            );

            window.location.href =
                "/login-page";

        }

    }
);


/* =====================================================
   SHOW SECTION
===================================================== */

window.showSection =
function(id) {

    document
        .querySelectorAll(".section")
        .forEach(
            function(section) {

                section.style.display =
                    "none";

            }
        );


    const selected =
        document.getElementById(
            id
        );


    if (selected) {

        selected.style.display =
            "block";

    }

};


/* =====================================================
   OPEN APPOINTMENTS
===================================================== */

window.openAppointments =
function() {

    const uid =
        localStorage.getItem(
            "uid"
        );


    if (!uid) {

        alert(
            "Login required!"
        );

        window.location.href =
            "/login-page";

        return;
    }


    window.location.href =
        "/appointments/" +
        uid;

};


/* =====================================================
   OPEN FOLLOW-UPS
===================================================== */

window.openFollowups =
function() {

    const uid =
        localStorage.getItem(
            "uid"
        );


    if (!uid) {

        alert(
            "Login required!"
        );

        window.location.href =
            "/login-page";

        return;
    }


    window.location.href =
        "/followups/" +
        uid;

};


/* =====================================================
   OPEN ANALYTICS
===================================================== */

window.openAnalytics =
function() {

    const uid =
        localStorage.getItem(
            "uid"
        );


    if (!uid) {

        alert(
            "Login required!"
        );

        window.location.href =
            "/login-page";

        return;
    }


    window.location.href =
        "/analytics/" +
        uid;

};


/* =====================================================
   ADD DOCTOR
===================================================== */

let doctorCount = 1;


window.addDoctor =
function() {

    doctorCount++;


    const doctorSection =
        document.getElementById(
            "doctor-section"
        );


    const newDoctor =
        document.createElement(
            "div"
        );


    newDoctor.className =
        "doctor-box";


    newDoctor.innerHTML = `

        <h3>
            Doctor ${doctorCount}
        </h3>

        <input
            class="doctor_name"
            placeholder="Doctor Name"
        >

        <input
            class="specialization"
            placeholder="Specialization"
        >

        <input
            class="opd_time"
            placeholder="OPD Time"
        >

        <textarea
            class="doctor_info"
            placeholder="Doctor Information"
        ></textarea>

        <button
            type="button"
            class="remove-doctor"
            onclick="this.parentElement.remove()"
        >
            Remove
        </button>

    `;


    doctorSection.appendChild(
        newDoctor
    );

};


/* =====================================================
   LOAD SAVED HOSPITAL
===================================================== */

async function loadSavedHospital() {

    const uid =
        localStorage.getItem(
            "uid"
        );


    if (!uid) {

        return;
    }


    const hospitalName =
        localStorage.getItem(
            "hospitalName"
        ) || "";


    document.getElementById(
        "hospital_name"
    ).value =
        hospitalName;

}


/* =====================================================
   SAVE HOSPITAL
===================================================== */

window.saveHospital =
async function() {

    try {

        const uid =
            localStorage.getItem(
                "uid"
            );


        if (!uid) {

            alert(
                "Login required!"
            );

            window.location.href =
                "/login-page";

            return;
        }


        if (!currentUser) {

            alert(
                "Login session expired."
            );

            window.location.href =
                "/login-page";

            return;
        }


        const token =
            await currentUser.getIdToken(
                true
            );


        const formData =
            new FormData();


        formData.append(
            "uid",
            uid
        );


        formData.append(
            "hospital_name",
            document.getElementById(
                "hospital_name"
            ).value.trim()
        );


        formData.append(
            "date",
            document.getElementById(
                "date"
            ).value
        );


        formData.append(
            "open_time",
            document.getElementById(
                "open_time"
            ).value
        );


        formData.append(
            "close_time",
            document.getElementById(
                "close_time"
            ).value
        );


        formData.append(
            "info",
            document.getElementById(
                "info"
            ).value.trim()
        );


        const names =
            document.querySelectorAll(
                ".doctor_name"
            );


        const specializations =
            document.querySelectorAll(
                ".specialization"
            );


        const opdTimes =
            document.querySelectorAll(
                ".opd_time"
            );


        const doctorInfos =
            document.querySelectorAll(
                ".doctor_info"
            );


        names.forEach(
            function(element, index) {

                formData.append(
                    "doctor_name",
                    element.value.trim()
                );


                formData.append(
                    "specialization",
                    specializations[index]
                        .value
                        .trim()
                );


                formData.append(
                    "opd_time",
                    opdTimes[index]
                        .value
                        .trim()
                );


                formData.append(
                    "doctor_info",
                    doctorInfos[index]
                        .value
                        .trim()
                );

            }
        );


        const response =
            await fetch(
                "/save_hospital",
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        formData

                }
            );


        const data =
            await response.json();


        console.log(
            "SAVE HOSPITAL RESPONSE:",
            data
        );


        if (response.ok) {

            localStorage.setItem(
                "hospitalName",
                document.getElementById(
                    "hospital_name"
                ).value.trim()
            );


            alert(
                "Hospital saved successfully."
            );


            window.location.href =
                "/hospital/" +
                uid;


            return;
        }


        if (
            response.status === 403
        ) {

            alert(
                data.error ||
                "Your subscription has expired."
            );


            window.location.href =
                "/payment";


            return;
        }


        alert(
            data.error ||
            "Unable to save hospital."
        );

    }
    catch(error) {

        console.error(
            "SAVE HOSPITAL ERROR:",
            error
        );


        alert(
            "Unable to connect to server."
        );

    }

};


/* =====================================================
   LOGOUT
===================================================== */

window.logout =
async function() {

    try {

        await signOut(
            auth
        );


        localStorage.removeItem(
            "uid"
        );

        localStorage.removeItem(
            "hospitalId"
        );

        localStorage.removeItem(
            "hospitalName"
        );


        window.location.href =
            "/login-page";

    }
    catch(error) {

        console.error(
            "LOGOUT ERROR:",
            error
        );


        alert(
            "Logout failed."
        );

    }

};


/* =====================================================
   DEFAULT SECTION
===================================================== */

showSection(
    "hospital"
);

</script>

</body>

</html>
