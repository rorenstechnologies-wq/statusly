<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediQueue | Hospital Dashboard</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            background:
                url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3")
                no-repeat
                center center /
                cover;

            color: white;

        }


        /* =====================================================
           OVERLAY
        ===================================================== */

        .overlay {

            min-height: 100vh;

            display: flex;

            background:
                rgba(3, 7, 18, 0.72);

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            width: 250px;

            height: 100vh;

            padding: 22px 16px;

            background:
                rgba(8, 15, 28, 0.97);

            border-right:
                1px solid
                rgba(255,255,255,0.08);

            color: white;

            position: fixed;

            left: 0;

            top: 0;

            display: flex;

            flex-direction: column;

            z-index: 1000;

            overflow-y: auto;

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                8px
                10px
                24px;

            margin-bottom: 10px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

        }


        .brand-icon {

            width: 44px;

            height: 44px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #3498db,
                    #2563eb
                );

            font-size: 21px;

            box-shadow:
                0 8px 20px
                rgba(37,99,235,0.30);

        }


        .brand-name {

            font-size: 18px;

            font-weight: 700;

            letter-spacing: 0.2px;

        }


        .brand-subtitle {

            font-size: 11px;

            color: #94a3b8;

            margin-top: 3px;

        }


        /* =====================================================
           SIDEBAR SECTION
        ===================================================== */

        .sidebar-section {

            margin-top: 18px;

        }


        .sidebar-label {

            padding:
                0
                12px;

            margin-bottom: 7px;

            color: #64748b;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1.2px;

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav-btn {

            width: 100%;

            min-height: 46px;

            padding:
                11px
                13px;

            margin: 3px 0;

            display: flex;

            align-items: center;

            gap: 12px;

            border:
                1px solid
                transparent;

            border-radius: 10px;

            background:
                transparent;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 500;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                border 0.2s ease;

        }


        .nav-btn:hover {

            background:
                rgba(255,255,255,0.07);

            color: white;

            transform:
                translateX(2px);

        }


        .nav-btn.active {

            background:
                linear-gradient(
                    90deg,
                    rgba(52,152,219,0.22),
                    rgba(52,152,219,0.08)
                );

            border:
                1px solid
                rgba(52,152,219,0.25);

            color: white;

        }


        .nav-icon {

            width: 24px;

            text-align: center;

            font-size: 17px;

        }


        /* =====================================================
           SIDEBAR BOTTOM
        ===================================================== */

        .sidebar-bottom {

            margin-top: auto;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

        }


        .logout-btn {

            color: #fca5a5;

        }


        .logout-btn:hover {

            background:
                rgba(231,76,60,0.12);

            color: #fecaca;

        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            margin-left: 250px;

            width:
                calc(100% - 250px);

            min-height: 100vh;

            padding: 30px;

            color: white;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 25px;

        }


        .topbar-left h1 {

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 6px;

        }


        .topbar-left p {

            color:
                #cbd5e1;

            font-size: 14px;

        }


        .hospital-name-display {

            padding:
                10px
                16px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.10);

            backdrop-filter:
                blur(10px);

            color: white;

            font-size: 14px;

            font-weight: 600;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background:
                rgba(255,255,255,0.10);

            backdrop-filter:
                blur(15px);

            padding: 24px;

            margin-bottom: 20px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.22);

        }


        .card h2 {

            margin-bottom: 18px;

            font-size: 20px;

        }


        .card-description {

            color:
                #cbd5e1;

            font-size: 13px;

            margin-bottom: 18px;

        }


        /* =====================================================
           FORM GRID
        ===================================================== */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap:
                10px
                15px;

        }


        .form-full {

            grid-column:
                1 / -1;

        }


        /* =====================================================
           INPUTS
        ===================================================== */

        input,
        textarea,
        select {

            width: 100%;

            padding: 13px 14px;

            margin: 6px 0;

            border:
                1px solid
                #e2e8f0;

            outline: none;

            border-radius: 9px;

            background:
                #ffffff;

            color:
                #1e293b;

            font-size: 14px;

            transition:
                border 0.2s,
                box-shadow 0.2s;

        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color:
                #3498db;

            box-shadow:
                0 0 0 3px
                rgba(52,152,219,0.15);

        }


        textarea {

            min-height: 110px;

            resize: vertical;

        }


        input:disabled {

            background:
                #e2e8f0;

            color:
                #64748b;

        }


        /* =====================================================
           LABEL
        ===================================================== */

        .input-label {

            display: block;

            color:
                #e2e8f0;

            font-size: 12px;

            font-weight: 600;

            margin-top: 8px;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        button {

            cursor: pointer;

        }


        .save {

            background:
                linear-gradient(
                    135deg,
                    #27ae60,
                    #16a34a
                );

            color: white;

            padding:
                12px
                18px;

            border: none;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            margin-top: 12px;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .save:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(22,163,74,0.25);

        }


        .add {

            background:
                linear-gradient(
                    135deg,
                    #8e44ad,
                    #7c3aed
                );

            color: white;

            padding:
                11px
                16px;

            border: none;

            border-radius: 9px;

            margin-top: 12px;

            font-size: 14px;

            font-weight: 600;

        }


        .add:hover {

            opacity: 0.9;

        }


        /* =====================================================
           DOCTOR BOX
        ===================================================== */

        .doctor-box {

            background:
                rgba(255,255,255,0.07);

            padding: 18px;

            margin:
                15px 0;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.08);

        }


        .doctor-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;

        }


        .doctor-box h3 {

            font-size: 16px;

        }


        .remove-doctor {

            background:
                #e74c3c;

            color: white;

            padding:
                7px
                11px;

            border: none;

            border-radius: 7px;

            font-size: 12px;

        }


        .remove-doctor:hover {

            background:
                #c0392b;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        #statusMessage {

            margin-top: 15px;

            padding: 12px;

            display: none;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.10);

            font-size: 13px;

        }


        /* =====================================================
           EMPTY / INFO BOX
        ===================================================== */

        .info-box {

            padding: 20px;

            border-radius: 12px;

            background:
                rgba(52,152,219,0.10);

            border:
                1px solid
                rgba(52,152,219,0.18);

            color:
                #dbeafe;

            font-size: 14px;

            line-height: 1.6;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            .sidebar {

                width: 100%;

                height: auto;

                min-height: auto;

                position: relative;

                padding: 15px;

            }


            .overlay {

                display: block;

            }


            .content {

                margin-left: 0;

                width: 100%;

                padding: 20px;

            }


            .brand {

                margin-bottom: 5px;

            }


            .sidebar-section {

                margin-top: 12px;

            }


            .sidebar-label {

                display: none;

            }


            .nav-btn {

                width: 100%;

            }


            .sidebar-bottom {

                margin-top: 15px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

            }


            .form-full {

                grid-column:
                    auto;

            }


            .topbar-left h1 {

                font-size: 24px;

            }


            .hospital-name-display {

                width: 100%;

                text-align: center;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .content {

                padding: 15px;

            }


            .card {

                padding: 17px;

            }


            .brand {

                padding-bottom: 18px;

            }

        }

    </style>

</head>


<body>


<div class="overlay">


    <!-- =====================================================
         SIDEBAR
    ===================================================== -->

    <aside class="sidebar">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">

                🏥

            </div>


            <div>

                <div class="brand-name">

                    MediQueue

                </div>


                <div class="brand-subtitle">

                    Hospital Portal

                </div>

            </div>

        </div>


        <!-- =================================================
             MAIN
        ================================================= -->

        <div class="sidebar-section">

            <div class="sidebar-label">

                MAIN

            </div>


            <button
                class="nav-btn active"
                onclick="
                    showSection('hospital');
                    setActiveNav(this);
                "
            >

                <span class="nav-icon">
                    🏥
                </span>

                <span>
                    Hospital
                </span>

            </button>


            <button
                class="nav-btn"
                onclick="
                    showSection('doctor');
                    setActiveNav(this);
                "
            >

                <span class="nav-icon">
                    👨‍⚕️
                </span>

                <span>
                    Doctors
                </span>

            </button>

        </div>


        <!-- =================================================
             OPERATIONS
        ================================================= -->

        <div class="sidebar-section">

            <div class="sidebar-label">

                OPERATIONS

            </div>


            <button
                class="nav-btn"
                onclick="openAppointments()"
            >

                <span class="nav-icon">
                    📅
                </span>

                <span>
                    Appointments
                </span>

            </button>


            <button
                class="nav-btn"
                onclick="openFollowups()"
            >

                <span class="nav-icon">
                    🔄
                </span>

                <span>
                    Follow-ups
                </span>

            </button>

        </div>


        <!-- =================================================
             INSIGHTS
        ================================================= -->

        <div class="sidebar-section">

            <div class="sidebar-label">

                INSIGHTS

            </div>


            <button
                class="nav-btn"
                onclick="openAnalytics()"
            >

                <span class="nav-icon">
                    📊
                </span>

                <span>
                    Analytics
                </span>

            </button>


            <button
                class="nav-btn"
                onclick="openConnect()"
            >

                <span class="nav-icon">
                    🔗
                </span>

                <span>
                    Connect
                </span>

            </button>

        </div>


        <!-- =================================================
             LOGOUT
        ================================================= -->

        <div class="sidebar-bottom">

            <button
                class="nav-btn logout-btn"
                onclick="logout()"
            >

                <span class="nav-icon">
                    🚪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>


    </aside>


    <!-- =====================================================
         MAIN CONTENT
    ===================================================== -->

    <main class="content">


        <!-- =================================================
             TOPBAR
        ================================================= -->

        <div class="topbar">


            <div class="topbar-left">

                <h1>
                    Hospital Dashboard
                </h1>


                <p>
                    Manage your hospital, doctors and services
                    from one place.
                </p>

            </div>


            <div
                id="hospitalNameDisplay"
                class="hospital-name-display"
            >

                Loading...

            </div>


        </div>


        <!-- =================================================
             HOSPITAL SECTION
        ================================================= -->

        <section
            id="hospital"
            class="section card"
        >


            <h2>
                Hospital Details
            </h2>


            <p class="card-description">

                Update your hospital information and operating
                hours.

            </p>


            <div class="form-grid">


                <!-- HOSPITAL ID -->

                <div>

                    <label
                        class="input-label"
                        for="hospital_id"
                    >
                        Hospital ID
                    </label>


                    <input
                        id="hospital_id"
                        placeholder="Hospital ID"
                        disabled
                    >

                </div>


                <!-- HOSPITAL NAME -->

                <div>

                    <label
                        class="input-label"
                        for="hospital_name"
                    >
                        Hospital Name
                    </label>


                    <input
                        id="hospital_name"
                        placeholder="Enter hospital name"
                    >

                </div>


                <!-- DATE -->

                <div>

                    <label
                        class="input-label"
                        for="date"
                    >
                        Date
                    </label>


                    <input
                        id="date"
                        type="date"
                    >

                </div>


                <!-- OPEN TIME -->

                <div>

                    <label
                        class="input-label"
                        for="open_time"
                    >
                        Opening Time
                    </label>


                    <input
                        id="open_time"
                        type="time"
                    >

                </div>


                <!-- CLOSE TIME -->

                <div>

                    <label
                        class="input-label"
                        for="close_time"
                    >
                        Closing Time
                    </label>


                    <input
                        id="close_time"
                        type="time"
                    >

                </div>


                <!-- INFO -->

                <div class="form-full">

                    <label
                        class="input-label"
                        for="info"
                    >
                        Hospital Information
                    </label>


                    <textarea
                        id="info"
                        placeholder="Enter hospital information, services, facilities, etc."
                    ></textarea>

                </div>


            </div>


            <button
                class="save"
                onclick="saveHospital()"
            >

                💾 Save Hospital

            </button>


            <div
                id="statusMessage"
            ></div>


        </section>


        <!-- =================================================
             DOCTOR SECTION
        ================================================= -->

        <section
            id="doctor"
            class="section card"
            style="display:none;"
        >


            <h2>
                Doctor Management
            </h2>


            <p class="card-description">

                Add and manage doctors available at your
                hospital.

            </p>


            <div id="doctor-section">


                <!-- DOCTOR 1 -->

                <div class="doctor-box">


                    <div class="doctor-header">

                        <h3>
                            Doctor 1
                        </h3>

                    </div>


                    <div class="form-grid">


                        <div>

                            <label
                                class="input-label"
                            >
                                Doctor Name
                            </label>


                            <input
                                class="doctor_name"
                                placeholder="Doctor Name"
                            >

                        </div>


                        <div>

                            <label
                                class="input-label"
                            >
                                Specialization
                            </label>


                            <input
                                class="specialization"
                                placeholder="e.g. Cardiologist"
                            >

                        </div>


                        <div>

                            <label
                                class="input-label"
                            >
                                OPD Time
                            </label>


                            <input
                                class="opd_time"
                                placeholder="e.g. 10:00 AM - 2:00 PM"
                            >

                        </div>


                        <div class="form-full">

                            <label
                                class="input-label"
                            >
                                Doctor Information
                            </label>


                            <textarea
                                class="doctor_info"
                                placeholder="Doctor information"
                            ></textarea>

                        </div>


                    </div>


                </div>


            </div>


            <button
                class="add"
                onclick="addDoctor()"
            >

                + Add Doctor

            </button>


            <button
                class="save"
                onclick="saveHospital()"
            >

                💾 Save Hospital & Doctors

            </button>


        </section>


    </main>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


/* =====================================================
   CURRENT USER
===================================================== */

let currentUser = null;


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async function(user) {


        console.log(
            "AUTH STATE:",
            user
        );


        /* ---------------------------------------------
           NO USER
        --------------------------------------------- */

        if (!user) {

            console.log(
                "User not logged in"
            );

            window.location.href =
                "/login-page";

            return;

        }


        currentUser =
            user;


        try {


            /* -----------------------------------------
               GET FRESH FIREBASE TOKEN
            ----------------------------------------- */

            const token =
                await user.getIdToken(
                    true
                );


            if (!token) {

                window.location.href =
                    "/login-page";

                return;

            }


            /* -----------------------------------------
               CHECK SUBSCRIPTION
            ----------------------------------------- */

            const response =
                await fetch(
                    "/check-subscription",
                    {

                        method:
                            "POST",

                        headers: {

                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json"

                        }

                    }
                );


            const data =
                await response.json();


            console.log(
                "SUBSCRIPTION:",
                data
            );


            /* -----------------------------------------
               SUBSCRIPTION REQUEST FAILED
            ----------------------------------------- */

            if (!response.ok) {

                alert(
                    data.error ||
                    "Unable to verify subscription."
                );

                window.location.href =
                    "/login-page";

                return;

            }


            /* -----------------------------------------
               SUBSCRIPTION NOT ACTIVE
            ----------------------------------------- */

            if (
                data.active !== true
            ) {

                alert(
                    "Your subscription has expired or is not active."
                );

                window.location.href =
                    "/payment";

                return;

            }


            /* -----------------------------------------
               ACCESS GRANTED
            ----------------------------------------- */

            console.log(
                "DASHBOARD ACCESS GRANTED"
            );


            /* -----------------------------------------
               SAVE UID
            ----------------------------------------- */

            localStorage.setItem(
                "uid",
                user.uid
            );


            /* -----------------------------------------
               HOSPITAL ID
            ----------------------------------------- */

            const hospitalId =
                localStorage.getItem(
                    "hospitalId"
                ) || "";


            document.getElementById(
                "hospital_id"
            ).value =
                hospitalId;


            /* -----------------------------------------
               HOSPITAL NAME
            ----------------------------------------- */

            const hospitalName =
                localStorage.getItem(
                    "hospitalName"
                ) ||
                "Hospital";


            document.getElementById(
                "hospitalNameDisplay"
            ).innerText =
                hospitalName;


            /* -----------------------------------------
               LOAD SAVED DATA
            ----------------------------------------- */

            loadSavedHospital();


        }
        catch(error) {


            console.error(
                "DASHBOARD ERROR:",
                error
            );


            window.location.href =
                "/login-page";

        }

    }
);


/* =====================================================
   SHOW SECTION
===================================================== */

window.showSection =
function(id) {


    document
        .querySelectorAll(
            ".section"
        )
        .forEach(
            function(section) {

                section.style.display =
                    "none";

            }
        );


    const selected =
        document.getElementById(
            id
        );


    if (selected) {

        selected.style.display =
            "block";

    }

};


/* =====================================================
   ACTIVE NAVIGATION
===================================================== */

window.setActiveNav =
function(button) {


    document
        .querySelectorAll(
            ".nav-btn"
        )
        .forEach(
            function(btn) {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );

};


/* =====================================================
   OPEN APPOINTMENTS
===================================================== */

window.openAppointments =
function() {


    const uid =

/* =====================================================
   SAVE HOSPITAL
===================================================== */

window.saveHospital =
async function() {


    try {


        /* ---------------------------------------------
           UID
        --------------------------------------------- */

        const uid =
            localStorage.getItem(
                "uid"
            );


        if (!uid) {

            alert(
                "Login required!"
            );

            window.location.href =
                "/login-page";

            return;

        }


        /* ---------------------------------------------
           FIREBASE USER
        --------------------------------------------- */

        if (!currentUser) {

            alert(
                "Login session expired."
            );

            window.location.href =
                "/login-page";

            return;

        }


        /* ---------------------------------------------
           FRESH TOKEN
        --------------------------------------------- */

        const token =
            await currentUser.getIdToken(
                true
            );


        /* ---------------------------------------------
           FORM DATA
        --------------------------------------------- */

        const formData =
            new FormData();


        formData.append(
            "uid",
            uid
        );


        formData.append(
            "hospital_name",
            document
                .getElementById(
                    "hospital_name"
                )
                .value
                .trim()
        );


        formData.append(
            "date",
            document
                .getElementById(
                    "date"
                )
                .value
        );


        formData.append(
            "open_time",
            document
                .getElementById(
                    "open_time"
                )
                .value
        );


        formData.append(
            "close_time",
            document
                .getElementById(
                    "close_time"
                )
                .value
        );


        formData.append(
            "info",
            document
                .getElementById(
                    "info"
                )
                .value
                .trim()
        );


        /* ---------------------------------------------
           DOCTORS
        --------------------------------------------- */

        const names =
            document.querySelectorAll(
                ".doctor_name"
            );


        const specializations =
            document.querySelectorAll(
                ".specialization"
            );


        const opdTimes =
            document.querySelectorAll(
                ".opd_time"
            );


        const doctorInfos =
            document.querySelectorAll(
                ".doctor_info"
            );


        names.forEach(
            function(
                element,
                index
            ) {


                formData.append(
                    "doctor_name",
                    element.value.trim()
                );


                formData.append(
                    "specialization",
                    specializations[index]
                        .value
                        .trim()
                );


                formData.append(
                    "opd_time",
                    opdTimes[index]
                        .value
                        .trim()
                );


                formData.append(
                    "doctor_info",
                    doctorInfos[index]
                        .value
                        .trim()
                );

            }
        );


        /* ---------------------------------------------
           SEND REQUEST
        --------------------------------------------- */

        const response =
            await fetch(
                "/save_hospital",
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:
                        formData

                }
            );


        const data =
            await response.json();


        console.log(
            "SAVE HOSPITAL RESPONSE:",
            data
        );


        /* ---------------------------------------------
           SUCCESS
        --------------------------------------------- */

        if (response.ok) {


            const hospitalName =
                document
                    .getElementById(
                        "hospital_name"
                    )
                    .value
                    .trim();


            localStorage.setItem(
                "hospitalName",
                hospitalName
            );


            document.getElementById(
                "hospitalNameDisplay"
            ).innerText =
                hospitalName ||
                "Hospital";


            alert(
                "Hospital saved successfully."
            );


            window.location.href =
                "/hospital/" +
                uid;


            return;

        }


        /* ---------------------------------------------
           SUBSCRIPTION EXPIRED
        --------------------------------------------- */

        if (
            response.status === 403
        ) {


            alert(
                data.error ||
                "Your subscription has expired."
            );


            window.location.href =
                "/payment";


            return;

        }


        /* ---------------------------------------------
           OTHER ERROR
        --------------------------------------------- */

        alert(
            data.error ||
            "Unable to save hospital."
        );


    }
    catch(error) {


        console.error(
            "SAVE HOSPITAL ERROR:",
            error
        );


        alert(
            "Unable to connect to server."
        );

    }

};
