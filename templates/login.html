<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Appointments | Statusly</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #172033;
        }

        .header {
            background: linear-gradient(135deg, #0f766e, #087ea4);
            color: white;
            padding: 25px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
        }

        .header p {
            margin: 7px 0 0;
            opacity: .9;
            font-size: 14px;
        }

        .container {
            max-width: 1450px;
            margin: auto;
            padding: 25px;
        }

        .filters {
            background: white;
            border-radius: 14px;
            padding: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
            margin-bottom: 22px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #475569;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            height: 43px;
            border: 1px solid #d9e2e8;
            border-radius: 9px;
            padding: 0 12px;
            font-size: 13px;
            outline: none;
            background: white;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #0f766e;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .05);
        }

        .summary-card .number {
            font-size: 27px;
            font-weight: bold;
            color: #0f766e;
        }

        .summary-card .label {
            margin-top: 5px;
            color: #64748b;
            font-size: 12px;
        }

        .doctor-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
        }

        .doctor-header {
            background: linear-gradient(135deg, #ecfeff, #f0fdfa);
            padding: 18px 20px;
            border-bottom: 1px solid #dceff1;
        }

        .doctor-header h2 {
            margin: 0;
            color: #0f766e;
            font-size: 20px;
        }

        .doctor-header small {
            display: block;
            color: #64748b;
            margin-top: 5px;
        }

        .section-title {
            padding: 14px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #edf2f5;
            font-weight: bold;
            font-size: 13px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th {
            background: #fafcfd;
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            padding: 13px 10px;
            border-bottom: 1px solid #e5edf1;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 13px 10px;
            border-bottom: 1px solid #edf2f5;
            font-size: 12px;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .patient-name {
            font-weight: bold;
            color: #1e293b;
        }

        .mobile {
            color: #475569;
        }

        .gender,
        .age {
            color: #475569;
        }

        .date {
            font-weight: 600;
        }

        .time {
            display: block;
            color: #64748b;
            margin-top: 3px;
            font-size: 11px;
        }

        .visit {
            display: inline-block;
            padding: 5px 9px;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 7px;
            font-weight: bold;
            font-size: 11px;
        }

        .type {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 10px;
            font-weight: bold;
        }

        .type-new {
            background: #dcfce7;
            color: #166534;
        }

        .type-old {
            background: #fef3c7;
            color: #92400e;
        }

        .amount-box {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .amount-input {
            width: 85px;
            height: 34px;
            border: 1px solid #d7e0e5;
            border-radius: 7px;
            padding: 0 8px;
            font-size: 12px;
        }

        .save-amount {
            border: none;
            background: #0f766e;
            color: white;
            border-radius: 6px;
            padding: 8px 9px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }

        .save-amount:hover {
            background: #0b5f59;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            cursor: pointer;
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .details-btn {
            background: #e0f2fe;
            color: #0369a1;
        }

        .old-btn {
            background: #fef3c7;
            color: #92400e;
        }

        .follow-btn {
            background: #dcfce7;
            color: #166534;
            text-decoration: none;
            display: inline-block;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .62);
            z-index: 9999;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: block;
        }

        .modal-card {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 20px 70px rgba(0, 0, 0, .25);
        }

        .modal-header {
            padding: 18px 22px;
            background: linear-gradient(135deg, #0f766e, #087ea4);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            border: none;
            background: rgba(255,255,255,.15);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
        }

        .modal-body {
            padding: 22px;
        }

        .patient-top {
            background: #f8fafc;
            border: 1px solid #e7eef2;
            border-radius: 12px;
            padding: 17px;
            margin-bottom: 20px;
        }

        .patient-top h3 {
            margin: 0 0 12px;
            color: #0f766e;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .detail-item {
            background: white;
            border: 1px solid #e7eef2;
            padding: 11px;
            border-radius: 8px;
        }

        .detail-item .label {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .detail-item .value {
            font-size: 12px;
            font-weight: bold;
            color: #334155;
            word-break: break-word;
        }

        .history-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #334155;
        }

        .history-table {
            width: 100%;
            min-width: 650px;
        }

        .history-wrapper {
            overflow-x: auto;
            border: 1px solid #e5edf1;
            border-radius: 10px;
        }

        .history-table th,
        .history-table td {
            padding: 10px;
        }

        .total-paid {
            margin-top: 15px;
            padding: 13px;
            background: #ecfdf5;
            color: #166534;
            border-radius: 9px;
            font-weight: bold;
            text-align: right;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #172033;
            color: white;
            padding: 13px 17px;
            border-radius: 9px;
            font-size: 12px;
            z-index: 10000;
            display: none;
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 900px) {

            .filters {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .details-grid {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 600px) {

            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 22px;
            }

            .container {
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr 1fr;
                gap: 9px;
            }

            .summary-card {
                padding: 14px;
            }

            .summary-card .number {
                font-size: 22px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 8px;
            }

            .modal-card {
                margin: 10px auto;
            }

        }
    </style>
</head>

<body>

<div class="header">
    <h1>👨‍⚕️ Doctor Appointments</h1>
    <p>Manage patients by doctor and appointment date</p>
</div>


<div class="container">

    <!-- FILTERS -->

    <div class="filters">

        <div class="filter-group">
            <label>Doctor</label>

            <select id="doctorFilter">
                <option value="all">All Doctors</option>
            </select>
        </div>


        <div class="filter-group">
            <label>Search Patient</label>

            <input
                type="text"
                id="searchInput"
                placeholder="Search name or mobile..."
            >
        </div>


        <div class="filter-group">
            <label>Appointment Date</label>

            <input
                type="date"
                id="dateFilter"
            >
        </div>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">
            <div
                class="number"
                id="totalPatients"
            >
                0
            </div>

            <div class="label">
                Total Patients
            </div>
        </div>


        <div class="summary-card">
            <div
                class="number"
                id="totalDoctors"
            >
                0
            </div>

            <div class="label">
                Doctors
            </div>
        </div>


        <div class="summary-card">
            <div
                class="number"
                id="todayCount"
            >
                0
            </div>

            <div class="label">
                Today
            </div>
        </div>


        <div class="summary-card">
            <div
                class="number"
                id="upcomingCount"
            >
                0
            </div>

            <div class="label">
                Upcoming
            </div>
        </div>

    </div>


    <!-- APPOINTMENTS -->

    <div id="appointmentsContainer"></div>

</div>


<!-- DETAILS MODAL -->

<div
    id="detailsModal"
    class="modal"
    onclick="closeModalOutside(event)"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>👤 Patient Details</h2>

            <button
                class="close-btn"
                onclick="closeDetails()"
            >
                ×
            </button>

        </div>


        <div
            id="modalBody"
            class="modal-body"
        ></div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>
"use strict";

/*
=========================================================
SERVER DATA
=========================================================
IMPORTANT:
Flask sends `patients`, not `appointments`.
This prevents the previous Undefined error.
*/

const APPOINTMENTS = {{ patients | default([]) | tojson | safe }};

const UID = {{ uid | default("") | tojson | safe }};


/*
=========================================================
LOCAL DATA
=========================================================
*/

let allAppointments = [];
let filteredAppointments = [];


/*
=========================================================
UTILITY
=========================================================
*/

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function normalizeMobile(value) {

    let digits =
        String(value || "")
            .replace(/\D/g, "");

    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {
        digits = digits.substring(2);
    }

    return digits;
}


function todayISO() {

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(d.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(d.getDate())
            .padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


function normalizeDate(value) {

    if (!value) {
        return "";
    }

    const text =
        String(value).trim();

    /*
    YYYY-MM-DD
    */

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(text)
    ) {
        return text;
    }


    /*
    DD-MM-YYYY
    */

    let match =
        text.match(
            /^(\d{2})-(\d{2})-(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );
    }


    /*
    DD/MM/YYYY
    */

    match =
        text.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );
    }


    /*
    YYYY/MM/DD
    */

    match =
        text.match(
            /^(\d{4})\/(\d{2})\/(\d{2})$/
        );

    if (match) {

        return (
            match[1] +
            "-" +
            match[2] +
            "-" +
            match[3]
        );
    }


    return text.substring(0, 10);
}


function dateTimeValue(item) {

    const date =
        normalizeDate(
            item.appointment_date
        );

    const time =
        String(
            item.appointment_time || ""
        );

    return (
        date +
        " " +
        time
    );
}


function formatDate(value) {

    const date =
        normalizeDate(value);

    if (!date) {
        return "-";
    }

    const parts =
        date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );
}


function formatAmount(value) {

    const number =
        Number(value || 0);

    if (isNaN(number)) {
        return "₹0";
    }

    return "₹" + number.toFixed(2);
}


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(
        () => {
            toast.classList.remove("show");
        },
        2500
    );
}


/*
=========================================================
PREPARE APPOINTMENTS
=========================================================
*/

function prepareAppointments() {

    allAppointments =
        Array.isArray(APPOINTMENTS)
            ? APPOINTMENTS.map(
                item => {

                    const p =
                        Object.assign({}, item);

                    p.mobile =
                        normalizeMobile(
                            p.mobile
                        );

                    p.appointment_date =
                        normalizeDate(
                            p.appointment_date
                        );

                    p.doctor_name =
                        p.doctor_name ||
                        "Unknown Doctor";

                    p.patient_name =
                        p.patient_name ||
                        "Unknown Patient";

                    p.gender =
                        p.gender ||
                        "-";

                    p.age =
                        p.age ||
                        "-";

                    p.amount =
                        p.amount === undefined ||
                        p.amount === null ||
                        p.amount === ""
                            ? 0
                            : Number(p.amount);

                    p.visit_number =
                        Number(
                            p.visit_number || 1
                        );

                    p.patient_status =
                        String(
                            p.patient_status ||
                            (
                                p.visit_number === 1
                                    ? "NEW"
                                    : "OLD"
                            )
                        )
                        .toUpperCase();

                    /*
                    Historical Visit 1 must always
                    remain NEW.
                    */

                    if (
                        p.visit_number === 1
                    ) {
                        p.patient_status = "NEW";
                    }

                    return p;
                }
            )
            : [];


    /*
    Latest date/time first.
    */

    allAppointments.sort(
        (a, b) => {

            const aa =
                dateTimeValue(a);

            const bb =
                dateTimeValue(b);

            return bb.localeCompare(aa);
        }
    );
}


/*
=========================================================
DOCTOR FILTER
=========================================================
*/

function buildDoctorFilter() {

    const select =
        document.getElementById(
            "doctorFilter"
        );

    const doctors =
        [
            ...new Set(
                allAppointments
                    .map(
                        item =>
                            item.doctor_name
                    )
                    .filter(Boolean)
            )
        ]
        .sort(
            (a, b) =>
                a.localeCompare(b)
        );


    select.innerHTML =
        '<option value="all">All Doctors</option>';


    doctors.forEach(
        doctor => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                doctor;

            option.textContent =
                doctor;

            select.appendChild(
                option
            );
        }
    );
}


/*
=========================================================
FILTER
=========================================================
*/

function applyFilters() {

    const doctor =
        document
            .getElementById("doctorFilter")
            .value;

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    const selectedDate =
        document
            .getElementById("dateFilter")
            .value;


    filteredAppointments =
        allAppointments.filter(
            item => {

                if (
                    doctor !== "all" &&
                    item.doctor_name !== doctor
                ) {
                    return false;
                }


                if (search) {

                    const name =
                        String(
                            item.patient_name || ""
                        ).toLowerCase();

                    const mobile =
                        String(
                            item.mobile || ""
                        ).toLowerCase();

                    if (
                        !name.includes(search) &&
                        !mobile.includes(search)
                    ) {
                        return false;
                    }
                }


                if (
                    selectedDate &&
                    item.appointment_date !== selectedDate
                ) {
                    return false;
                }


                return true;
            }
        );


    updateSummary();

    renderAppointments();
}


/*
=========================================================
SUMMARY
=========================================================
*/

function updateSummary() {

    const today =
        todayISO();


    const doctors =
        new Set(
            filteredAppointments.map(
                p => p.doctor_name
            )
        );


    const todayCount =
        filteredAppointments.filter(
            p =>
                p.appointment_date === today
        ).length;


    const upcomingCount =
        filteredAppointments.filter(
            p =>
                p.appointment_date > today
        ).length;


    document
        .getElementById("totalPatients")
        .textContent =
        filteredAppointments.length;


    document
        .getElementById("totalDoctors")
        .textContent =
        doctors.size;


    document
        .getElementById("todayCount")
        .textContent =
        todayCount;


    document
        .getElementById("upcomingCount")
        .textContent =
        upcomingCount;
}


/*
=========================================================
GROUP BY DOCTOR
=========================================================
*/

function groupByDoctor(items) {

    const grouped = {};

    items.forEach(
        item => {

            const doctor =
                item.doctor_name ||
                "Unknown Doctor";

            if (!grouped[doctor]) {
                grouped[doctor] = [];
            }

            grouped[doctor].push(item);
        }
    );

    return grouped;
}


/*
=========================================================
RENDER
=========================================================
*/

function renderAppointments() {

    const container =
        document.getElementById(
            "appointmentsContainer"
        );


    if (
        filteredAppointments.length === 0
    ) {

        container.innerHTML = `
            <div class="doctor-card">
                <div class="empty">
                    No appointments found.
                </div>
            </div>
        `;

        return;
    }


    const grouped =
        groupByDoctor(
            filteredAppointments
        );


    const today =
        todayISO();


    let html = "";


    Object.keys(grouped)
        .sort()
        .forEach(
            doctor => {

                const doctorAppointments =
                    grouped[doctor];


                const todayAppointments =
                    doctorAppointments.filter(
                        p =>
                            p.appointment_date === today
                    );


                const upcomingAppointments =
                    doctorAppointments.filter(
                        p =>
                            p.appointment_date > today
                    );


                const pastAppointments =
                    doctorAppointments.filter(
                        p =>
                            p.appointment_date < today
                    );


                html += `
                    <div class="doctor-card">

                        <div class="doctor-header">

                            <h2>
                                👨‍⚕️
                                ${escapeHtml(doctor)}
                            </h2>

                            <small>
                                ${doctorAppointments.length}
                                appointment(s)
                            </small>

                        </div>
                `;


                if (
                    todayAppointments.length
                ) {

                    html += `
                        <div class="section-title">
                            📅 TODAY
                        </div>

                        ${renderTable(
                            todayAppointments
                        )}
                    `;
                }


                if (
                    upcomingAppointments.length
                ) {

                    html += `
                        <div class="section-title">
                            🔜 UPCOMING
                        </div>

                        ${renderTable(
                            upcomingAppointments
                        )}
                    `;
                }


                if (
                    pastAppointments.length
                ) {

                    html += `
                        <div class="section-title">
                            📁 PAST
                        </div>

                        ${renderTable(
                            pastAppointments
                        )}
                    `;
                }


                html += `
                    </div>
                `;
            }
        );


    container.innerHTML =
        html;
}


/*
=========================================================
TABLE
=========================================================
*/

function renderTable(items) {

    /*
    Always latest date/time first.
    */

    items =
        [...items].sort(
            (a, b) =>
                dateTimeValue(b)
                    .localeCompare(
                        dateTimeValue(a)
                    )
        );


    let rows = "";


    items.forEach(
        (p, index) => {

            const status =
                p.patient_status === "OLD"
                    ? "OLD"
                    : "NEW";


            const typeClass =

                                            'amount-${escapeHtml(

}


/*
=========================================================
FIND APPOINTMENT
=========================================================
*/

function findAppointment(id) {

    return allAppointments.find(
        item =>
            String(
                item.id ||
                item.appointment_id ||
                ""
            ) === String(id)
    );
}


/*
=========================================================
PATIENT HISTORY
=========================================================
*/

function getPatientHistory(patient) {

    const mobile =
        normalizeMobile(
            patient.mobile
        );


    const history =
        allAppointments.filter(
            item => {

                const itemMobile =
                    normalizeMobile(
                        item.mobile
                    );

                return (
                    itemMobile &&
                    mobile &&
                    itemMobile === mobile
                );
            }
        );


    history.sort(
        (a, b) =>
            dateTimeValue(b)
                .localeCompare(
                    dateTimeValue(a)
                )
        );


    return history;
}

let firebaseAuth = null;
let firebaseReady = false;


/*
Load Firebase only once.
*/

async function initializeFirebaseAuth() {

    if (firebaseReady) {
        return firebaseAuth;
    }


    try {

        const firebaseAppModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js"
            );


        const firebaseAuthModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js"
            );


        const firebaseConfig = {

            apiKey:
                "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

            authDomain:
                "hospital-57fc8.firebaseapp.com",

            databaseURL:
                "https://hospital-57fc8-default-rtdb.firebaseio.com",

            projectId:
                "hospital-57fc8",

            storageBucket:
                "hospital-57fc8.firebasestorage.app",

            messagingSenderId:
                "711314420912",

            appId:
                "1:711314420912:web:14ec889664980679a13775"
        };


        const app =
            firebaseAppModule.initializeApp(
                firebaseConfig,
                "statuslyAppointments"
            );


        firebaseAuth =
            firebaseAuthModule.getAuth(
                app
            );


        /*
        IMPORTANT:
        Firebase can take a moment to restore
        the login session.

        We wait for auth state.
        */

        window.statuslyAuthPromise =
            new Promise(
                resolve => {

                    const unsubscribe =
                        firebaseAuthModule.onAuthStateChanged(
                            firebaseAuth,
                            user => {

                                unsubscribe();

                                resolve(user);
                            }
                        );
                }
            );


        firebaseReady = true;

        return firebaseAuth;

    }
    catch(error) {

        console.error(
            "FIREBASE INITIALIZATION ERROR:",
            error
        );

        return null;
    }
}


/*
=========================================================
GET FRESH FIREBASE TOKEN
=========================================================
*/

async function getStatuslyToken() {

    const auth =
        await initializeFirebaseAuth();


    if (!auth) {

        throw new Error(
            "Firebase authentication could not initialize."
        );
    }


    /*
    Wait until Firebase restores session.
    */

    let user =
        auth.currentUser;


    if (
        !user &&
        window.statuslyAuthPromise
    ) {

        user =
            await window.statuslyAuthPromise;
    }


    if (!user) {

        /*
        Last backup check.
        */

        const savedUid =
            localStorage.getItem(
                "firebaseUid"
            );

        const savedToken =
            localStorage.getItem(
                "firebaseIdToken"
            );


        if (
            savedUid &&
            savedToken
        ) {

            /*
            We do NOT blindly trust an old token
            for API authentication.

            Firebase session must exist.
            */

            throw new Error(
                "Login session not found. Please login again."
            );
        }


        throw new Error(
            "Login session not found. Please login again."
        );
    }


    /*
    Always request a valid Firebase token.
    */

    const token =
        await user.getIdToken(true);


    if (!token) {

        throw new Error(
            "Authentication token missing."
        );
    }


    localStorage.setItem(
        "firebaseUid",
        user.uid
    );


    localStorage.setItem(
        "firebaseEmail",
        user.email || ""
    );


    localStorage.setItem(
        "firebaseIdToken",
        token
    );


    localStorage.setItem(
        "statuslyLoggedIn",
        "true"
    );


    return token;
}


/*
=========================================================
AUTHENTICATED FETCH
=========================================================
*/

async function statuslyFetch(
    url,
    options = {}
) {

    const token =
        await getStatuslyToken();


    const headers =
        Object.assign(
            {},
            options.headers || {}
        );


    headers["Authorization"] =
        "Bearer " + token;


    headers["Content-Type"] =
        "application/json";


    return fetch(
        url,
        Object.assign(
            {},
            options,
            {
                headers: headers
            }
        )
    );
}


/*
=========================================================
MAKE PATIENT OLD
=========================================================
*/

async function makePatientOld(
    mobile
) {

    if (!mobile) {

        alert(
            "Patient mobile number is missing."
        );

        return;
    }


    const confirmed =
        confirm(
            "Make this patient OLD?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await statuslyFetch(
                "/api/doctor/make-patient-old",
                {
                    method: "POST",

                    body: JSON.stringify({
                        mobile: mobile
                    })
                }
            );


        let result = {};

        try {
            result =
                await response.json();
        }
        catch(error) {
            result = {};
        }


        if (
            response.status === 401
        ) {

            alert(
                "Login session expired. Please login again."
            );

            return;
        }


        if (
            !response.ok ||
            result.success !== true
        ) {

            alert(
                result.error ||
                result.message ||
                "Unable to make patient OLD."
            );

            return;
        }


        showToast(
            "Patient marked as OLD."
        );


        /*
        Update all local appointments for
        this patient.

        Visit 1 stays NEW.
        Visit 2+ become OLD.
        */

        const mobile10 =
            normalizeMobile(mobile);


        allAppointments.forEach(
            item => {

                if (
                    normalizeMobile(
                        item.mobile
                    ) === mobile10
                ) {

                    if (
                        Number(
                            item.visit_number || 1
                        ) > 1
                    ) {

                        item.patient_status =
                            "OLD";
                    }
                    else {

                        item.patient_status =
                            "NEW";
                    }
                }
            }
        );


        applyFilters();

    }
    catch(error) {

        console.error(
            "MAKE OLD ERROR:",
            error
        );


        alert(
            error.message ||
            "Something went wrong while updating patient."
        );
    }
}


/*
=========================================================
SAVE AMOUNT
=========================================================
*/

async function saveAmount(
    appointmentId,
    inputElement
) {

    if (!appointmentId) {

        alert(
            "Appointment ID is missing."
        );

        return;
    }


    const raw =
        inputElement.value;


    if (
        raw === "" ||
        raw === null ||
        raw === undefined
    ) {

        alert(
            "Please enter amount."
        );

        return;
    }


    const amount =
        Number(raw);


    if (
        isNaN(amount) ||
        amount < 0
    ) {

        alert(
            "Please enter a valid amount."
        );

        return;
    }


    try {

        const response =
            await statuslyFetch(
                "/api/appointment/" +
                encodeURIComponent(
                    appointmentId
                ) +
                "/amount",
                {
                    method: "POST",

                    body: JSON.stringify({
                        amount: amount
                    })
                }
            );


        let result = {};

        try {
            result =
                await response.json();
        }
        catch(error) {
            result = {};
        }


        if (
            response.status === 401
        ) {

            alert(
                "Login session expired. Please login again."
            );

            return;
        }


        if (
            !response.ok ||
            result.success !== true
        ) {

            alert(
                result.error ||
                result.message ||
                "Amount update failed."
            );

            return;
        }


        /*
        Update local data.
        */

        const appointment =
            findAppointment(
                appointmentId
            );


        if (appointment) {

            appointment.amount =
                amount;
        }


        showToast(
            "Amount updated successfully."
        );

    }
    catch(error) {

        console.error(
            "SAVE AMOUNT ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to update amount."
        );
    }
}
