<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f766e">

    <title>Book Appointment / अपॉइंटमेंट बुक करा</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f766e 0%,
                    #0e7490 45%,
                    #164e63 100%
                );

            color: #172033;
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .page-background {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(8, 35, 45, 0.70),
                    rgba(8, 35, 45, 0.82)
                ),
                url(
                    "https://images.unsplash.com/photo-1586773860418-d37222d8fce3"
                )
                center center / cover no-repeat;

            z-index: -2;
        }

        .page-glow {
            position: fixed;
            width: 260px;
            height: 260px;

            border-radius: 50%;

            background: rgba(45, 212, 191, 0.18);

            filter: blur(70px);

            top: -80px;
            left: -80px;

            z-index: -1;
        }

        .page-glow-two {
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background: rgba(56, 189, 248, 0.15);

            filter: blur(75px);

            bottom: -100px;
            right: -100px;

            z-index: -1;
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 16px;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .appointment-card {
            width: 100%;

            max-width: 520px;

            background: rgba(255, 255, 255, 0.98);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.30);

            animation: cardIn 0.55s ease;
        }

        @keyframes cardIn {

            from {
                opacity: 0;

                transform:
                    translateY(24px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .card-header {
            position: relative;

            padding: 24px 20px 21px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;
        }

        .header-top {
            display: flex;

            align-items: center;

            gap: 13px;
        }

        .hospital-icon {
            width: 50px;
            height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.16);

            border:
                1px solid rgba(255, 255, 255, 0.22);

            font-size: 24px;

            flex-shrink: 0;
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            margin: 0;

            font-size: 22px;

            font-weight: 750;

            line-height: 1.3;
        }

        .header-title p {
            margin: 4px 0 0;

            font-size: 12px;

            line-height: 1.5;

            opacity: 0.88;
        }

        .hospital-name {
            margin-top: 17px;

            padding: 11px 13px;

            border-radius: 12px;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            font-size: 14px;

            line-height: 1.45;

            word-break: break-word;
        }

        .hospital-name strong {
            display: block;

            margin-bottom: 2px;

            font-size: 10px;

            letter-spacing: 0.7px;

            opacity: 0.75;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-container {
            padding: 22px 18px 20px;

            background: white;
        }

        .section-label {
            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin-bottom: 17px;

            color: #334155;

            font-size: 14px;

            font-weight: 700;
        }

        .section-label span {
            width: 28px;
            height: 28px;

            min-width: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: #e6fffb;

            color: #0f766e;

            font-size: 14px;
        }

        .section-label-text {
            line-height: 1.35;
        }

        .section-label-english {
            display: block;

            margin-top: 1px;

            color: #94a3b8;

            font-size: 10px;

            font-weight: 500;
        }

        /* =====================================================
           FIELD
        ===================================================== */

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #475569;

            font-size: 13px;

            font-weight: 650;

            line-height: 1.45;
        }

        .field label .english {
            color: #94a3b8;

            font-size: 10px;

            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;

            border:
                1px solid #dbe4ea;

            border-radius: 12px;

            background: #f8fafc;

            color: #172033;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input,
        select {
            height: 48px;

            padding: 0 13px;
        }

        textarea {
            min-height: 100px;

            padding: 12px 13px;

            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;

            font-size: 13px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0f766e;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(15, 118, 110, 0.10);
        }

        select option {
            color: #172033;
        }

        /* =====================================================
           TWO COLUMNS
        ===================================================== */

        .two-columns {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        /* =====================================================
           AVAILABILITY MESSAGE
        ===================================================== */

        .availability-message {
            display: none;

            margin-top: -5px;
            margin-bottom: 15px;

            padding: 10px 12px;

            border-radius: 10px;

            background: #f0fdfa;

            border: 1px solid #ccfbf1;

            color: #0f766e;

            font-size: 12px;

            line-height: 1.5;
        }

        /* =====================================================
           SUBMIT
        ===================================================== */

        .submit-btn {
            width: 100%;

            min-height: 52px;

            margin-top: 7px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(15, 118, 110, 0.22);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 14px 25px
                rgba(15, 118, 110, 0.28);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.65;

            cursor: wait;

            transform: none;
        }

        /* =====================================================
           SECURITY
        ===================================================== */

        .secure-note {
            margin-top: 14px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            color: #64748b;

            font-size: 10px;

            text-align: center;

            line-height: 1.5;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {
                padding: 10px;

                align-items: flex-start;
            }

            .appointment-card {
                margin: 6px 0;

                border-radius: 20px;
            }

            .card-header {
                padding: 21px 16px 18px;
            }

            .header-title h1 {
                font-size: 20px;
            }

            .header-title p {
                font-size: 11px;
            }

            .hospital-icon {
                width: 45px;
                height: 45px;

                border-radius: 13px;

                font-size: 22px;
            }

            .form-container {
                padding: 20px 15px 17px;
            }

            .two-columns {
                grid-template-columns: 1fr;

                gap: 0;
            }

            input,
            select {
                height: 48px;
            }

            textarea {
                min-height: 95px;
            }

            .submit-btn {
                min-height: 52px;
            }
        }

        @media (max-width: 380px) {

            .page {
                padding: 7px;
            }

            .card-header {
                padding: 18px 14px;
            }

            .form-container {
                padding: 18px 12px;
            }

            .header-title h1 {
                font-size: 18px;
            }

            .hospital-name {
                font-size: 13px;
            }
        }

    </style>

</head>


<body>

<div class="page-background"></div>

<div class="page-glow"></div>

<div class="page-glow-two"></div>


<div class="page">

    <div class="appointment-card">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="card-header">

            <div class="header-top">

                <div class="hospital-icon">
                    🏥
                </div>

                <div class="header-title">

                    <h1>
                        अपॉइंटमेंट बुक करा
                    </h1>

                    <p>
                        Book your hospital appointment
                    </p>

                </div>

            </div>


            <div class="hospital-name">

                <strong>
                    हॉस्पिटल / HOSPITAL
                </strong>

                {{ hospital.hospital_name }}

            </div>

        </div>


        <!-- =================================================
             FORM
        ================================================== -->

        <div class="form-container">

            <div class="section-label">

                <span>
                    📋
                </span>

                <div class="section-label-text">

                    अपॉइंटमेंटची माहिती

                    <span class="section-label-english">
                        Appointment Details
                    </span>

                </div>

            </div>


            <form
                action="/book_appointment"
                method="POST"
                id="appointmentForm"
            >


                <!-- HOSPITAL ID -->

                <input
                    type="hidden"
                    name="hospital_id"
                    value="{{ uid }}"
                >


                <!-- FCM TOKEN -->

                <input
                    type="hidden"
                    name="fcm_token"
                    id="fcm_token"
                    value=""
                >


                <!-- =================================================
                     DOCTOR
                ================================================== -->

                <div class="field">

                    <label>

                        डॉक्टर निवडा

                        <span class="english">
                            / Select Doctor
                        </span>

                    </label>


                    <select
                        name="doctor_name"
                        id="doctor_name"
                        required
                    >

                        <option value="">
                            डॉक्टर निवडा / Choose a doctor
                        </option>


                        {% for doctor in hospital.doctors %}

                        <option
                            value="{{ doctor.doctor_name }}"
                            data-specialization="{{ doctor.specialization }}"
                            data-opd-time="{{ doctor.opd_time }}"
                        >

                            Dr. {{ doctor.doctor_name }}
                            —
                            {{ doctor.specialization }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- =================================================
                     PATIENT NAME
                ================================================== -->

                <div class="field">

                    <label>

                        रुग्णाचे नाव

                        <span class="english">
                            / Patient Name
                        </span>

                    </label>


                    <input
                        type="text"
                        name="patient_name"
                        placeholder="रुग्णाचे पूर्ण नाव / Enter full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- =================================================
                     GENDER + AGE
                ================================================== -->

                <div class="two-columns">


                    <div class="field">

                        <label>

                            लिंग

                            <span class="english">
                                / Gender
                            </span>

                        </label>


                        <select
                            name="gender"
                            required
                        >

                            <option value="">
                                लिंग निवडा / Select gender
                            </option>

                            <option value="Male">
                                पुरुष / Male
                            </option>

                            <option value="Female">
                                महिला / Female
                            </option>

                            <option value="Other">
                                इतर / Other
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>

                            वय

                            <span class="english">
                                / Age
                            </span>

                        </label>


                        <input
                            type="number"
                            name="age"
                            placeholder="वय / Age"
                            min="1"
                            max="120"
                            inputmode="numeric"
                            required
                        >

                    </div>

                </div>


                <!-- =================================================
                     MOBILE
                ================================================== -->

                <div class="field">

                    <label>

                        मोबाईल नंबर

                        <span class="english">
                            / Mobile Number
                        </span>

                    </label>


                    <input
                        type="tel"
                        name="mobile"
                        id="mobile"
                        placeholder="10 अंकी मोबाईल नंबर / 10-digit mobile number"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>


                <!-- =================================================
                     ADDRESS
                ================================================== -->

                <div class="field">

                    <label>

                        पत्ता

                        <span class="english">
                            / Address
                        </span>

                    </label>


                    <textarea
                        name="address"
                        placeholder="रुग्णाचा पत्ता लिहा / Enter patient address"
                        autocomplete="street-address"
                        required
                    ></textarea>

                </div>


                <!-- =================================================
                     DATE
                ================================================== -->

                <div class="field">

                    <label>

                        भेटीची तारीख

                        <span class="english">
                            / Appointment Date
                        </span>

                    </label>


                    <input
                        type="date"
                        name="appointment_date"
                        id="appointment_date"
                        required
                    >

                </div>


                <!-- =================================================
                     TIME
                ================================================== -->

                <div class="field">

                    <label>

                        भेटीची वेळ

                        <span class="english">
                            / Appointment Time
                        </span>

                    </label>


                    <select
                        name="appointment_time"
                        id="appointment_time"
                        required
                    >

                        <option value="">
                            आधी डॉक्टर निवडा / Select doctor first
                        </option>

                    </select>

                </div>


                <div
                    class="availability-message"
                    id="availabilityMessage"
                >
                </div>


                <!-- =================================================
                     BOOK BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >

                    अपॉइंटमेंट बुक करा

                    <span style="
                        opacity:.85;
                        font-size:12px;
                        margin-left:4px;
                    ">
                        / Book Appointment
                    </span>

                </button>


                <!-- =================================================
                     SECURITY
                ================================================== -->

                <div class="secure-note">

                    🔒

                    <span>
                        तुमची माहिती सुरक्षित ठेवली जाते
                        / Your appointment information is handled securely.
                    </span>

                </div>

            </form>

        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
    getMessaging,
    getToken,
    onMessage
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"
};


const app = initializeApp(firebaseConfig);

const messaging = getMessaging(app);


/* =====================================================
   FCM
===================================================== */

async function initFCM() {

    try {

        if (!("serviceWorker" in navigator)) {

            console.log(
                "Service Worker not supported"
            );

            return;
        }


        const registration =
            await navigator.serviceWorker.register(
                "/firebase-messaging-sw.js",
                {
                    scope: "/"
                }
            );


        await navigator.serviceWorker.ready;


        console.log(
            "Firebase Service Worker Ready"
        );


        let permission =
            Notification.permission;


        if (permission === "default") {

            permission =
                await Notification.requestPermission();
        }


        if (permission !== "granted") {

            console.log(
                "Notification permission:",
                permission
            );

            return;
        }


        const token =
            await getToken(
                messaging,
                {

                    vapidKey:
                        "BBIL-L4suxk0pq4CIojiB6lurKy8GjoDhRaFWnZkXEfHV-I8vn1AIRhTYPnFvL40YNzLrjWLUgoQc00m4D68HLw",

                    serviceWorkerRegistration:
                        registration
                }
            );


        if (token) {

            console.log(
                "FCM TOKEN:",
                token
            );


            const tokenInput =
                document.getElementById(
                    "fcm_token"
                );


            if (tokenInput) {

                tokenInput.value =
                    token;
            }

        } else {

            console.log(
                "FCM token was not generated"
            );
        }

    }
    catch (error) {

        console.error(
            "FCM ERROR:",
            error
        );

    }

}


initFCM();


/* =====================================================
   FOREGROUND NOTIFICATION
===================================================== */

onMessage(
    messaging,
    function(payload) {

        console.log(
            "FOREGROUND MESSAGE:",
            payload
        );


        const title =
            payload.notification?.title ||
            payload.data?.title ||
            "Hospital Reminder";


        const body =
            payload.notification?.body ||
            payload.data?.body ||
            "You have a hospital reminder.";


        if (
            Notification.permission ===
            "granted"
        ) {

            new Notification(
                title,
                {
                    body: body,
                    icon: "/static/icon.png"
                }
            );

        }

    }
);


/* =====================================================
   APPOINTMENT DATE
===================================================== */

const dateInput =
    document.getElementById(
        "appointment_date"
    );


if (dateInput) {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    const today =
        `${year}-${month}-${day}`;


    dateInput.min =
        today;
}


/* =====================================================
   DOCTOR → OPD TIME
===================================================== */

const doctorSelect =
    document.getElementById(
        "doctor_name"
    );


const timeSelect =
    document.getElementById(
        "appointment_time"
    );


const availabilityMessage =
    document.getElementById(
        "availabilityMessage"
    );


doctorSelect.addEventListener(
    "change",
    function() {

        const selected =
            doctorSelect.options[
                doctorSelect.selectedIndex
            ];


        const opdTime =
            selected.dataset.opdTime;


        timeSelect.innerHTML = "";


        if (!doctorSelect.value) {

            const option =
                document.createElement(
                    "option"
                );

            option.value = "";

            option.textContent =
                "आधी डॉक्टर निवडा / Select doctor first";

            timeSelect.appendChild(
                option
            );

            availabilityMessage.style.display =
                "none";

            return;
        }


        /*
         * If Flask sends doctor.opd_time,
         * use it here.
         */

        if (opdTime) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                opdTime;

            option.textContent =
                opdTime;

            timeSelect.appendChild(
                option
            );


            availabilityMessage.innerHTML =
                "🕐 डॉक्टरची OPD वेळ: <strong>" +
                opdTime +
                "</strong>";

            availabilityMessage.style.display =
                "block";

        }

        else {

            /*
             * Fallback if opd_time is not
             * available in hospital data.
             */

            const morning =
                document.createElement(
                    "option"
                );

            morning.value =
                "Morning";

            morning.textContent =
                "सकाळी / Morning";


            const afternoon =
                document.createElement(
                    "option"
                );

            afternoon.value =
                "Afternoon";

            afternoon.textContent =
                "दुपारी / Afternoon";


            const evening =
                document.createElement(
                    "option"
                );

            evening.value =
                "Evening";

            evening.textContent =
                "संध्याकाळी / Evening";


            timeSelect.appendChild(
                morning
            );

            timeSelect.appendChild(
                afternoon
            );

            timeSelect.appendChild(
                evening
            );


            availabilityMessage.innerHTML =
                "🕐 उपलब्ध वेळ निवडा / Select your preferred time.";

            availabilityMessage.style.display =
                "block";
        }

    }
);


/* =====================================================
   MOBILE NUMBER CLEANING
===================================================== */

const mobileInput =
    document.getElementById(
        "mobile"
    );


mobileInput.addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);


/* =====================================================
   FORM SUBMIT
===================================================== */

const form =
    document.getElementById(
        "appointmentForm"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


form.addEventListener(
    "submit",
    function(event) {

        const mobile =
            mobileInput.value.trim();


        if (
            !/^[0-9]{10}$/.test(
                mobile
            )
        ) {

            event.preventDefault();


            alert(
                "कृपया योग्य 10 अंकी मोबाईल नंबर टाका.\nPlease enter a valid 10-digit mobile number."
            );


            mobileInput.focus();

            return;
        }


        if (!doctorSelect.value) {

            event.preventDefault();


            alert(
                "कृपया डॉक्टर निवडा.\nPlease select a doctor."
            );


            doctorSelect.focus();

            return;
        }


        if (!timeSelect.value) {

            event.preventDefault();


            alert(
                "कृपया अपॉइंटमेंटची वेळ निवडा.\nPlease select appointment time."
            );


            timeSelect.focus();

            return;
        }


        submitBtn.disabled =
            true;


        submitBtn.innerHTML =
            "अपॉइंटमेंट बुक होत आहे... / Booking Appointment...";

    }
);

</script>

</body>

</html>
