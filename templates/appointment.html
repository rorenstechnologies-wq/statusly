<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f766e"
    >

    <title>Book Appointment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f766e 0%,
                    #0e7490 45%,
                    #164e63 100%
                );

            color: #172033;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .page-background {

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(8, 35, 45, 0.70),
                    rgba(8, 35, 45, 0.82)
                ),
                url(
                    "https://images.unsplash.com/photo-1586773860418-d37222d8fce3"
                )
                center center /
                cover no-repeat;

            z-index: -2;

        }


        .page-glow {

            position: fixed;

            width: 260px;

            height: 260px;

            border-radius: 50%;

            background:
                rgba(45, 212, 191, 0.18);

            filter:
                blur(70px);

            top: -80px;

            left: -80px;

            z-index: -1;

        }


        .page-glow-two {

            position: fixed;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            background:
                rgba(56, 189, 248, 0.15);

            filter:
                blur(75px);

            bottom: -100px;

            right: -100px;

            z-index: -1;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .appointment-card {

            width: 100%;

            max-width: 510px;

            background:
                rgba(255,255,255,0.97);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.30);

            animation:
                cardIn 0.55s ease;

        }


        @keyframes cardIn {

            from {
                opacity: 0;
                transform:
                    translateY(24px)
                    scale(0.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .card-header {

            position: relative;

            padding: 28px 26px 24px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

        }


        .header-top {

            display: flex;

            align-items: center;

            gap: 14px;

        }


        .hospital-icon {

            width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.16);

            border:
                1px solid
                rgba(255,255,255,0.22);

            font-size: 25px;

            flex-shrink: 0;

        }


        .header-title {

            min-width: 0;

        }


        .header-title h1 {

            margin: 0;

            font-size: 24px;

            font-weight: 750;

            letter-spacing:
                -0.4px;

        }


        .header-title p {

            margin: 5px 0 0;

            font-size: 13px;

            opacity: 0.84;

        }


        .hospital-name {

            margin-top: 20px;

            padding: 12px 14px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid
                rgba(255,255,255,0.15);

            font-size: 14px;

            line-height: 1.45;

            word-break: break-word;

        }


        .hospital-name strong {

            display: block;

            margin-bottom: 3px;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 0.9px;

            opacity: 0.72;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-container {

            padding: 26px;

            background: white;

        }


        .section-label {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 16px;

            color: #334155;

            font-size: 14px;

            font-weight: 700;

        }


        .section-label span {

            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background:
                #e6fffb;

            color:
                #0f766e;

            font-size: 14px;

        }


        /* =====================================================
           INPUT GROUP
        ===================================================== */

        .field {

            margin-bottom: 15px;

        }


        .field label {

            display: block;

            margin-bottom: 7px;

            color: #475569;

            font-size: 13px;

            font-weight: 650;

        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #dbe4ea;

            border-radius: 12px;

            background: #f8fafc;

            color: #172033;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        input,
        select {

            height: 48px;

            padding:
                0 14px;

        }


        textarea {

            min-height: 105px;

            padding:
                13px 14px;

            resize: vertical;

        }


        input::placeholder,
        textarea::placeholder {

            color: #94a3b8;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                #0f766e;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(15,118,110,0.10);

        }


        /* =====================================================
           TWO COLUMN FIELDS
        ===================================================== */

        .two-columns {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

        }


        /* =====================================================
           SUBMIT
        ===================================================== */

        .submit-btn {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(15,118,110,0.22);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;

        }


        .submit-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 14px 25px
                rgba(15,118,110,0.28);

        }


        .submit-btn:active {

            transform:
                translateY(0);

        }


        .submit-btn:disabled {

            opacity: 0.65;

            cursor: wait;

            transform: none;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .secure-note {

            margin-top: 16px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            color: #64748b;

            font-size: 11px;

            text-align: center;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {

                padding: 12px;

                align-items: flex-start;

            }


            .appointment-card {

                margin:
                    8px 0;

                border-radius:
                    20px;

            }


            .card-header {

                padding:
                    22px 18px 19px;

            }


            .header-title h1 {

                font-size: 21px;

            }


            .header-title p {

                font-size: 12px;

            }


            .hospital-icon {

                width: 46px;

                height: 46px;

                border-radius: 14px;

            }


            .form-container {

                padding:
                    20px 16px 18px;

            }


            .two-columns {

                grid-template-columns:
                    1fr;

                gap: 0;

            }


            input,
            select {

                height: 48px;

            }


            textarea {

                min-height: 100px;

            }


            .submit-btn {

                height: 52px;

            }

        }


        @media (max-width: 380px) {

            .page {

                padding: 8px;

            }


            .card-header {

                padding:
                    19px 15px;

            }


            .form-container {

                padding:
                    18px 13px;

            }


            .header-title h1 {

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


<div class="page-background"></div>

<div class="page-glow"></div>

<div class="page-glow-two"></div>


<div class="page">


    <div class="appointment-card">


        <!-- =================================================
             HEADER
        ================================================= -->

        <div class="card-header">


            <div class="header-top">


                <div class="hospital-icon">
                    🏥
                </div>


                <div class="header-title">

                    <h1>
                        Book Appointment
                    </h1>

                    <p>
                        Schedule your visit quickly and easily
                    </p>

                </div>


            </div>


            <div class="hospital-name">

                <strong>
                    Hospital
                </strong>

                {{ hospital.hospital_name }}

            </div>


        </div>


        <!-- =================================================
             FORM
        ================================================= -->

        <div class="form-container">


            <div class="section-label">

                <span>
                    ✦
                </span>

                Appointment Details

            </div>


            <form
                action="/book_appointment"
                method="POST"
                id="appointmentForm"
            >


                <input
                    type="hidden"
                    name="hospital_id"
                    value="{{ uid }}"
                >


                <input
                    type="hidden"
                    name="fcm_token"
                    id="fcm_token"
                >


                <!-- =================================================
                     DOCTOR
                ================================================= -->

                <div class="field">

                    <label>
                        Select Doctor
                    </label>

                    <select
                        name="doctor_name"
                        required
                    >

                        <option value="">
                            Choose a doctor
                        </option>


                        {% for doctor in hospital.doctors %}

                        <option
                            value="{{ doctor.doctor_name }}"
                        >

                            Dr. {{ doctor.doctor_name }}
                            —
                            {{ doctor.specialization }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- =================================================
                     PATIENT NAME
                ================================================= -->

                <div class="field">

                    <label>
                        Patient Name
                    </label>

                    <input
                        type="text"
                        name="patient_name"
                        placeholder="Enter patient name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- =================================================
                     GENDER + AGE
                ================================================= -->

                <div class="two-columns">


                    <div class="field">

                        <label>
                            Gender
                        </label>

                        <select
                            name="gender"
                            required
                        >

                            <option value="">
                                Select gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            placeholder="Age"
                            min="1"
                            max="120"
                            inputmode="numeric"
                            required
                        >

                    </div>


                </div>


                <!-- =================================================
                     MOBILE
                ================================================= -->

                <div class="field">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        placeholder="10-digit mobile number"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- =================================================
                     ADDRESS
                ================================================= -->

                <div class="field">

                    <label>
                        Address
                    </label>

                    <textarea
                        name="address"
                        placeholder="Enter patient address"
                        required
                    ></textarea>

                </div>


                <!-- =================================================
                     DATE
                ================================================= -->

                <div class="field">

                    <label>
                        Appointment Date
                    </label>

                    <input
                        type="date"
                        name="appointment_date"
                        required
                    >

                </div>


                <!-- =================================================
                     BUTTON
                ================================================= -->

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    Book Appointment
                </button>


                <div class="secure-note">

                    🔒 Your appointment information is handled securely.

                </div>


            </form>


        </div>


    </div>


</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {
    getMessaging,
    getToken,
    onMessage
}
from
"https://www.gstatic.com/firebasejs/12.17.0/firebase-messaging.js";


// =====================================================
// FIREBASE CONFIG
// =====================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


const app =
    initializeApp(
        firebaseConfig
    );


const messaging =
    getMessaging(
        app
    );


// =====================================================
// FCM INITIALIZATION
// =====================================================

async function initFCM() {

    try {

        const registration =
            await navigator.serviceWorker.register(
                "/firebase-messaging-sw.js",
                {
                    scope: "/"
                }
            );


        await navigator.serviceWorker.ready;


        console.log(
            "Service Worker Ready"
        );


        let permission =
            Notification.permission;


        if (
            permission ===
            "default"
        ) {

            permission =
                await Notification.requestPermission();

        }


        if (
            permission !==
            "granted"
        ) {

            console.log(
                "Notification permission:",
                permission
            );

            return;

        }


        const token =
            await getToken(
                messaging,
                {

                    vapidKey:
                        "BBIL-L4suxk0pq4CIojiB6lurKy8GjoDhRaFWnZkXEfHV-I8vn1AIRhTYPnFvL40YNzLrjWLUgoQc00m4D68HLw",

                    serviceWorkerRegistration:
                        registration

                }
            );


        if (token) {

            console.log(
                "FCM TOKEN:",
                token
            );


            document.getElementById(
                "fcm_token"
            ).value =
                token;

        } else {

            console.log(
                "FCM TOKEN NOT GENERATED"
            );

        }

    }
    catch(error) {

        console.error(
            "FCM ERROR:",
            error
        );

    }

}


initFCM();


// =====================================================
// FOREGROUND NOTIFICATION
// =====================================================

onMessage(
    messaging,
    function(payload) {

        console.log(
            "FOREGROUND MESSAGE:",
            payload
        );


        const title =
            payload.notification?.title ||
            payload.data?.title ||
            "Hospital Reminder";


        const body =
            payload.notification?.body ||
            payload.data?.body ||
            "You have a hospital reminder.";


        if (
            Notification.permission ===
            "granted"
        ) {

            new Notification(
                title,
                {
                    body:
                        body,

                    icon:
                        "/static/icon.png"
                }
            );

        }

    }
);


// =====================================================
// FORM
// =====================================================

const form =
    document.getElementById(
        "appointmentForm"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


form.addEventListener(
    "submit",
    function() {

        /*
            Do NOT block booking when
            notification permission is denied.

            FCM is optional.
        */

        submitBtn.disabled =
            true;

        submitBtn.innerText =
            "Booking Appointment...";

    }
);

</script>


</body>

</html>
