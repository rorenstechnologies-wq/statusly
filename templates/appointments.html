<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Statusly | Doctor Appointments</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: #f4f8fb;
            color: #172033;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .page {
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;
            padding: 24px 30px;

            box-shadow:
                0 8px 25px
                rgba(15, 118, 110, .16);
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .header-title h1 {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .header-title p {
            font-size: 12px;
            opacity: .85;
        }

        .back-btn {
            text-decoration: none;
            color: white;

            border:
                1px solid
                rgba(255,255,255,.3);

            background:
                rgba(255,255,255,.10);

            padding: 10px 15px;
            border-radius: 9px;

            font-size: 12px;
            font-weight: 700;
        }

        .back-btn:hover {
            background:
                rgba(255,255,255,.18);
        }


        /* MAIN */

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 25px 20px 50px;
        }


        /* FILTERS */

        .filter-box {
            background: white;

            border:
                1px solid #e3ebef;

            border-radius: 15px;

            padding: 18px;

            box-shadow:
                0 5px 18px
                rgba(15,23,42,.05);

            margin-bottom: 20px;
        }

        .filter-grid {
            display: grid;

            grid-template-columns:
                1fr 1.5fr 1fr;

            gap: 14px;
        }

        .filter-group label {
            display: block;

            font-size: 11px;
            font-weight: 800;

            color: #475569;

            margin-bottom: 6px;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;

            height: 43px;

            border:
                1px solid #dbe5ea;

            border-radius: 9px;

            padding: 0 12px;

            background: #fbfdfe;

            color: #172033;

            outline: none;

            font-size: 12px;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #0f766e;

            box-shadow:
                0 0 0 3px
                rgba(15,118,110,.08);
        }


        /* SUMMARY */

        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 22px;
        }

        .summary-card {
            background: white;

            border:
                1px solid #e3ebef;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 5px 18px
                rgba(15,23,42,.04);
        }

        .summary-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .summary-value {
            font-size: 25px;
            font-weight: 800;
            color: #0f766e;
        }


        /* DOCTOR CARD */

        .doctor-card {
            background: white;

            border:
                1px solid #e2eaee;

            border-radius: 16px;

            margin-bottom: 20px;

            overflow: hidden;

            box-shadow:
                0 6px 22px
                rgba(15,23,42,.05);
        }

        .doctor-header {
            padding: 16px 20px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border-bottom:
                1px solid #e5edf0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .doctor-name {
            font-size: 16px;
            font-weight: 800;
            color: #134e4a;
        }

        .doctor-count {
            background: #dff7f2;

            color: #0f766e;

            padding: 6px 10px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 800;
        }


        /* SECTION */

        .date-section {
            padding: 18px 20px;
        }

        .date-section + .date-section {
            border-top:
                1px solid #edf2f5;
        }

        .section-title {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }

        .section-title h3 {
            font-size: 13px;
            font-weight: 800;
        }

        .section-title span {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
        }


        /* TABLE */

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            text-align: left;

            padding:
                11px 10px;

            background:
                #f8fafc;

            color:
                #64748b;

            font-size:
                10px;

            font-weight:
                800;

            border-bottom:
                1px solid #e8eef1;

            white-space:
                nowrap;
        }

        td {
            padding:
                12px 10px;

            border-bottom:
                1px solid #edf2f5;

            font-size:
                11px;

            vertical-align:
                middle;
        }

        tbody tr:hover {
            background:
                #fafffe;
        }

        .patient-name {
            font-weight: 800;
            color: #1e293b;
        }

        .mobile {
            color: #475569;
        }

        .date {
            font-weight: 700;
            white-space: nowrap;
        }


        /* STATUS */

        .status {
            display: inline-flex;

            align-items: center;

            padding:
                5px 8px;

            border-radius:
                999px;

            font-size:
                9px;

            font-weight:
                800;
        }

        .status-new {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-old {
            background: #dcfce7;
            color: #15803d;
        }


        /* VISIT */

        .visit-badge {
            display: inline-block;

            background:
                #f1f5f9;

            color:
                #334155;

            padding:
                5px 8px;

            border-radius:
                7px;

            font-size:
                9px;

            font-weight:
                800;
        }


        /* AMOUNT */

        .amount-wrap {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .amount-input {
            width: 82px;

            height: 33px;

            border:
                1px solid #dbe5ea;

            border-radius:
                7px;

            padding:
                0 8px;

            font-size:
                11px;

            outline:
                none;
        }

        .amount-input:focus {
            border-color: #0f766e;
        }

        .save-amount {
            border: none;

            background: #0f766e;

            color: white;

            width: 31px;

            height: 31px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;
        }

        .save-amount:hover {
            background: #115e59;
        }


        /* ACTIONS */

        .action-wrap {
            display: flex;

            gap: 6px;

            flex-wrap: wrap;
        }

        .action-btn {
            border: none;

            padding:
                7px 10px;

            border-radius:
                7px;

            font-size:
                9px;

            font-weight:
                800;

            cursor:
                pointer;
        }

        .details-btn {
            background:
                #e0f2fe;

            color:
                #0369a1;
        }

        .details-btn:hover {
            background:
                #bae6fd;
        }

        .follow-btn {
            background:
                #0f766e;

            color:
                white;

            text-decoration:
                none;
        }

        .follow-btn:hover {
            background:
                #115e59;
        }

        .old-btn {
            background:
                #fef3c7;

            color:
                #92400e;
        }

        .old-btn:hover {
            background:
                #fde68a;
        }


        /* EMPTY */

        .empty {
            text-align: center;

            padding: 45px 20px;

            color: #64748b;
        }

        .empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .empty h3 {
            font-size: 15px;
            color: #334155;
            margin-bottom: 5px;
        }

        .empty p {
            font-size: 11px;
        }


        /* MODAL */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(15,23,42,.55);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;

            max-width: 850px;

            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border-radius: 17px;

            box-shadow:
                0 25px 70px
                rgba(15,23,42,.25);
        }

        .modal-header {
            padding: 18px 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            position: sticky;

            top: 0;

            z-index: 2;
        }

        .modal-header h2 {
            font-size: 16px;
        }

        .close-btn {
            width: 32px;

            height: 32px;

            border: none;

            border-radius: 8px;

            background:
                rgba(255,255,255,.15);

            color: white;

            cursor: pointer;

            font-size: 18px;
        }

        .modal-body {
            padding: 22px;
        }


        /* DETAILS */

        .patient-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding-bottom: 18px;

            margin-bottom: 18px;

            border-bottom:
                1px solid #edf2f5;
        }

        .patient-top h3 {
            font-size: 20px;

            margin-bottom: 5px;
        }

        .patient-top p {
            font-size: 11px;
            color: #64748b;
        }

        .detail-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 22px;
        }

        .detail-item {
            background:
                #f8fafc;

            border:
                1px solid #edf2f5;

            border-radius:
                10px;

            padding:
                12px;
        }

        .detail-label {
            font-size:
                9px;

            color:
                #64748b;

            font-weight:
                800;

            margin-bottom:
                5px;
        }

        .detail-value {
            font-size:
                12px;

            color:
                #1e293b;

            font-weight:
                700;

            word-break:
                break-word;
        }

        .history-title {
            font-size:
                14px;

            font-weight:
                800;

            margin-bottom:
                10px;

            color:
                #134e4a;
        }

        .history-table {
            overflow-x: auto;
        }

        .history-table table {
            min-width: 650px;
        }

        .history-table th,
        .history-table td {
            font-size: 10px;
        }

        .total-paid {
            margin-top:
                12px;

            padding:
                12px;

            background:
                #ecfdf5;

            color:
                #166534;

            border-radius:
                9px;

            font-size:
                12px;

            font-weight:
                800;

            text-align:
                right;
        }


        /* AUTH MESSAGE */

        .auth-status {
            position: fixed;

            bottom: 18px;

            right: 18px;

            z-index: 10000;

            padding:
                10px 14px;

            border-radius:
                9px;

            background:
                #0f172a;

            color: white;

            font-size:
                10px;

            display: none;
        }

        .auth-status.show {
            display: block;
        }


        /* RESPONSIVE */

        @media (max-width: 900px) {

            .header {
                padding: 20px;
            }

            .header-inner {
                align-items: flex-start;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .detail-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .header-inner {
                flex-direction: column;
            }

            .header-title h1 {
                font-size: 21px;
            }

            .container {
                padding:
                    15px 10px 35px;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
                gap: 9px;
            }

            .summary-card {
                padding: 13px;
            }

            .summary-value {
                font-size: 20px;
            }

            .doctor-header {
                padding: 13px;
            }

            .date-section {
                padding: 13px;
            }

            .modal-overlay {
                padding: 8px;
            }

            .modal-body {
                padding: 15px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .patient-top {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <header class="header">

        <div class="header-inner">

            <div class="header-title">

                <h1>
                    👨‍⚕️ Doctor Appointments
                </h1>

                <p>
                    Manage patients by doctor and appointment date
                </p>

            </div>


            <a
                href="/dashboard"
                class="back-btn"
            >
                ← Dashboard
            </a>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">


        <!-- FILTERS -->

        <div class="filter-box">

            <div class="filter-grid">


                <div class="filter-group">

                    <label>
                        Doctor
                    </label>

                    <select id="doctorFilter">

                        <option value="all">
                            All Doctors
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label>
                        Search Patient
                    </label>

                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search by patient name or mobile..."
                    >

                </div>


                <div class="filter-group">

                    <label>
                        Appointment Date
                    </label>

                    <input
                        id="dateFilter"
                        type="date"
                    >

                </div>


            </div>

        </div>


        <!-- SUMMARY -->

        <div class="summary-grid">


            <div class="summary-card">

                <div class="summary-label">
                    Total Patients
                </div>

                <div
                    class="summary-value"
                    id="totalPatients"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Doctors
                </div>

                <div
                    class="summary-value"
                    id="totalDoctors"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Today
                </div>

                <div
                    class="summary-value"
                    id="todayPatients"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Upcoming
                </div>

                <div
                    class="summary-value"
                    id="upcomingPatients"
                >
                    0
                </div>

            </div>


        </div>


        <!-- APPOINTMENTS -->

        <div id="doctorCards"></div>


        <div
            id="emptyState"
            class="empty"
            style="display:none;"
        >

            <div class="empty-icon">
                📅
            </div>

            <h3>
                No appointments found
            </h3>

            <p>
                Try changing your filters or add a new appointment.
            </p>

        </div>


    </main>

</div>


<!-- =====================================================
     DETAILS MODAL
====================================================== -->

<div
    id="detailsModal"
    class="modal-overlay"
>


    <div class="modal">


        <div class="modal-header">

            <h2>
                👤 Patient Details
            </h2>

            <button
                class="close-btn"
                onclick="closeDetails()"
            >
                ×
            </button>

        </div>


        <div
            id="detailsBody"
            class="modal-body"
        ></div>


    </div>

</div>


<div
    id="authStatus"
    class="auth-status"
></div>


<!-- =====================================================
     FIREBASE + APPOINTMENT JAVASCRIPT
====================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
====================================================== */

import {
    initializeApp,
    getApps,
    getApp
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* =====================================================
   SAME FIREBASE CONFIG AS LOGIN PAGE
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


/* =====================================================
   INITIALIZE FIREBASE
====================================================== */

let firebaseApp;

try {

    if (getApps().length > 0) {

        firebaseApp = getApp();

    }
    else {

        firebaseApp =
            initializeApp(
                firebaseConfig
            );

    }

}
catch (error) {

    console.error(
        "FIREBASE INITIALIZATION ERROR:",
        error
    );

}


let auth = null;


if (firebaseApp) {

    try {

        auth =
            getAuth(
                firebaseApp
            );

    }
    catch (error) {

        console.error(
            "FIREBASE AUTH ERROR:",
            error
        );

    }

}


/* =====================================================
   SERVER DATA
====================================================== */

const APPOINTMENTS =
    {{ patients | default([]) | tojson | safe }};


const UID =
    {{ uid | default("") | tojson | safe }};


console.log(
    "Appointments loaded:",
    APPOINTMENTS
);

console.log(
    "Hospital UID:",
    UID
);


/* =====================================================
   AUTH READY
====================================================== */

let currentUser = null;

let authReadyResolve;

const authReady =
    new Promise(
        resolve => {

            authReadyResolve =
                resolve;

        }
    );


if (auth) {

    onAuthStateChanged(
        auth,
        user => {

            currentUser = user || null;

            authReadyResolve(
                currentUser
            );

            if (user) {

                console.log(
                    "FIREBASE SESSION ACTIVE:",
                    user.uid
                );

            }
            else {

                console.log(
                    "NO FIREBASE USER CURRENTLY SIGNED IN"
                );

            }

        }
    );

}
else {

    authReadyResolve(null);

}


/* =====================================================
   GET AUTH TOKEN
====================================================== */

async function getStatuslyToken() {

    const user =
        await authReady;

    if (!user) {

        throw new Error(
            "Login session not found. Please login again."
        );

    }

    const token =
        await user.getIdToken(
            true
        );

    if (!token) {

        throw new Error(
            "Firebase authentication token missing."
        );

    }

    return token;

}


/* =====================================================
   AUTHENTICATED FETCH
====================================================== */

async function statuslyFetch(
    url,
    options = {}
) {

    const token =
        await getStatuslyToken();


    const headers = {

        ...(options.headers || {}),

        "Authorization":
            "Bearer " + token,

        "Content-Type":
            "application/json"

    };


    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}


/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


/* =====================================================
   DATE HELPERS
====================================================== */

function todayISO() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function normalizeDate(value) {

    if (!value) {
        return "";
    }


    const text =
        String(value)
            .trim();


    if (
        /^\d{4}-\d{2}-\d{2}$/
            .test(text)
    ) {

        return text;

    }


    const match =
        text.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
        );


    if (match) {

        const day =
            match[1].padStart(
                2,
                "0"
            );

        const month =
            match[2].padStart(
                2,
                "0"
            );

        const year =
            match[3];

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    const date =
        new Date(text);


    if (
        !Number.isNaN(
            date.getTime()
        )
    ) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            );

        const day =
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            );

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );

    }


    return "";

}


function formatDate(value) {

    const normalized =
        normalizeDate(value);

    if (!normalized) {
        return value || "-";
    }

    const parts =
        normalized.split("-");

    if (parts.length !== 3) {
        return value || "-";
    }

    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* =====================================================
   SAFE NUMBER
====================================================== */

function numericAmount(value) {

    const number =
        Number(value);

    if (
        Number.isFinite(number)
    ) {

        return number;

    }

    return 0;

}


function formatAmount(value) {

    const amount =
        numericAmount(value);

    return (
        "₹" +
        amount.toLocaleString(
            "en-IN",
            {
                maximumFractionDigits: 2
            }
        )
    );

}


/* =====================================================
   DOCTOR LIST
====================================================== */

function buildDoctorFilter() {

    const select =
        document.getElementById(
            "doctorFilter"
        );


    const doctors =

                APPOINTMENTS
                    .map(
                        p =>
                            (
                                p.doctor_name ||

                            )
                            .trim()
                    )
                    .filter(Boolean)
            )
        ]

        );

                );

            );

/* =====================================================
   FILTER
====================================================== */

function getFilteredAppointments() {

    const doctor =
        document
            .getElementById(
                "doctorFilter"
            )
            .value;


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const selectedDate =
        document
            .getElementById(
                "dateFilter"
            )
            .value;


    return APPOINTMENTS.filter(
        appointment => {


            const appointmentDoctor =
                (
                    appointment.doctor_name ||
                    "Unknown Doctor"
                ).trim();


            if (
                doctor !== "all" &&
                appointmentDoctor !== doctor
            ) {

                return false;

            }


            if (search) {

                const name =
                    String(
                        appointment.patient_name ||
                        ""
                    ).toLowerCase();

                const mobile =
                    String(
                        appointment.mobile ||
                        ""
                    ).toLowerCase();

                if (
                    !name.includes(search) &&
                    !mobile.includes(search)
                ) {

                    return false;

                }

            }


            if (selectedDate) {

                const appointmentDate =
                    normalizeDate(
                        appointment.appointment_date
                    );

                if (
                    appointmentDate !==
                    selectedDate
                ) {

                    return false;

                }

            }


            return true;

        }
    );

}


/* =====================================================
   SORT
====================================================== */

function sortAppointments(list) {

    return [
        ...list
    ].sort(
        (a, b) => {

            const dateA =
                normalizeDate(
                    a.appointment_date
                );

            const dateB =
                normalizeDate(
                    b.appointment_date
                );


            const timeA =
                String(
                    a.appointment_time ||
                    ""
                );

            const timeB =
                String(
                    b.appointment_time ||
                    ""
                );


            const valueA =
                new Date(
                    (
                        dateA ||
                        "1970-01-01"
                    ) +
                    "T" +
                    (
                        timeA ||
                        "00:00"
                    )
                ).getTime();


            const valueB =
                new Date(
                    (
                        dateB ||
                        "1970-01-01"
                    ) +
                    "T" +
                    (
                        timeB ||
                        "00:00"
                    )
                ).getTime();


            if (
                Number.isNaN(valueA) &&
                Number.isNaN(valueB)
            ) {

                return 0;

            }


            if (
                Number.isNaN(valueA)
            ) {

                return 1;

            }


            if (
                Number.isNaN(valueB)
            ) {

                return -1;

            }


            return valueB - valueA;

        }
    );

}


/* =====================================================
   APPOINTMENT CATEGORY
====================================================== */

function getCategory(appointment) {

    const date =
        normalizeDate(
            appointment.appointment_date
        );

    const today =
        todayISO();


    if (!date) {

        return "past";

    }


    if (date === today) {

        return "today";

    }


    if (date > today) {

        return "upcoming";

    }


    return "past";

}


/* =====================================================
   SUMMARY
====================================================== */

function updateSummary(list) {

    const today =
        todayISO();


    const todayCount =
        list.filter(
            p =>
                normalizeDate(
                    p.appointment_date
                ) === today
        ).length;


    const upcomingCount =
        list.filter(
            p =>
                getCategory(p) ===
                "upcoming"
        ).length;


    document.getElementById(
        "totalPatients"
    ).textContent =
        list.length;


    document.getElementById(
        "todayPatients"
    ).textContent =
        todayCount;


    document.getElementById(
        "upcomingPatients"
    ).textContent =
        upcomingCount;

}

        );

        String(
            appointment.patient_status ||
            ""
        )

    if (visit === 1) {

    else if (

    ) {

/* =====================================================
   DOCTOR CARD
====================================================== */

function createDoctorCard(
    doctor,
    list
) {

    const card =
        document.createElement(
            "section"
        );

    card.className =
        "doctor-card";


    const header =
        document.createElement(
            "div"
        );

    header.className =
        "doctor-header";


    header.innerHTML = `

        <div class="doctor-name">
            👨‍⚕️ ${escapeHtml(doctor)}
        </div>

        <div class="doctor-count">
            ${list.length} appointment${list.length === 1 ? "" : "s"}
        </div>

    `;


    card.appendChild(
        header
    );


    const categories = [
        {
            key: "today",
            title: "TODAY"
        },
        {
            key: "upcoming",
            title: "UPCOMING"
        },
        {
            key: "past",
            title: "PAST"
        }
    ];


    categories.forEach(
        category => {

            const sectionList =
                sortAppointments(
                    list.filter(
                        p =>
                            getCategory(p) ===
                            category.key
                    )
                );


            if (!sectionList.length) {

                return;

            }


            const section =
                document.createElement(
                    "div"
                );

            section.className =
                "date-section";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "section-title";


            title.innerHTML = `

                <h3>
                    ${
                        category.key === "today"
                            ? "📅 "
                            : category.key === "upcoming"
                                ? "🔜 "
                                : "🗂️ "
                    }
                    ${category.title}
                </h3>

                <span>
                    ${sectionList.length} record${sectionList.length === 1 ? "" : "s"}
                </span>

            `;


            section.appendChild(
                title
            );


            section.appendChild(
                createTable(
                    sectionList
                )
            );


            card.appendChild(
                section
            );

        }
    );


    return card;

}


/* =====================================================
   RENDER
====================================================== */

function renderAppointments() {

    const list =
        sortAppointments(
            getFilteredAppointments()
        );


    updateSummary(
        list
    );


    const container =
        document.getElementById(
            "doctorCards"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    container.innerHTML = "";


    if (!list.length) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    const grouped = {};


    list.forEach(
        appointment => {

            const doctor =
                (
                    appointment.doctor_name ||
                    "Unknown Doctor"
                ).trim();


            if (
                !grouped[doctor]
            ) {

                grouped[doctor] =
                    [];

            }


            grouped[doctor].push(
                appointment
            );

        }
    );


    Object.keys(grouped)
        .sort(
            (a, b) =>
                a.localeCompare(b)
        )
        .forEach(
            doctor => {

                container.appendChild(
                    createDoctorCard(
                        doctor,
                        grouped[doctor]
                    )
                );

            }
        );

}

/* =====================================================
   MAKE PATIENT OLD
====================================================== */

window.makePatientOld =
async function(
    appointmentId
) {

    const appointment =
        APPOINTMENTS.find(
            p =>
                String(p.id) ===
                String(appointmentId)
        );


    if (!appointment) {

        alert(
            "Appointment not found."
        );

        return;

    }


    const mobile =
        appointment.mobile ||
        "";


    if (!mobile) {

        alert(
            "Patient mobile number is missing."
        );

        return;

    }


    const confirmed =
        window.confirm(
            "Make this patient OLD?\n\nVisit 1 will remain NEW. Future visits will be OLD."
        );


    if (!confirmed) {

        return;

    }


    try {

        showAuthStatus(
            "Updating patient status..."
        );


        const response =
            await statuslyFetch(
                "/api/doctor/make-patient-old",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                mobile:
                                    mobile
                            }
                        )

                }
            );


        const data =
            await response.json()
                .catch(
                    () => ({})
                );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to update patient status."
            );

        }


        if (
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "Unable to update patient status."
            );

        }


        hideAuthStatus();


        alert(
            "Patient marked as OLD successfully."
        );


        window.location.reload();

    }
    catch(error) {

        hideAuthStatus();


        console.error(
            "MAKE OLD ERROR:",
            error
        );


        if (
            error.message.includes(
                "Login session not found"
            )
        ) {

            alert(
                "Login session not found. Please login again."
            );

            return;

        }


        alert(
            error.message ||
            "Unable to update patient status."
        );

    }

};

        );

    }

        );

    ) {

        );

        return;

        button.textContent;

        "...";


    try {

        const response =
            await statuslyFetch(
                "/api/appointment/" +
                encodeURIComponent(
                    appointmentId
                ) +
                "/amount",
                {

                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                amount:
                                    amount
                            }
                        )

                }
            );


        const data =
            await response.json()
                .catch(
                    () => ({})
                );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to update amount."
            );

        }


        if (
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "Unable to update amount."
            );

        }


        const appointment =
            APPOINTMENTS.find(
                p =>
                    String(p.id) ===
                    String(appointmentId)
            );


        if (appointment) {

            appointment.amount =
                amount;

        }


        button.textContent =
            "✓";


        button.title =
            "Saved";


        setTimeout(
            () => {

                button.title =
                    "Save amount";

                button.disabled =
                    false;

                button.textContent =
                    oldText;

            },
            1000
        );


    }
    catch(error) {

        button.disabled =
            false;

        button.textContent =
            oldText;


        console.error(
            "SAVE AMOUNT ERROR:",
            error
        );


        if (
            error.message.includes(
                "Login session not found"
            )
        ) {

            alert(
                "Login session not found. Please login again."
            );

            return;

        }


        alert(
            error.message ||
            "Unable to update amount."
        );

    }

};

====================================================== */

function showAuthStatus(
    message
) {

    const element =
        document.getElementById(
            "authStatus"
        );


    element.textContent =
        message;


    element.classList.add(
        "show"
    );

}


function hideAuthStatus() {

    const element =
        document.getElementById(
            "authStatus"
        );


    element.classList.remove(
        "show"
    );

}
