<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Appointments | Statusly</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f8fb;
            color: #172033;
        }

        button,
        input,
        select,
        a {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        button,
        a {
            touch-action: manipulation;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {

            position: sticky;
            top: 0;

            z-index: 1000;

            background:
                linear-gradient(
                    135deg,
                    #0f766e 0%,
                    #0e7490 55%,
                    #155e75 100%
                );

            color: white;

            padding: 22px 30px;

            box-shadow:
                0 6px 25px
                rgba(15, 118, 110, .18);
        }

        .header-inner {

            max-width: 1500px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .brand-area {

            display: flex;

            align-items: center;

            gap: 14px;

            min-width: 0;
        }

        .brand-icon {

            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background:
                rgba(255,255,255,.16);

            border:
                1px solid
                rgba(255,255,255,.20);

            font-size: 25px;
        }

        .header h1 {

            margin: 0;

            font-size: 24px;

            line-height: 1.2;

            font-weight: 800;

            letter-spacing: -.3px;
        }

        .header p {

            margin: 5px 0 0;

            font-size: 13px;

            color:
                rgba(255,255,255,.82);
        }

        .header-status {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 9px 13px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.13);

            border:
                1px solid
                rgba(255,255,255,.16);

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;
        }

        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #86efac;

            box-shadow:
                0 0 0 4px
                rgba(134,239,172,.12);
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .container {

            width: 100%;

            max-width: 1500px;

            margin: auto;

            padding: 28px 24px 50px;
        }


        /* =========================================================
           FILTER CARD
        ========================================================= */

        .filter-card {

            background: white;

            border:
                1px solid #e5edf2;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 22px;

            box-shadow:
                0 5px 20px
                rgba(15,23,42,.05);
        }

        .filter-heading {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 16px;
        }

        .filter-heading h3 {

            margin: 0;

            font-size: 15px;

            font-weight: 800;

            color: #172033;
        }

        .filter-heading span {

            color: #64748b;

            font-size: 12px;
        }

        .filters {

            display: grid;

            grid-template-columns:
                1.1fr
                2fr
                1.1fr
                1.1fr
                1.1fr
                auto;

            gap: 12px;

            align-items: end;
        }

        .filter-group label {

            display: block;

            margin-bottom: 7px;

            color: #64748b;

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .3px;
        }

        .filter-group input,
        .filter-group select {

            width: 100%;

            height: 44px;

            padding:
                0 13px;

            border:
                1px solid #dbe5ea;

            border-radius: 10px;

            background: white;

            color: #172033;

            font-size: 13px;

            outline: none;

            transition: .2s;
        }

        .filter-group input:focus,
        .filter-group select:focus {

            border-color: #0f766e;

            box-shadow:
                0 0 0 3px
                rgba(15,118,110,.08);
        }

        .clear-filter-btn {

            height: 44px;

            padding:
                0 16px;

            border:
                1px solid #fecaca;

            border-radius: 10px;

            background: #fff5f5;

            color: #dc2626;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

            white-space: nowrap;
        }

        .clear-filter-btn:hover {

            background: #fee2e2;

            transform: translateY(-1px);
        }


        /* =========================================================
           SUMMARY CARDS
        ========================================================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 24px;
        }

        .summary-card {

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            gap: 14px;

            min-height: 105px;

            padding: 19px;

            background: white;

            border:
                1px solid #e5edf2;

            border-radius: 17px;

            box-shadow:
                0 5px 20px
                rgba(15,23,42,.05);
        }

        .summary-card::after {

            content: "";

            position: absolute;

            right: -28px;
            top: -28px;

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background:
                rgba(15,118,110,.04);
        }

        .summary-icon {

            width: 50px;
            height: 50px;

            min-width: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background: #ecfdf5;

            font-size: 23px;
        }

        .summary-card span {

            display: block;

            color: #64748b;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .5px;
        }

        .summary-card strong {

            display: block;

            margin-top: 5px;

            color: #172033;

            font-size: 25px;

            line-height: 1;

            font-weight: 800;
        }


        /* =========================================================
           DOCTOR CARD
        ========================================================= */

        .doctor-card {

            margin-bottom: 24px;

            overflow: hidden;

            background: white;

            border:
                1px solid #e3ebef;

            border-radius: 20px;

            box-shadow:
                0 7px 25px
                rgba(15,23,42,.06);
        }

        .doctor-header {

            padding: 18px 21px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border-bottom:
                1px solid #e5edf1;
        }

        .doctor-title {

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .doctor-avatar {

            width: 48px;
            height: 48px;

            min-width: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background: white;

            border:
                1px solid #d9eeee;

            box-shadow:
                0 3px 10px
                rgba(15,118,110,.07);

            font-size: 24px;
        }

        .doctor-title h2 {

            margin: 0;

            color: #172033;

            font-size: 17px;

            font-weight: 800;
        }

        .doctor-title p {

            margin: 4px 0 0;

            color: #64748b;

            font-size: 11px;
        }

        .doctor-count {

            padding:
                8px 13px;

            border-radius: 999px;

            background: #0f766e;

            color: white;

            font-size: 11px;

            font-weight: 800;

            white-space: nowrap;
        }


        /* =========================================================
           SECTION
        ========================================================= */

        .section {

            padding: 19px 21px;
        }

        .section + .section {

            border-top:
                1px solid #edf2f5;
        }

        .section-title {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 12px;

            color: #475569;

            font-size: 12px;

            font-weight: 800;
        }

        .section-title span {

            display: inline-flex;

            align-items: center;

            padding:
                7px 10px;

            border-radius: 8px;

            background: #f1f5f9;

            color: #334155;

            font-size: 10px;

            font-weight: 800;
        }


        /* =========================================================
           DESKTOP TABLE
        ========================================================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            border:
                1px solid #e5edf1;

            border-radius: 13px;

            -webkit-overflow-scrolling: touch;
        }

        table {

            width: 100%;

            min-width: 1120px;

            border-collapse: collapse;
        }

        th {

            padding:
                13px 12px;

            background: #f8fafc;

            color: #64748b;

            border-bottom:
                1px solid #e5edf1;

            text-align: left;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .35px;

            white-space: nowrap;
        }

        td {

            padding:
                13px 12px;

            border-bottom:
                1px solid #edf2f5;

            color: #334155;

            font-size: 12px;

            vertical-align: middle;

            white-space: nowrap;
        }

        tbody tr {

            transition: .15s;
        }

        tbody tr:hover {

            background: #f8fffe;
        }

        tbody tr:last-child td {

            border-bottom: none;
        }


        /* =========================================================
           PATIENT
        ========================================================= */

        .patient-cell {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 210px;
        }

        .patient-avatar {

            width: 39px;
            height: 39px;

            min-width: 39px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background: #e0f2fe;

            font-size: 18px;
        }

        .patient-name {

            max-width: 180px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: #172033;

            font-size: 12px;

            font-weight: 800;
        }

        .patient-id {

            display: block;

            margin-top: 4px;

            color: #64748b;

            font-size: 10px;

            font-weight: 600;
        }


        /* =========================================================
           TYPE
        ========================================================= */

        .type-badge,
        .visit-badge,
        .already-old {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border-radius: 999px;

            font-weight: 800;

            white-space: nowrap;
        }

        .type-badge {

            padding:
                7px 10px;

            font-size: 10px;
        }

        .type-new {

            background: #dbeafe;

            color: #1d4ed8;
        }

        .type-old {

            background: #dcfce7;

            color: #15803d;
        }

        .visit-badge {

            padding:
                7px 10px;

            background: #f1f5f9;

            color: #475569;

            font-size: 10px;
        }


        /* =========================================================
           AMOUNT
        ========================================================= */

        .amount-box {

            display: flex;

            align-items: center;

            gap: 6px;
        }

        .amount-input {

            width: 88px;

            height: 36px;

            padding:
                0 9px;

            border:
                1px solid #dbe4e8;

            border-radius: 8px;

            outline: none;

            font-size: 12px;

            color: #172033;
        }

        .amount-input:focus {

            border-color: #0f766e;

            box-shadow:
                0 0 0 3px
                rgba(15,118,110,.08);
        }

        .save-amount {

            height: 36px;

            padding:
                0 11px;

            border: none;

            border-radius: 8px;

            background: #0f766e;

            color: white;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .save-amount:hover {

            background: #115e59;

            transform: translateY(-1px);
        }


        /* =========================================================
           OLD BUTTON
        ========================================================= */

        .old-btn {

            padding:
                8px 11px;

            border:
                1px solid #fed7aa;

            border-radius: 8px;

            background: #fff7ed;

            color: #c2410c;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;

            transition: .2s;
        }

        .old-btn:hover {

            background: #ffedd5;

            transform: translateY(-1px);
        }

        .already-old {

            padding:
                7px 10px;

            background: #dcfce7;

            color: #15803d;

            font-size: 10px;
        }


        /* =========================================================
           ACTION BUTTONS
        ========================================================= */

        .action-buttons {

            display: flex;

            align-items: center;

            gap: 7px;
        }

        .details-btn,
        .follow-btn {

            min-height: 36px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                0 11px;

            border-radius: 8px;

            font-size: 10px;

            font-weight: 800;

            white-space: nowrap;

            cursor: pointer;
        }

        .details-btn {

            border: none;

            background: #e0f2fe;

            color: #0369a1;
        }

        .details-btn:hover {

            background: #bae6fd;
        }

        .follow-btn {

            text-decoration: none;

            background: #ecfdf5;

            color: #047857;
        }

        .follow-btn:hover {

            background: #d1fae5;
        }


        /* =========================================================
           EMPTY
        ========================================================= */

        .empty {

            padding: 55px 25px;

            text-align: center;

            color: #64748b;

            font-size: 13px;
        }

        .empty strong {

            color: #334155;

            font-size: 15px;
        }


        /* =========================================================
           MODAL
        ========================================================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 99999;

            padding: 20px;

            align-items: center;

            justify-content: center;

            background:
                rgba(15,23,42,.68);

            backdrop-filter:
                blur(4px);

            overflow-y: auto;
        }

        .modal.show {

            display: flex;
        }

        .details-modal-content {

            width: 100%;

            max-width: 1050px;

            max-height: 92vh;

            overflow: hidden;

            border-radius: 20px;

            background: #f8fafc;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.30);

            animation:
                modalIn .22s ease;
        }

        @keyframes modalIn {

            from {
                opacity: 0;
                transform:
                    translateY(15px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .modal-header {

            min-height: 70px;

            padding:
                14px 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;
        }

        .modal-header h2 {

            margin: 0;

            font-size: 16px;

            font-weight: 800;
        }

        .close-btn {

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: none;

            border-radius: 10px;

            background:
                rgba(255,255,255,.15);

            color: white;

            font-size: 23px;

            cursor: pointer;
        }

        .details-body {

            max-height:
                calc(92vh - 70px);

            padding: 20px;

            overflow-y: auto;
        }


        /* =========================================================
           PATIENT PROFILE
        ========================================================= */

        .patient-profile-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 19px;

            margin-bottom: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border:
                1px solid #dcefee;

            border-radius: 16px;
        }

        .patient-profile-left {

            display: flex;

            align-items: center;

            gap: 13px;

            min-width: 0;
        }

        .large-patient-avatar {

            width: 60px;
            height: 60px;

            min-width: 60px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            font-size: 27px;
        }

        .patient-profile-left h2 {

            margin: 0;

            color: #172033;

            font-size: 19px;

            font-weight: 800;

            overflow-wrap: anywhere;
        }

        .patient-profile-left p {

            margin: 5px 0 0;

            color: #64748b;

            font-size: 10px;

            font-weight: 600;
        }

        .patient-phone {

            margin-top: 7px;

            color: #334155;

            font-size: 12px;

            font-weight: 700;
        }

        .detail-old,
        .detail-new {

            flex-shrink: 0;

            padding:
                9px 12px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 800;
        }

        .detail-old {

            background: #dcfce7;

            color: #15803d;
        }

        .detail-new {

            background: #dbeafe;

            color: #1d4ed8;
        }


        /* =========================================================
           DETAIL SECTION
        ========================================================= */

        .detail-section {

            padding: 17px;

            margin-bottom: 13px;

            background: white;

            border:
                1px solid #e5edf1;

            border-radius: 14px;
        }

        .detail-section-title {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 12px;

            color: #134e4a;

            font-size: 12px;

            font-weight: 800;
        }

        .detail-section-title > span:first-child {

            width: 30px;
            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background: #ecfdf5;
        }

        .visit-count {

            margin-left: auto;

            padding:
                6px 9px;

            border-radius: 999px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 9px;
        }


        /* =========================================================
           INFO
        ========================================================= */

        .patient-info-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 9px;
        }

        .info-item {

            min-width: 0;

            padding: 12px;

            background: #f8fafc;

            border:
                1px solid #edf2f5;

            border-radius: 10px;
        }

        .info-item.full {

            grid-column: 1 / -1;
        }

        .info-item span {

            display: block;

            margin-bottom: 5px;

            color: #94a3b8;

            font-size: 9px;

            font-weight: 800;
        }

        .info-item strong {

            display: block;

            color: #334155;

            font-size: 11px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }


        /* =========================================================
           CURRENT APPOINTMENT
        ========================================================= */

        .current-appointment-card {

            padding: 15px;

            border:
                1px solid #dcefee;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #f8fffe,
                    #f8fbff
                );
        }

        .doctor-profile {

            display: flex;

            align-items: center;

            gap: 11px;

            padding-bottom: 12px;

            margin-bottom: 12px;

            border-bottom:
                1px solid #e5edf1;
        }

        .small-doctor-avatar {

            width: 43px;
            height: 43px;

            min-width: 43px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background: #e0f2fe;

            font-size: 19px;
        }

        .doctor-profile strong {

            display: block;

            color: #172033;

            font-size: 12px;
        }

        .doctor-profile span {

            display: block;

            margin-top: 3px;

            color: #64748b;

            font-size: 9px;
        }

        .appointment-info {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;
        }

        .appointment-info div {

            padding: 10px;

            background: white;

            border:
                1px solid #edf2f5;

            border-radius: 9px;
        }

        .appointment-info span {

            display: block;

            margin-bottom: 4px;

            color: #94a3b8;

            font-size: 8px;

            font-weight: 800;
        }

        .appointment-info strong {

            display: block;

            color: #334155;

            font-size: 10px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .current-amount {

            color: #0f766e !important;
        }


        /* =========================================================
           HISTORY
        ========================================================= */

        .visit-history {

            width: 100%;

            overflow-x: auto;

            border:
                1px solid #e8eef2;

            border-radius: 10px;
        }

        .history-heading,
        .visit-history-row {

            min-width: 650px;

            display: grid;

            grid-template-columns:
                1.2fr
                1.5fr
                1fr
                .8fr
                .8fr;

            gap: 10px;
        }

        .history-heading {

            padding:
                10px 12px;

            background: #f8fafc;

            color: #94a3b8;

            font-size: 8px;

            font-weight: 800;

            text-transform: uppercase;
        }

        .visit-history-row {

            align-items: center;

            padding: 12px;

            background: white;

            border-top:
                1px solid #edf2f5;
        }

        .visit-number strong,
        .visit-doctor strong {

            display: block;

            color: #334155;

            font-size: 10px;
        }

        .visit-number span,
        .visit-doctor span {

            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 8px;
        }

        .visit-time {

            color: #475569;

            font-size: 9px;
        }

        .visit-amount {

            color: #0f766e;

            font-size: 10px;

            font-weight: 800;
        }

        .history-status {

            display: inline-block;

/* =========================================================
   AUTH
========================================================= */

const authReady =
    new Promise(
        (resolve) => {

            const unsubscribe =
                onAuthStateChanged(
                    auth,
                    (user) => {

                        unsubscribe();

                        resolve(user);

                    }
                );

        }
    );


async function getStatuslyToken() {

    const user =
        await authReady;

    if (!user) {

        throw new Error(
            "Login session not found. Please login again."
        );

    }

    return await user.getIdToken(true);

}


async function statuslyFetch(
    url,
    options = {}
) {

    const token =
        await getStatuslyToken();

    const headers =
        new Headers(
            options.headers || {}
        );

    headers.set(
        "Authorization",
        "Bearer " + token
    );

    if (
        options.body &&
        !headers.has("Content-Type")
    ) {

        headers.set(
            "Content-Type",
            "application/json"
        );

    }

    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   MOBILE
========================================================= */

function normalizeMobile(mobile) {

    let digits =
        String(mobile || "")
            .replace(/\D/g, "");

    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.slice(-10);

    }

    return digits;

}


/* =========================================================
   DATE
========================================================= */

function normalizeDate(date) {

    if (!date) {
        return "";
    }

    const value =
        String(date).trim();

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(value)
    ) {

        return value;

    }

    const parts =
        value.split(/[-/]/);

    if (parts.length === 3) {

        if (parts[0].length === 4) {

            return [
                parts[0],
                parts[1].padStart(2, "0"),
                parts[2].padStart(2, "0")
            ].join("-");

        }

        return [
            parts[2],
            parts[1].padStart(2, "0"),
            parts[0].padStart(2, "0")
        ].join("-");

    }

    return value;

}


function todayISO() {

    const now =
        new Date();

    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");

}


function formatDate(date) {

    const normalized =
        normalizeDate(date);

    if (!normalized) {
        return "-";
    }

    const d =
        new Date(
            normalized + "T00:00:00"
        );

    if (isNaN(d.getTime())) {

        return escapeHtml(date);

    }

    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================================
   CATEGORY
========================================================= */

function getCategory(p) {

    const date =
        normalizeDate(
            p.appointment_date
        );

    const today =
        todayISO();

    if (date === today) {
        return "today";
    }

    if (date > today) {
        return "upcoming";
    }

    return "past";

}


/* =========================================================
   PATIENT TYPE
========================================================= */

function getPatientType(p) {

    const status =
        String(
            p.patient_status || "NEW"
        )
        .toUpperCase()
        .trim();

    return status === "OLD"
        ? "OLD"
        : "NEW";

}


/* =========================================================
   AMOUNT
========================================================= */

function amount(value) {

    const n =
        Number(value || 0);

    return Number.isFinite(n)
        ? n
        : 0;

}


function money(value) {

    return "₹" +
        amount(value).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


/* =========================================================
   SORT
========================================================= */

function sortAppointments(list) {

    return [...list].sort(
        (a, b) => {

            const dateA =
                normalizeDate(
                    a.appointment_date
                );

            const dateB =
                normalizeDate(
                    b.appointment_date
                );

            const timeA =
                String(
                    a.appointment_time || "00:00"
                );

            const timeB =
                String(
                    b.appointment_time || "00:00"
                );

            const valueA =
                new Date(
                    dateA + "T" + timeA
                ).getTime();

            const valueB =
                new Date(
                    dateB + "T" + timeB
                ).getTime();

            return valueB - valueA;

        }
    );

}


/* =========================================================
   DOCTORS
========================================================= */

function populateDoctors() {

    const select =
        document.getElementById(
            "doctorFilter"
        );

    const doctors =
        [
            ...new Set(
                APPOINTMENTS.map(
                    p =>
                        p.doctor_name ||
                        "Unknown Doctor"
                )
            )
        ].sort();

    doctors.forEach(
        doctor => {

                document.createElement(
                    "option"
                );

            option.value =
                doctor;

            option.textContent =
                doctor;

            select.appendChild(option);

        }
    );

    document.getElementById(
        "totalDoctors"
    ).textContent =
        doctors.length;

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(list) {

    document.getElementById(
        "totalPatients"
    ).textContent =
        list.length;

    document.getElementById(
        "todayCount"

    document.getElementById(

            p =>

        ).length;

}

/* =========================================================

function render() {

    const doctor =
        document.getElementById(
            "doctorFilter"
        ).value;

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();

    const appointmentFilter =
        document.getElementById(
            "appointmentFilter"
        ).value;

    const patientTypeFilter =
        document.getElementById(
            "patientTypeFilter"
        ).value;

    const date =
        document.getElementById(
            "dateFilter"
        ).value;


    function matchesSearch(p) {

        if (!search) {
            return true;
        }

        let searchable = "";

        try {

            searchable =
                JSON.stringify(p);

        }

        catch (error) {

            searchable = "";

        }

        searchable +=
            " " + getCategory(p);

        searchable +=
            " " + getPatientType(p);

        searchable +=
            " " + normalizeDate(
                p.appointment_date
            );

        return searchable
            .toLowerCase()
            .includes(search);

    }


    const filtered =
        APPOINTMENTS.filter(
            p => {

                const doctorName =
                    String(
                        p.doctor_name ||
                        "Unknown Doctor"
                    ).trim();

                if (
                    doctor &&
                    doctorName !== doctor
                ) {

                    return false;

                }

                if (!matchesSearch(p)) {
                    return false;
                }

                if (
                    appointmentFilter &&
                    getCategory(p) !==
                    appointmentFilter
                ) {

                    return false;

                }

                if (
                    patientTypeFilter &&
                    getPatientType(p) !==
                    patientTypeFilter
                ) {

                    return false;

                }

                if (
                    date &&
                    normalizeDate(
                        p.appointment_date
                    ) !== date
                ) {

                    return false;

                }

                return true;

            }
        );


    updateSummary(filtered);


    const container =
        document.getElementById(
            "doctorCards"
        );

    container.innerHTML = "";


    if (!filtered.length) {

        container.innerHTML = `

            <div class="doctor-card">

                <div class="empty">

                    <div
                        style="
                            font-size:40px;
                            margin-bottom:10px;
                        "
                    >
                        🔎
                    </div>

                    <strong>
                        No appointments found
                    </strong>

                    <br>

                    <span>
                        Try changing your search or filters.
                    </span>

                </div>

            </div>

        `;

        return;

    }


    const grouped = {};


    filtered.forEach(
        p => {

            const doctorName =
                p.doctor_name ||
                "Unknown Doctor";

            if (!grouped[doctorName]) {

                grouped[doctorName] = [];

            }

            grouped[doctorName].push(p);

        }
    );


    Object.entries(grouped).forEach(
        ([doctorName, patients]) => {

            patients =
                sortAppointments(
                    patients
                );


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "doctor-card";


            card.innerHTML = `

                <div class="doctor-header">

                    <div class="doctor-title">

                        <div class="doctor-avatar">
                            👨‍⚕️
                        </div>

                        <div>

                            <h2>
                                ${escapeHtml(
                                    doctorName
                                )}
                            </h2>

                            <p>
                                Doctor Appointments
                            </p>

                        </div>

                    </div>


                    <div class="doctor-count">

                        ${patients.length}
                        Patients

                    </div>

                </div>

            `;


            const categories = [

                ["today", "📅 TODAY"],

                ["upcoming", "🔔 UPCOMING"],

                ["past", "📁 PAST"]

            ];


            let number = 1;


            categories.forEach(
                ([category, title]) => {

                    const rows =
                        patients.filter(
                            p =>
                                getCategory(p) ===
                                category
                        );


                    if (!rows.length) {
                        return;
                    }


                    const section =
                        document.createElement(
                            "div"
                        );

                    section.className =
                        "section";


                    section.innerHTML = `

                        <div class="section-title">

                            <span>
                                ${title}
                            </span>

                            ${rows.length}

                            Appointment
                            ${rows.length === 1 ? "" : "s"}

                        </div>


                        <div class="table-wrapper">

                            <table>

                                <thead>

                                    <tr>

                                        <th>
                                            No
                                        </th>

                                        <th>
                                            Patient
                                        </th>

                                        <th>
                                            Gender
                                        </th>

                                        <th>
                                            Age
                                        </th>

                                        <th>
                                            Mobile
                                        </th>

                                        <th>
                                            Date / Time
                                        </th>

                                        <th>
                                            Visit
                                        </th>

                                        <th>
                                            Type
                                        </th>

                                        <th>
                                            Amount
                                        </th>

                                        <th>
                                            Patient Status
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${rows.map(
                                        p =>
                                            createRow(
                                                p,
                                                number++

                                    ).join("")}

                                </tbody>

                            </table>

                        </div>

                    `;


                    card.appendChild(
                        section

                }
            );


            container.appendChild(
                card
            );

        }
    );

window.confirmMakeOld =
async function() {

    if (!selectedMobile) {
        return;
    }


    const button =
        document.getElementById(
            "confirmOldButton"
        );


    const patientName =
        selectedPatientName ||
        "Patient";


    try {

        button.disabled = true;

        button.textContent =
            "Updating...";


        const response =
            await statuslyFetch(
                "/api/doctor/make-patient-old",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            mobile:
                                selectedMobile
                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to make patient OLD."
            );

        }


        closeOldModal();


        alert(
            `${patientName} is now OLD.`
        );


        window.location.reload();


    }

    catch(error) {

        console.error(
            "MAKE OLD ERROR:",
            error
        );


        alert(
            error.message ||
            "Something went wrong."
        );


        button.disabled =
            false;

        button.textContent =
            "Yes, Make OLD";

    }

};


/* =========================================================
   SAVE AMOUNT
========================================================= */

window.saveAmount =
async function(
    appointmentId
) {

    const input =
        document.getElementById(
            "amount-" +
            appointmentId
        );


    if (!input) {

        alert(
            "Amount field not found."
        );

        return;

    }


    const amountValue =
        Number(input.value);


    if (
        !Number.isFinite(amountValue) ||
        amountValue < 0
    ) {

        alert(
            "Please enter a valid amount."
        );

        return;

    }


    try {

        const response =
            await statuslyFetch(

                "/api/appointment/" +
                encodeURIComponent(
                    appointmentId
                ) +
                "/amount",

                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            amount:
                                amountValue
                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to save amount."
            );

        }


        const appointment =
            APPOINTMENTS.find(
                p =>
                    String(p.id) ===
                    String(appointmentId)
            );


        if (appointment) {

            appointment.amount =
                amountValue;

        }


        alert(
            "Amount saved successfully."
        );


    }

    catch(error) {

        console.error(
            "SAVE AMOUNT ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to save amount."
        );

    }

};

document.getElementById(
    "appointmentFilter"
).addEventListener(
    "change",
    render
);


document.getElementById(
    "patientTypeFilter"
).addEventListener(
    "change",
    render
);


document.getElementById(
    "dateFilter"
).addEventListener(
    "change",
    render
);


/* =========================================================
   CLEAR FILTERS
========================================================= */

document.getElementById(
    "clearFilters"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "doctorFilter"
        ).value = "";

        document.getElementById(
            "searchInput"
        ).value = "";

        document.getElementById(
            "appointmentFilter"
        ).value = "";

        document.getElementById(
            "patientTypeFilter"
        ).value = "";

        document.getElementById(
            "dateFilter"
        ).value = "";

        render();

    }
);


/* =========================================================
   BACKGROUND CLICK
========================================================= */

document.getElementById(
    "detailsModal"
).addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            closeDetails();

        }

    }
);


document.getElementById(
    "oldModal"
).addEventListener(
    "click",
    function(e) {

        if (e.target === this) {

            closeOldModal();

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Escape") {

            closeDetails();

            closeOldModal();

        }

    }
);


/* =========================================================
   START
========================================================= */

populateDoctors();

render();


</script>


</body>

</html>
