<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Appointments</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fa;
            color: #172033;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: linear-gradient(
                135deg,
                #0f766e,
                #0e7490
            );

            color: white;

            padding: 24px 30px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.08);
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 13px;
            opacity: .9;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }


        /* =========================
           FILTERS
        ========================= */

        .filter-card {
            background: white;

            padding: 18px;

            border-radius: 14px;

            box-shadow:
                0 3px 14px rgba(15,23,42,.06);

            margin-bottom: 20px;
        }

        .filters {
            display: grid;

            grid-template-columns:
                1fr 1.5fr 1fr;

            gap: 12px;
        }

        .filter-group label {
            display: block;

            font-size: 11px;

            font-weight: 700;

            color: #64748b;

            margin-bottom: 6px;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;

            padding: 11px 12px;

            border:
                1px solid #dbe4e8;

            border-radius: 9px;

            outline: none;

            font-size: 12px;

            background: #fff;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: #0f766e;
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 22px;
        }

        .summary-card {
            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 3px 14px rgba(15,23,42,.06);

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .summary-icon {
            width: 45px;
            height: 45px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

            background: #ecfdf5;
        }

        .summary-card span {
            display: block;

            font-size: 10px;

            color: #64748b;

            font-weight: 700;
        }

        .summary-card strong {
            display: block;

            margin-top: 4px;

            font-size: 20px;
        }


        /* =========================
           DOCTOR CARD
        ========================= */

        .doctor-card {
            background: white;

            border-radius: 16px;

            margin-bottom: 22px;

            overflow: hidden;

            box-shadow:
                0 4px 18px rgba(15,23,42,.07);
        }

        .doctor-header {
            padding: 17px 20px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border-bottom:
                1px solid #e5edf1;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .doctor-title {
            display: flex;

            align-items: center;

            gap: 11px;
        }

        .doctor-avatar {
            width: 43px;
            height: 43px;

            border-radius: 12px;

            background: #dff7f3;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;
        }

        .doctor-title h2 {
            margin: 0;

            font-size: 15px;
        }

        .doctor-title p {
            margin: 4px 0 0;

            color: #64748b;

            font-size: 10px;
        }

        .doctor-count {
            background: #0f766e;

            color: white;

            border-radius: 999px;

            padding: 6px 11px;

            font-size: 9px;

            font-weight: 800;
        }


        /* =========================
           SECTION
        ========================= */

        .section {
            padding: 18px 20px;
        }

        .section-title {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 11px;

            font-size: 11px;

            font-weight: 800;

            color: #334155;
        }

        .section-title span {
            padding: 5px 8px;

            border-radius: 7px;

            background: #f1f5f9;

            font-size: 9px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            overflow-x: auto;

            border:
                1px solid #e5edf1;

            border-radius: 11px;
        }

        table {
            width: 100%;

            min-width: 1250px;

            border-collapse: collapse;
        }

        th {
            background: #f8fafc;

            color: #64748b;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: .3px;

            padding: 12px 10px;

            text-align: left;

            white-space: nowrap;

            border-bottom:
                1px solid #e5edf1;
        }

        td {
            padding: 12px 10px;

            border-bottom:
                1px solid #edf2f5;

            font-size: 10px;

            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f8fffe;
        }


        /* =========================
           PATIENT
        ========================= */

        .patient-cell {
            display: flex;

            align-items: center;

            gap: 9px;

            min-width: 160px;
        }

        .patient-avatar {
            width: 35px;
            height: 35px;

            flex-shrink: 0;

            border-radius: 10px;

            background: #e0f2fe;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 16px;
        }

        .patient-name {
            font-weight: 800;

            color: #1e293b;

            font-size: 10px;
        }

        .patient-id {
            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 8px;
        }


        /* =========================
           TYPE
        ========================= */

        .type-badge {
            display: inline-block;

            padding: 5px 8px;

            border-radius: 999px;

            font-size: 8px;

            font-weight: 800;
        }

        .type-new {
            background: #dbeafe;

            color: #1d4ed8;
        }

        .type-old {
            background: #dcfce7;

            color: #15803d;
        }


        /* =========================
           VISIT
        ========================= */

        .visit-badge {
            display: inline-block;

            padding: 5px 8px;

            background: #f1f5f9;

            border-radius: 7px;

            font-weight: 800;

            font-size: 8px;

            color: #475569;
        }


        /* =========================
           AMOUNT
        ========================= */

        .amount-box {
            display: flex;

            align-items: center;

            gap: 4px;
        }

        .amount-input {
            width: 75px;

            padding: 6px 7px;

            border:
                1px solid #dbe4e8;

            border-radius: 7px;

            font-size: 9px;

            outline: none;
        }

        .amount-input:focus {
            border-color: #0f766e;
        }

        .save-amount {
            border: none;

            background: #0f766e;

            color: white;

            border-radius: 7px;

            padding: 6px 8px;

            cursor: pointer;

            font-size: 8px;

            font-weight: 700;
        }


        /* =========================
           MAKE OLD
        ========================= */

        .old-btn {
            border: none;

            background: #fff7ed;

            color: #c2410c;

            border:
                1px solid #fed7aa;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 800;

            cursor: pointer;
        }

        .old-btn:hover {
            background: #ffedd5;
        }

        .already-old {
            color: #15803d;

            font-size: 8px;

            font-weight: 800;
        }


        /* =========================
           ACTION
        ========================= */

        .action-buttons {
            display: flex;

            gap: 6px;

            align-items: center;
        }

        .details-btn {
            border: none;

            background: #e0f2fe;

            color: #0369a1;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 800;

            cursor: pointer;
        }

        .follow-btn {
            display: inline-block;

            text-decoration: none;

            background: #ecfdf5;

            color: #047857;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 800;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15,23,42,.62);

            z-index: 9999;

            padding: 25px;

            overflow-y: auto;
        }

        .modal.show {
            display: flex;

            align-items: flex-start;

            justify-content: center;
        }

        .modal-content {
            width: 100%;

            max-width: 950px;

            background: #f8fafc;

            border-radius: 18px;

            margin: 20px auto;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        .modal-header {
            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            padding: 17px 22px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .modal-header h2 {
            margin: 0;

            font-size: 15px;
        }

        .close-btn {
            border: none;

            background:
                rgba(255,255,255,.15);

            color: white;

            width: 32px;
            height: 32px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 17px;
        }

        .details-body {
            padding: 20px;
        }


        /* =========================
           PROFESSIONAL PATIENT CARD
        ========================= */

        .professional-patient-card {
            color: #172033;
        }

        .patient-profile-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 22px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border:
                1px solid #dcefee;

            border-radius: 16px;

            margin-bottom: 18px;
        }

        .patient-profile-left {
            display: flex;

            align-items: center;

            gap: 15px;
        }

        .large-patient-avatar {
            width: 65px;
            height: 65px;

            border-radius: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 29px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;
        }

        .patient-profile-left h2 {
            margin: 0;

            font-size: 20px;

            font-weight: 800;
        }

        .patient-profile-left p {
            margin: 5px 0 0;

            color: #64748b;

            font-size: 9px;
        }

        .patient-phone {
            margin-top: 7px;

            font-size: 11px;

            font-weight: 700;

            color: #334155;
        }

        .detail-old,
        .detail-new {
            padding: 9px 13px;

            border-radius: 999px;

            font-size: 9px;

            font-weight: 800;
        }

        .detail-old {
            background: #dcfce7;

            color: #15803d;
        }

        .detail-new {
            background: #dbeafe;

            color: #1d4ed8;
        }


        /* =========================
           DETAIL SECTION
        ========================= */

        .detail-section {
            margin-bottom: 18px;

            padding: 18px;

            border:
                1px solid #e5edf1;

            border-radius: 14px;

            background: white;
        }

        .detail-section-title {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 15px;

            color: #134e4a;

            font-size: 12px;

            font-weight: 800;
        }

        .detail-section-title > span:first-child {
            width: 28px;
            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background: #ecfdf5;
        }

        .visit-count {
            margin-left: auto;

            background: #f1f5f9;

            color: #64748b;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 8px;
        }


        /* =========================
           PATIENT INFORMATION
        ========================= */

        .patient-info-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;
        }

        .info-item {
            padding: 12px;

            background: #f8fafc;

            border-radius: 9px;

            border:
                1px solid #edf2f5;
        }

        .info-item.full {
            grid-column: 1 / -1;
        }

        .info-item span {
            display: block;

            color: #94a3b8;

            font-size: 8px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .info-item strong {
            font-size: 10px;

            color: #334155;
        }


        /* =========================
           CURRENT APPOINTMENT
        ========================= */

        .current-appointment-card {
            border-radius: 12px;

            padding: 16px;

            background:
                linear-gradient(
                    135deg,
                    #f8fffe,
                    #f8fbff
                );

            border:
                1px solid #dcefee;
        }

        .doctor-profile {
            display: flex;

            align-items: center;

            gap: 11px;

            padding-bottom: 14px;

            margin-bottom: 14px;

            border-bottom:
                1px solid #e5edf1;
        }

        .small-doctor-avatar {
            width: 43px;
            height: 43px;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e0f2fe;

            font-size: 20px;
        }

        .doctor-profile strong {
            display: block;

            font-size: 12px;
        }

        .doctor-profile span {
            display: block;

            margin-top: 3px;

            color: #64748b;

            font-size: 9px;
        }

        .appointment-info {
            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 10px;
        }

        .appointment-info div {
            padding: 10px;

            background: white;

            border-radius: 8px;

            border:
                1px solid #edf2f5;
        }

        .appointment-info span {
            display: block;

            font-size: 7px;

            font-weight: 800;

            color: #94a3b8;

            margin-bottom: 5px;
        }

        .appointment-info strong {
            font-size: 10px;
        }

        .current-amount {
            color: #0f766e;
        }


        /* =========================
           VISIT HISTORY
        ========================= */

        .visit-history {
            border:
                1px solid #e8eef2;

            border-radius: 10px;

            overflow: hidden;
        }

        .visit-history-row {
            display: grid;

            grid-template-columns:
                1.2fr 1.5fr 1fr .8fr .8fr;

            align-items: center;

            gap: 10px;

            padding: 12px;

            border-bottom:
                1px solid #edf2f5;

            background: white;
        }

        .visit-history-row:last-child {
            border-bottom: none;
        }

        .visit-history-row:hover {
            background: #f8fffe;
        }

        .visit-number strong,
        .visit-doctor strong {
            display: block;

            font-size: 9px;
        }

        .visit-number span,
        .visit-doctor span {
            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 8px;
        }

        .visit-time {
            font-size: 9px;

            color: #475569;
        }

        .visit-amount {
            font-weight: 800;

            color: #0f766e;

            font-size: 10px;
        }

        .history-status {
            display: inline-block;

            padding: 5px 7px;

            border-radius: 999px;

            font-size: 8px;

            font-weight: 800;
        }

        .history-old {
            background: #dcfce7;

            color: #15803d;
        }

        .history-new {
            background: #dbeafe;

            color: #1d4ed8;
        }


        /* =========================
           TOTAL PAYMENT
        ========================= */

        .total-paid-card {
            margin-top: 12px;

            padding: 14px 16px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #f0fdfa
                );

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .total-paid-card span {
            display: block;

            font-size: 10px;

            font-weight: 800;

            color: #166534;
        }

        .total-paid-card small {
            display: block;

            margin-top: 3px;

            font-size: 8px;

            color: #65a30d;
        }

        .total-paid-card strong {
            font-size: 19px;

            color: #15803d;
        }


        /* =========================
           CONFIRM MODAL
        ========================= */

        .confirm-box {
            background: white;

            max-width: 430px;

            width: 100%;

            margin: auto;

            border-radius: 16px;

            padding: 25px;

            text-align: center;
        }

        .confirm-icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: #fff7ed;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;
        }

        .confirm-box h3 {
            margin: 0;

            font-size: 16px;
        }

        .confirm-box p {
            color: #64748b;

            font-size: 11px;

            line-height: 1.6;
        }

        .confirm-actions {
            display: flex;

            gap: 10px;

            justify-content: center;

            margin-top: 18px;
        }

        .cancel-btn,
        .confirm-old-btn {
            border: none;

            padding: 10px 17px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 10px;

            font-weight: 800;
        }

        .cancel-btn {
            background: #f1f5f9;

            color: #475569;
        }

        .confirm-old-btn {
            background: #0f766e;

            color: white;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 35px;

            text-align: center;

            color: #94a3b8;

            font-size: 11px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:900px) {

            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .patient-info-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .appointment-info {
                grid-template-columns:
                    repeat(2,1fr);
            }

        }


        @media(max-width:600px) {

            .container {
                padding: 13px;
            }

            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 20px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .patient-profile-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }

            .patient-info-grid {
                grid-template-columns: 1fr;
            }

            .info-item.full {
                grid-column: auto;
            }

            .appointment-info {
                grid-template-columns:
                    repeat(2,1fr);
            }

            .visit-history-row {
                grid-template-columns:
                    1fr 1fr;
            }

        }

    </style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>
        👨‍⚕️ Doctor Appointments
    </h1>

    <p>
        Manage patients by doctor, appointment date and visit history
    </p>

</div>


<div class="container">


<!-- =====================================================
     FILTERS
===================================================== -->

<div class="filter-card">

    <div class="filters">

        <div class="filter-group">

            <label>
                DOCTOR
            </label>

            <select id="doctorFilter">

                <option value="">
                    All Doctors
                </option>

            </select>

        </div>


        <div class="filter-group">

            <label>
                SEARCH PATIENT
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by patient name or mobile..."
            >

        </div>


        <div class="filter-group">

            <label>
                APPOINTMENT DATE
            </label>

            <input
                type="date"
                id="dateFilter"
            >

        </div>

    </div>

</div>


<!-- =====================================================
     SUMMARY
===================================================== -->

<div class="summary-grid">

    <div class="summary-card">

        <div class="summary-icon">
            👥
        </div>

        <div>

            <span>
                TOTAL PATIENTS
            </span>

            <strong id="totalPatients">
                0
            </strong>

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-icon">
            👨‍⚕️
        </div>

        <div>

            <span>
                DOCTORS
            </span>

            <strong id="totalDoctors">
                0
            </strong>

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-icon">
            📅
        </div>

        <div>

            <span>
                TODAY
            </span>

            <strong id="todayCount">
                0
            </strong>

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-icon">
            🔔
        </div>

        <div>

            <span>
                UPCOMING
            </span>

            <strong id="upcomingCount">
                0
            </strong>

        </div>

    </div>

</div>


<!-- =====================================================
     DOCTOR CARDS
===================================================== -->

<div id="doctorCards"></div>


</div>


<!-- =====================================================
     DETAILS MODAL
===================================================== -->

<div
    id="detailsModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                👤 Patient Details
            </h2>

            <button
                class="close-btn"
                onclick="closeDetails()"
            >
                ×
            </button>

        </div>


        <div
            id="detailsBody"
            class="details-body"
        ></div>

    </div>

</div>


<!-- =====================================================
     MAKE OLD CONFIRM MODAL
===================================================== -->

<div
    id="oldModal"
    class="modal"
>

    <div class="confirm-box">

        <div class="confirm-icon">
            🔄
        </div>

        <h3>
            Make Patient OLD?
        </h3>

        <p id="oldMessage">
            This patient will be marked as an OLD patient.
        </p>

        <div class="confirm-actions">

            <button
                class="cancel-btn"

/* =====================================================

async function getStatuslyToken() {

    const user =
        await authReady;

    if (!user) {

        throw new Error(
            "Login session not found. Please login again."
        );

    }

    return await user.getIdToken(true);

}


/* =====================================================
   AUTHENTICATED FETCH
===================================================== */

async function statuslyFetch(
    url,
    options = {}
) {

    const token =
        await getStatuslyToken();


    const headers =
        new Headers(
            options.headers || {}
        );


    headers.set(
        "Authorization",
        "Bearer " + token
    );


    if (
        !headers.has("Content-Type") &&
        options.body
    ) {

        headers.set(
            "Content-Type",
            "application/json"
        );

    }


    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function normalizeMobile(mobile) {

    let digits =
        String(mobile || "")
        .replace(/\D/g, "");

    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.slice(-10);

    }

    return digits;

}


function normalizeDate(date) {

    if (!date) return "";

    const value =
        String(date).trim();

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(value)
    ) {

        return value;

    }

    const parts =
        value.split(/[-/]/);

    if (parts.length === 3) {

        if (parts[0].length === 4) {

            return [
                parts[0],
                parts[1].padStart(2, "0"),
                parts[2].padStart(2, "0")
            ].join("-");

        }

        return [
            parts[2],
            parts[1].padStart(2, "0"),
            parts[0].padStart(2, "0")
        ].join("-");

    }

    return value;

}


function todayISO() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


function amount(value) {

    const number =
        Number(value || 0);

    return Number.isFinite(number)
        ? number
        : 0;

}


function money(value) {

    return "₹" +
        amount(value).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


function formatDate(date) {

    const normalized =
        normalizeDate(date);

    if (!normalized) {
        return "-";
    }

    const d =
        new Date(
            normalized + "T00:00:00"
        );

    if (isNaN(d.getTime())) {
        return escapeHtml(date);
    }

    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   CATEGORY
===================================================== */

function getCategory(p) {

    const date =
        normalizeDate(
            p.appointment_date
        );

    const today =
        todayISO();

    if (date === today) {

        return "today";

    }

    if (date > today) {

        return "upcoming";

    }

    return "past";

}


/* =====================================================
   PATIENT TYPE
===================================================== */

function getPatientType(p) {

    const visit =
        Number(
            p.visit_number || 1
        );

    if (visit === 1) {

        return "NEW";

    }

    const status =
        String(
            p.patient_status || "NEW"
        )
        .toUpperCase()
        .trim();

    return status === "OLD"
        ? "OLD"
        : "NEW";

}

                </div>


                <!-- TOTAL -->

                <div class="total-paid-card">

                    <div>

                        <span>
                            Total Amount Paid
                        </span>

                        <small>

                            Across
                            ${history.length}
                            visit${history.length === 1 ? "" : "s"}

                        </small>

                    </div>


                    <strong>

                        ${money(
                            totalPaid
                        )}

                    </strong>

                </div>

            </div>


        </div>

    `;


    document.getElementById(
        "detailsModal"
    ).classList.add("show");

};


/* =====================================================
   CLOSE DETAILS
===================================================== */

window.closeDetails = function() {

    document.getElementById(
        "detailsModal"
    ).classList.remove("show");

};


/* =====================================================
   OLD PATIENT
===================================================== */

let selectedMobile = "";


window.openOldModal = function(mobile) {

    selectedMobile =
        mobile;


    document.getElementById(
        "oldMessage"
    ).textContent =
        `Are you sure you want to make patient ${mobile} OLD?`;


    document.getElementById(
        "oldModal"
    ).classList.add("show");

};


window.closeOldModal = function() {

    selectedMobile = "";

    document.getElementById(
        "oldModal"
    ).classList.remove("show");

};


/* =====================================================
   CONFIRM MAKE OLD
===================================================== */

window.confirmMakeOld = async function() {

    if (!selectedMobile) {
        return;
    }


    try {

        const response =
            await statuslyFetch(
                "/api/doctor/make-patient-old",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            mobile:
                                selectedMobile
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to update patient."
            );

        }


        alert(
            "Patient successfully marked as OLD."
        );


        closeOldModal();


        window.location.reload();


    }
    catch (error) {

        alert(
            error.message ||
            "Something went wrong."
        );

    }

};


/* =====================================================
   SAVE AMOUNT
===================================================== */

window.saveAmount = async function(
    appointmentId
) {

    const input =
        document.getElementById(
            "amount-" +
            appointmentId
        );


    if (!input) {

        alert(
            "Amount field not found."
        );

        return;

    }


    const amountValue =
        Number(
            input.value
        );


    if (
        !Number.isFinite(amountValue) ||
        amountValue < 0
    ) {

        alert(
            "Please enter a valid amount."
        );

        return;

    }


    try {

        const response =
            await statuslyFetch(
                "/api/appointment/" +
                encodeURIComponent(
                    appointmentId
                ) +
                "/amount",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            amount:
                                amountValue
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to save amount."
            );

        }


        alert(
            "Amount saved successfully."
        );


    }
    catch (error) {

        alert(
            error.message ||
            "Unable to save amount."
        );

    }

};


/* =====================================================
   FILTER EVENTS
===================================================== */

document.getElementById(
    "doctorFilter"
).addEventListener(
    "change",
    render
);


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    render
);


document.getElementById(
    "dateFilter"
).addEventListener(
    "change",
    render
);


/* =====================================================
   CLOSE MODAL BY BACKGROUND
===================================================== */

document.getElementById(
    "detailsModal"
).addEventListener(
    "click",
    function(e) {

        if (
            e.target === this
        ) {

            closeDetails();

        }

    }
);


document.getElementById(
    "oldModal"
).addEventListener(
    "click",
    function(e) {

        if (
            e.target === this
        ) {

            closeOldModal();

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Escape") {

            closeDetails();

            closeOldModal();

        }

    }
);


/* =====================================================
   START
===================================================== */

populateDoctors();

render();

</script>

</html>
