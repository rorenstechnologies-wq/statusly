<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Appointments</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #087f8c, #2563eb);
            color: white;
            padding: 24px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .header h1 {
            margin: 0 0 7px 0;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            opacity: 0.92;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }

        .filters {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 22px;
        }

        .filter-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .filter-box input,
        .filter-box select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d5dce5;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        .filter-box input:focus,
        .filter-box select:focus {
            border-color: #2563eb;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .summary-card .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .summary-card .label {
            margin-top: 5px;
            color: #64748b;
        }

        .doctor-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }

        .doctor-header {
            padding: 18px 20px;
            background: linear-gradient(135deg, #0f766e, #2563eb);
            color: white;
        }

        .doctor-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .doctor-header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }

        .section {
            padding: 18px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eef2f7;
        }

        .today-title {
            color: #0f766e;
        }

        .upcoming-title {
            color: #2563eb;
        }

        .past-title {
            color: #64748b;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1150px;
        }

        th {
            background: #f1f5f9;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            color: #475569;
            white-space: nowrap;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #edf1f5;
            font-size: 14px;
            vertical-align: middle;
        }

        tr:hover td {
            background: #fafcff;
        }

        .patient-name {
            font-weight: bold;
        }

        .mobile {
            white-space: nowrap;
        }

        .visit-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
            font-size: 12px;
        }

        .type-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }

        .type-new {
            background: #dcfce7;
            color: #166534;
        }

        .type-old {
            background: #fef3c7;
            color: #92400e;
        }

        .amount {
            font-weight: bold;
            color: #047857;
            white-space: nowrap;
        }

        .action-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-width: 270px;
        }

        button,
        .action-link {
            border: none;
            cursor: pointer;
            border-radius: 7px;
            padding: 8px 11px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .details-btn {
            background: #2563eb;
            color: white;
        }

        .details-btn:hover {
            background: #1d4ed8;
        }

        .old-btn {
            background: #f59e0b;
            color: white;
        }

        .old-btn:hover {
            background: #d97706;
        }

        .follow-btn {
            background: #0f766e;
            color: white;
        }

        .follow-btn:hover {
            background: #115e59;
        }

        .amount-box {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .amount-input {
            width: 90px;
            padding: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .save-amount-btn {
            background: #16a34a;
            color: white;
            padding: 7px 9px;
        }

        .empty {
            padding: 18px;
            background: #f8fafc;
            border-radius: 10px;
            color: #64748b;
            text-align: center;
        }

        .no-results {
            display: none;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
        }

        /* MODAL */

        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            padding: 25px;
            overflow-y: auto;
        }

        .modal-overlay.show {
            display: block;
        }

        .modal {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
        }

        .modal-header {
            padding: 20px;
            background: linear-gradient(135deg, #087f8c, #2563eb);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            font-size: 22px;
            width: 38px;
            height: 38px;
            padding: 0;
        }

        .modal-body {
            padding: 22px;
        }

        .patient-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .detail-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 13px;
        }

        .detail-card .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .detail-card .value {
            font-weight: bold;
        }

        .history-title {
            margin: 15px 0 12px;
            font-size: 19px;
        }

        .history-table {
            min-width: 700px;
        }

        .total-box {
            margin-top: 15px;
            padding: 15px;
            background: #ecfdf5;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #047857;
        }

        .status-message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 10000;
            display: none;
            max-width: 350px;
            padding: 14px 18px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .status-success {
            background: #16a34a;
        }

        .status-error {
            background: #dc2626;
        }

        @media (max-width: 900px) {
            .filters {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .patient-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {
            .container {
                padding: 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }

            .modal-overlay {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>👨‍⚕️ Doctor Appointments</h1>
    <p>Manage patients by doctor and appointment date</p>
</div>

<div class="container">

    <!-- FILTERS -->
    <div class="filters">

        <div class="filter-box">
            <label for="doctorFilter">Doctor</label>
            <select id="doctorFilter">
                <option value="ALL">All Doctors</option>
            </select>
        </div>

        <div class="filter-box">
            <label for="searchInput">Search Patient</label>
            <input
                type="text"
                id="searchInput"
                placeholder="Search name or mobile..."
            >
        </div>

        <div class="filter-box">
            <label for="dateFilter">Date</label>
            <input
                type="date"
                id="dateFilter"
            >
        </div>

    </div>

    <!-- SUMMARY -->
    <div class="summary">

        <div class="summary-card">
            <div class="number" id="totalPatients">0</div>
            <div class="label">Total Patients</div>
        </div>

        <div class="summary-card">
            <div class="number" id="totalDoctors">0</div>
            <div class="label">Doctors</div>
        </div>

        <div class="summary-card">
            <div class="number" id="todayCount">0</div>
            <div class="label">Today</div>
        </div>

        <div class="summary-card">
            <div class="number" id="upcomingCount">0</div>
            <div class="label">Upcoming</div>
        </div>

    </div>

    <!-- APPOINTMENTS WILL BE RENDERED HERE -->
    <div id="appointmentsContainer"></div>

    <div id="noResults" class="no-results">
        <h3>No appointments found</h3>
        <p>Try changing your search or filters.</p>
    </div>

</div>


<!-- DETAILS MODAL -->
<div id="detailsModal" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">
            <h2>👤 Patient Details</h2>

            <button
                type="button"
                class="close-btn"
                onclick="closeDetails()"
            >
                ×
            </button>
        </div>

        <div class="modal-body">

            <div id="patientDetailsContent"></div>

        </div>

    </div>

</div>


<div id="statusMessage" class="status-message"></div>


<script>
/*
    ============================================================
    APPOINTMENT DATA
    ============================================================
*/

var appointments = {{ patients | tojson | safe }};

if (!Array.isArray(appointments)) {
    appointments = [];
}


/*
    ============================================================
    BASIC HELPERS
    ============================================================
*/

function escapeHtml(value) {
    var text = String(value === undefined || value === null ? "" : value);

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function normalizeMobile(mobile) {
    var digits = String(mobile || "").replace(/\D/g, "");

    if (digits.length === 12 && digits.indexOf("91") === 0) {
        digits = digits.substring(2);
    }

    return digits;
}


function normalizeDate(value) {
    if (!value) {
        return "";
    }

    var text = String(value).trim();

    /*
        YYYY-MM-DD
    */
    if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
        return text;
    }

    /*
        DD-MM-YYYY
    */
    if (/^\d{2}-\d{2}-\d{4}$/.test(text)) {
        var a = text.split("-");
        return a[2] + "-" + a[1] + "-" + a[0];
    }

    /*
        DD/MM/YYYY
    */
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(text)) {
        var b = text.split("/");
        return b[2] + "-" + b[1] + "-" + b[0];
    }

    return "";
}


function todayISO() {
    var now = new Date();

    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, "0");
    var day = String(now.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}


function getAppointmentDate(p) {
    return normalizeDate(
        p.appointment_date ||
        p.date ||
        ""
    );
}


function getAppointmentTime(p) {
    return String(
        p.appointment_time ||
        p.time ||
        "00:00"
    );
}


function getAppointmentTimestamp(p) {
    var date = getAppointmentDate(p);
    var time = getAppointmentTime(p);

    if (!date) {
        return 0;
    }

    var timestamp = new Date(
        date + "T" + time
    ).getTime();

    if (isNaN(timestamp)) {
        timestamp = new Date(date).getTime();
    }

    return isNaN(timestamp) ? 0 : timestamp;
}


function getDoctorName(p) {
    return String(
        p.doctor_name ||
        p.doctor ||
        "Unknown Doctor"
    ).trim();
}


function getVisitNumber(p) {
    var number = parseInt(p.visit_number, 10);

    if (!isNaN(number) && number > 0) {
        return number;
    }

    return 1;
}


function getPatientType(p) {
    var type = String(
        p.patient_status ||
        p.type ||
        "NEW"
    ).toUpperCase();

    if (getVisitNumber(p) === 1) {
        return "NEW";
    }

    if (type !== "OLD") {
        return "NEW";
    }

    return "OLD";
}


function getAmount(p) {
    var amount = Number(p.amount);

    if (isNaN(amount)) {
        return 0;
    }

    return amount;
}


function formatAmount(amount) {
    var value = Number(amount);

    if (isNaN(value)) {
        value = 0;
    }

    return "₹" + value.toFixed(2);
}


function formatDate(date) {
    if (!date) {
        return "-";
    }

    var parts = date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return parts[2] + "-" + parts[1] + "-" + parts[0];
}


function getSection(p) {
    var date = getAppointmentDate(p);
    var today = todayISO();

    if (!date) {
        return "PAST";
    }

    if (date === today) {
        return "TODAY";
    }

    if (date > today) {
        return "UPCOMING";
    }

    return "PAST";
}


/*
    ============================================================
    STATUS MESSAGE
    ============================================================
*/

function showMessage(message, success) {
    var box = document.getElementById("statusMessage");

    box.textContent = message;
    box.className = "status-message";

    if (success) {
        box.classList.add("status-success");
    } else {
        box.classList.add("status-error");
    }

    box.style.display = "block";

    setTimeout(function() {
        box.style.display = "none";
    }, 3000);
}


/*
    ============================================================
    FIREBASE TOKEN
    ============================================================
*/

async function getFirebaseToken() {

    /*
        First try Firebase currentUser.
        This works when your login page uses Firebase Auth.
    */

    try {

        if (
            typeof firebase !== "undefined" &&
            firebase.auth &&
            firebase.auth().currentUser
        ) {
            var token = await firebase
                .auth()
                .currentUser
                .getIdToken(true);

            if (token) {
                return token;
            }
        }

    } catch (error) {
        console.log("Firebase token error:", error);
    }


    /*
        Fallback: common localStorage names.
    */

    var keys = [
        "idToken",
        "id_token",
        "firebaseToken",
        "authToken",
        "token"
    ];

    for (var i = 0; i < keys.length; i++) {

        var value = localStorage.getItem(keys[i]);

        if (value) {
            return value;
        }
    }

    return null;
}


/*
    ============================================================
    DOCTOR LIST
    ============================================================
*/

function loadDoctorFilter() {

    var select = document.getElementById("doctorFilter");

    var doctors = {};

    for (var i = 0; i < appointments.length; i++) {

        var doctor = getDoctorName(appointments[i]);

        doctors[doctor] = true;
    }

    var names = Object.keys(doctors).sort();

    for (var j = 0; j < names.length; j++) {

        var option = document.createElement("option");

        option.value = names[j];
        option.textContent = names[j];

        select.appendChild(option);
    }
}


/*
    ============================================================
    FILTER
    ============================================================
*/

function getFilteredAppointments() {

    var doctor = document
        .getElementById("doctorFilter")
        .value;

    var search = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    var selectedDate = document
        .getElementById("dateFilter")
        .value;

    var result = [];

    for (var i = 0; i < appointments.length; i++) {

        var p = appointments[i];

        var doctorName = getDoctorName(p);

        var patientName = String(
            p.patient_name || p.name || ""
        ).toLowerCase();

        var mobile = normalizeMobile(p.mobile);

        var date = getAppointmentDate(p);

        if (
            doctor !== "ALL" &&
            doctorName !== doctor
        ) {
            continue;
        }

        if (
            search &&
            patientName.indexOf(search) === -1 &&
            mobile.indexOf(search) === -1
        ) {
            continue;
        }

        if (
            selectedDate &&
            date !== selectedDate
        ) {
            continue;
        }

        result.push(p);
    }

    return result;
}


/*
    ============================================================
    RENDER
    ============================================================
*/

function renderAppointments() {

    var container = document.getElementById(
        "appointmentsContainer"
    );

    container.innerHTML = "";

    var filtered = getFilteredAppointments();

    updateSummary(filtered);

    if (filtered.length === 0) {

        document.getElementById(
            "noResults"
        ).style.display = "block";

        return;
    }

    document.getElementById(
        "noResults"
    ).style.display = "none";


    /*
        Group by doctor
    */

    var doctorGroups = {};

    for (var i = 0; i < filtered.length; i++) {

        var appointment = filtered[i];

        var doctor = getDoctorName(appointment);

        if (!doctorGroups[doctor]) {
            doctorGroups[doctor] = [];
        }

        doctorGroups[doctor].push(appointment);
    }


    var doctors = Object.keys(doctorGroups).sort();


    for (var d = 0; d < doctors.length; d++) {

        var doctorName = doctors[d];

        var doctorAppointments =
            doctorGroups[doctorName];


        /*
            Separate date sections
        */

        var today = [];
        var upcoming = [];
        var past = [];


        for (
            var x = 0;
            x < doctorAppointments.length;
            x++
        ) {

            var item = doctorAppointments[x];

            var section = getSection(item);

            if (section === "TODAY") {
                today.push(item);
            } else if (section === "UPCOMING") {
                upcoming.push(item);
            } else {
                past.push(item);
            }
        }


        /*
            TODAY: time ascending
        */

        today.sort(function(a, b) {
            return getAppointmentTimestamp(a) -
                   getAppointmentTimestamp(b);
        });


        /*
            UPCOMING: nearest date first
        */

        upcoming.sort(function(a, b) {
            return getAppointmentTimestamp(a) -
                   getAppointmentTimestamp(b);
        });


        /*
            PAST: latest past first
        */

        past.sort(function(a, b) {
            return getAppointmentTimestamp(b) -
                   getAppointmentTimestamp(a);
        });


        var doctorCard = document.createElement("div");

        doctorCard.className = "doctor-card";


        doctorCard.innerHTML =
            '<div class="doctor-header">' +
                '<h2>👨‍⚕️ ' +
                escapeHtml(doctorName) +
                '</h2>' +
                '<p>' +
                doctorAppointments.length +
                ' appointment(s)' +
                '</p>' +
            '</div>';


        doctorCard.appendChild(
            createSection(
                "TODAY",
                "today-title",
                today
            )
        );


        doctorCard.appendChild(
            createSection(
                "UPCOMING",
                "upcoming-title",
                upcoming
            )
        );


        doctorCard.appendChild(
            createSection(
                "PAST",
                "past-title",
                past
            )
        );


        container.appendChild(doctorCard);
    }
}


/*
    ============================================================
    CREATE SECTION
    ============================================================
*/

function createSection(title, titleClass, list) {

    var section = document.createElement("div");

    section.className = "section";


    var heading = document.createElement("div");

    heading.className =
        "section-title " + titleClass;

    heading.textContent =
        title + " (" + list.length + ")";


    section.appendChild(heading);


    if (list.length === 0) {

        var empty = document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No appointments in this section.";

        section.appendChild(empty);

        return section;
    }


    var wrapper = document.createElement("div");

    wrapper.className = "table-wrapper";


    var table = document.createElement("table");


    table.innerHTML =
        "<thead>" +
            "<tr>" +
                "<th>No</th>" +
                "<th>Patient</th>" +
                "<th>Gender</th>" +
                "<th>Age</th>" +
                "<th>Mobile</th>" +
                "<th>Date / Time</th>" +
                "<th>Visit</th>" +
                "<th>Type</th>" +
                "<th>Amount</th>" +
                "<th>Action / Follow-up</th>" +
            "</tr>" +
        "</thead>" +
        "<tbody></tbody>";


    var tbody = table.querySelector("tbody");


    for (var i = 0; i < list.length; i++) {

        var p = list[i];

        var row = createRow(p, i + 1);

        tbody.appendChild(row);
    }


    wrapper.appendChild(table);

    section.appendChild(wrapper);

    return section;
}


/*
    ============================================================
    CREATE TABLE ROW
    ============================================================
*/

function createRow(p, number) {

    var row = document.createElement("tr");


    var id = String(
        p.id ||
        p.appointment_id ||
        ""
    );


    var patientName = p.patient_name || p.name || "-";

    var gender = p.gender || "-";

    var age = p.age || "-";

    var mobile = p.mobile || "-";

    var date = getAppointmentDate(p);

    var time = getAppointmentTime(p);

    var visit = getVisitNumber(p);

    var type = getPatientType(p);

    var amount = getAmount(p);


    var typeClass =
        type === "OLD"
            ? "type-old"
            : "type-new";


    row.innerHTML =
        "<td>" +
            number +
        "</td>" +

        "<td>" +
            '<div class="patient-name">' +
                escapeHtml(patientName) +
            "</div>" +
        "</td>" +

        "<td>" +
            escapeHtml(gender) +
        "</td>" +

        "<td>" +
            escapeHtml(age) +
        "</td>" +

        '<td class="mobile">' +
            escapeHtml(mobile) +
        "</td>" +

        "<td>" +
            escapeHtml(formatDate(date)) +
            "<br>" +
            '<small>' +
                escapeHtml(time) +
            "</small>" +
        "</td>" +

        "<td>" +
            '<span class="visit-badge">' +
                "Visit " + visit +
            "</span>" +
        "</td>" +

        "<td>" +
            '<span class="type-badge ' +
                typeClass +
            '">' +
                type +
            "</span>" +
        "</td>" +

        "<td>" +
            '<div class="amount-box">' +
                '<input ' +
                    'type="number" ' +
                    'min="0" ' +
                    'step="0.01" ' +
                    'class="amount-input" ' +
                    'id="amount-' +
                        escapeHtml(id) +
                    '" ' +
                    'value="' +
                        escapeHtml(amount) +
                    '">' +

                '<button ' +
                    'type="button" ' +
                    'class="save-amount-btn" ' +
                    'onclick="saveAmount(\'' +
                        escapeJs(id) +
                    '\')">' +
                    "Save" +
                "</button>" +
            "</div>" +
        "</td>" +

        "<td>" +
            '<div class="action-box">' +

                '<button ' +
                    'type="button" ' +
                    'class="details-btn" ' +
                    'onclick="showDetails(\'' +
                        escapeJs(id) +
                    '\')">' +
                    "Details" +
                "</button>" +

                (
                    type === "NEW"
                    ? '<button ' +
                        'type="button" ' +
                        'class="old-btn" ' +
                        'onclick="makeOld(\'' +
                            escapeJs(id) +
                        '\')">' +
                        "Make OLD" +
                      "</button>"
                    : ""
                ) +

                '<a ' +
                    'class="action-link follow-btn" ' +
                    'href="/followups/{{ uid }}">' +
                    "Follow-up" +
                "</a>" +

            "</div>" +
        "</td>";


    return row;
}


/*
    Escape JavaScript string
*/

function escapeJs(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\r/g, "\\r")
        .replace(/\n/g, "\\n");
}


/*
    ============================================================
    SUMMARY
    ============================================================
*/

function updateSummary(list) {

    document.getElementById(
        "totalPatients"
    ).textContent = list.length;


    var doctors = {};

    var today = 0;

    var upcoming = 0;


    for (var i = 0; i < list.length; i++) {

        var p = list[i];

        doctors[getDoctorName(p)] = true;

        var section = getSection(p);

        if (section === "TODAY") {
            today++;
        }

        if (section === "UPCOMING") {
            upcoming++;
        }
    }


    document.getElementById(
        "totalDoctors"
    ).textContent =
        Object.keys(doctors).length;


    document.getElementById(
        "todayCount"
    ).textContent = today;


    document.getElementById(
        "upcomingCount"
    ).textContent = upcoming;
}


/*
    ============================================================
    DETAILS
    ============================================================
*/

function showDetails(appointmentId) {

    var current = null;


    for (var i = 0; i < appointments.length; i++) {

        var id = String(
            appointments[i].id ||
            appointments[i].appointment_id ||
            ""
        );

        if (id === String(appointmentId)) {

            current = appointments[i];

            break;
        }
    }


    if (!current) {

        showMessage(
            "Appointment details not found.",
            false
        );

        return;
    }


    var patientMobile =
        normalizeMobile(current.mobile);


    /*
        Find all visits of same patient.
        We match hospital + normalized mobile.
    */

    var history = [];


    for (var j = 0; j < appointments.length; j++) {

        var other = appointments[j];

        var otherMobile =
            normalizeMobile(other.mobile);


        var sameHospital = true;

        if (
            current.hospital_id &&
            other.hospital_id
        ) {
            sameHospital =
                String(current.hospital_id) ===
                String(other.hospital_id);
        }


        if (
            sameHospital &&
            otherMobile &&
            otherMobile === patientMobile
        ) {
            history.push(other);
        }
    }


    /*
        Latest first
    */

    history.sort(function(a, b) {

        return getAppointmentTimestamp(b) -
               getAppointmentTimestamp(a);

    });


    var totalAmount = 0;

    for (var k = 0; k < history.length; k++) {

        totalAmount += getAmount(history[k]);
    }


    var html = "";


    html +=
        '<div class="patient-grid">' +

            '<div class="detail-card">' +
                '<div class="label">Patient Name</div>' +
                '<div class="value">' +
                    escapeHtml(
                        current.patient_name ||
                        current.name ||
                        "-"
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Mobile</div>' +
                '<div class="value">' +
                    escapeHtml(
                        current.mobile || "-"
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Gender</div>' +
                '<div class="value">' +
                    escapeHtml(
                        current.gender || "-"
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Age</div>' +
                '<div class="value">' +
                    escapeHtml(
                        current.age || "-"
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Address</div>' +
                '<div class="value">' +
                    escapeHtml(
                        current.address || "-"
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Doctor</div>' +
                '<div class="value">' +
                    escapeHtml(
                        getDoctorName(current)
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Specialization</div>' +
                '<div class="value">' +
                    escapeHtml(
                        current.specialization || "-"
                    ) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Current Visit</div>' +
                '<div class="value">' +
                    "Visit " +
                    getVisitNumber(current) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Current Type</div>' +
                '<div class="value">' +
                    getPatientType(current) +
                "</div>" +
            "</div>" +

            '<div class="detail-card">' +
                '<div class="label">Current Amount</div>' +
                '<div class="value">' +
                    formatAmount(
                        getAmount(current)
                    ) +
                "</div>" +
            "</div>" +

        "</div>";


    html +=
        '<h3 class="history-title">' +
            "📋 Previous Visit History" +
        "</h3>";


    if (history.length === 0) {

        html +=
            '<div class="empty">' +
                "No previous visit history found." +
            "</div>";

    } else {

        html +=
            '<div class="table-wrapper">' +

                '<table class="history-table">' +

                    "<thead>" +
                        "<tr>" +
                            "<th>No</th>" +
                            "<th>Visit</th>" +
                            "<th>Date</th>" +
                            "<th>Time</th>" +
                            "<th>Doctor</th>" +
                            "<th>Type</th>" +
                            "<th>Amount</th>" +
                        "</tr>" +
                    "</thead>" +

                    "<tbody>";


        for (var h = 0; h < history.length; h++) {

            var visitItem = history[h];

            html +=
                "<tr>" +

                    "<td>" +
                        (h + 1) +
                    "</td>" +

                    "<td>" +
                        '<span class="visit-badge">' +
                            "Visit " +
                            getVisitNumber(visitItem) +
                        "</span>" +
                    "</td>" +

                    "<td>" +
                        escapeHtml(
                            formatDate(
                                getAppointmentDate(
                                    visitItem
                                )
                            )
                        ) +
                    "</td>" +

                    "<td>" +
                        escapeHtml(
                            getAppointmentTime(
                                visitItem
                            )
                        ) +
                    "</td>" +

                    "<td>" +
                        escapeHtml(
                            getDoctorName(
                                visitItem
                            )
                        ) +
                    "</td>" +

                    "<td>" +
                        escapeHtml(
                            getPatientType(
                                visitItem
                            )
                        ) +
                    "</td>" +

                    "<td>" +
                        '<strong>' +
                            formatAmount(
                                getAmount(
                                    visitItem
                                )
                            ) +
                        "</strong>" +
                    "</td>" +

                "</tr>";
        }


        html +=
                    "</tbody>" +
                "</table>" +

            "</div>";
    }


    html +=
        '<div class="total-box">' +
            "💰 Total Amount Paid: " +
            formatAmount(totalAmount) +
        "</div>";


    document.getElementById(
        "patientDetailsContent"
    ).innerHTML = html;


    document.getElementById(
        "detailsModal"
    ).classList.add("show");
}


/*
    ============================================================
    CLOSE DETAILS
    ============================================================
*/

function closeDetails() {

    document.getElementById(
        "detailsModal"
    ).classList.remove("show");
}


document.getElementById(
    "detailsModal"
).addEventListener(
    "click",
    function(event) {

        if (event.target === this) {

    }
);


/*
    ============================================================
    MAKE OLD
    ============================================================
*/

async function makeOld(appointmentId) {

    var current = null;


    for (var i = 0; i < appointments.length; i++) {

        var id = String(
            appointments[i].id ||
            appointments[i].appointment_id ||
            ""
        );

        if (id === String(appointmentId)) {

            current = appointments[i];

            break;
        }
    }


    if (!current) {

        showMessage(
            "Patient appointment not found.",
            false
        );

        return;
    }


    var mobile = normalizeMobile(
        current.mobile
    );


    if (!mobile) {

        showMessage(
            "Patient mobile number is missing.",
            false
        );

        return;
    }


    if (!confirm(
        "Are you sure you want to make this patient OLD?"
    )) {
        return;
    }


    try {

        var token = await getFirebaseToken();


        if (!token) {

            showMessage(
                "Login session not found. Please login again.",
                false
            );

            return;
        }


        var response = await fetch(
            "/api/doctor/make-patient-old",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + token
                },

                body: JSON.stringify({
                    mobile: mobile
                })
            }
        );


        var data = await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Unable to make patient OLD."
            );
        }


        /*
            Update local appointment data.
            Visit 1 must remain NEW.
            Visit 2+ become OLD.
        */

        for (
            var j = 0;
            j < appointments.length;
            j++
        ) {

            var p = appointments[j];

            if (
                normalizeMobile(p.mobile) === mobile
            ) {

                if (getVisitNumber(p) > 1) {
                    p.patient_status = "OLD";
                }

                if (getVisitNumber(p) === 1) {
                    p.patient_status = "NEW";
                }
            }
        }


        showMessage(
            "Patient successfully changed to OLD.",
            true
        );


        renderAppointments();

    } catch (error) {

        console.error(
            "MAKE OLD ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Failed to make patient OLD.",
            false
        );
    }
}


/*
    ============================================================
    SAVE AMOUNT
    ============================================================
*/

async function saveAmount(appointmentId) {

    var input = document.getElementById(
        "amount-" + appointmentId
    );


    if (!input) {

        showMessage(
            "Amount field not found.",
            false
        );

        return;
    }


    var amount = Number(input.value);


    if (isNaN(amount) || amount < 0) {

        showMessage(
            "Please enter a valid amount.",
            false
        );

        return;
    }


    try {

        var token = await getFirebaseToken();


        if (!token) {

            showMessage(
                "Login session not found. Please login again.",
                false
            );

            return;
        }


        var response = await fetch(
            "/api/appointment/" +
            encodeURIComponent(appointmentId) +
            "/amount",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + token
                },

                body: JSON.stringify({
                    amount: amount
                })
            }
        );


        var data = await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Amount update failed."
            );
        }


        /*
            Update local appointment
        */

        for (
            var i = 0;
            i < appointments.length;
            i++
        ) {

            var id = String(
                appointments[i].id ||
                appointments[i].appointment_id ||
                ""
            );

            if (id === String(appointmentId)) {

                appointments[i].amount =
                    amount;

                break;
            }
        }


        showMessage(
            "Amount updated successfully.",
            true
        );


        renderAppointments();

    } catch (error) {

        console.error(
            "SAVE AMOUNT ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Failed to update amount.",
            false
        );
    }
}
