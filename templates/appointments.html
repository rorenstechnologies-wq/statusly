<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Appointments</title>


    <style>

/* =========================================================
   STATUSLY - DOCTOR APPOINTMENTS
   COMPLETE SINGLE FILE
   PATIENT HISTORY = NAME + MOBILE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: #f4f8fa;
    color: #172033;
    font-size: 14px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    width: 100%;
    background: linear-gradient(
        135deg,
        #0f766e 0%,
        #0e7490 100%
    );
    color: white;
    padding: 28px 32px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .10);
    position: relative;
}

.header::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 220px;
    height: 100%;
    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.12),
            transparent 65%
        );
    pointer-events: none;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: -.4px;
    position: relative;
    z-index: 1;
}

.header p {
    margin: 8px 0 0;
    font-size: 14px;
    opacity: .92;
    line-height: 1.5;
    position: relative;
    z-index: 1;
}


/* =========================================================
   MAIN
========================================================= */

.container {
    width: 100%;
    max-width: 1550px;
    margin: 0 auto;
    padding: 28px;
}


/* =========================================================
   FILTER CARD
========================================================= */

.filter-card {
    width: 100%;
    background: white;
    padding: 22px;
    border-radius: 16px;
    border: 1px solid #e5edf1;
    box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
    margin-bottom: 22px;
}

.filters {
    width: 100%;
    display: grid;
    grid-template-columns:
        1fr
        2fr
        1fr
        1fr
        1fr
        auto;
    align-items: end;
    gap: 14px;
}

.filter-group {
    min-width: 0;
}

.filter-group label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .35px;
    color: #64748b;
    margin-bottom: 7px;
}

.filter-group select,
.filter-group input {
    width: 100%;
    min-height: 46px;
    padding: 11px 14px;
    border: 1px solid #dbe4e8;
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: #1e293b;
    background: white;
    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.filter-group select:focus,
.filter-group input:focus {
    border-color: #0f766e;
    box-shadow: 0 0 0 3px rgba(15,118,110,.10);
}

.filter-group input::placeholder {
    color: #94a3b8;
}

.clear-filter-btn {
    min-height: 46px;
    padding: 10px 18px;
    border: 1px solid #fecaca;
    border-radius: 10px;
    background: #fff1f2;
    color: #dc2626;
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s ease;
}

.clear-filter-btn:hover {
    background: #fee2e2;
    border-color: #fca5a5;
    transform: translateY(-1px);
}


/* =========================================================
   FILTER RESPONSIVE
========================================================= */

@media (max-width: 1200px) {

    .filters {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 800px) {

    .filters {
        grid-template-columns:
            repeat(2, 1fr);
    }

}


/* =========================================================
   SUMMARY
========================================================= */

.summary-grid {
    width: 100%;
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 24px;
}

.summary-card {
    min-width: 0;
    background: white;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #e5edf1;
    box-shadow: 0 4px 18px rgba(15,23,42,.06);
    display: flex;
    align-items: center;
    gap: 15px;
    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.summary-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(15,23,42,.10);
}

.summary-icon {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: #ecfdf5;
    border: 1px solid #d1fae5;
}

.summary-card span {
    display: block;
    font-size: 10px;
    color: #64748b;
    font-weight: 800;
    letter-spacing: .45px;
}

.summary-card strong {
    display: block;
    margin-top: 5px;
    font-size: 24px;
    line-height: 1;
    color: #172033;
    font-weight: 800;
}


/* =========================================================
   DOCTOR CARD
========================================================= */

.doctor-card {
    width: 100%;
    background: white;
    border-radius: 18px;
    margin-bottom: 24px;
    overflow: hidden;
    border: 1px solid #e3ecef;
    box-shadow: 0 5px 22px rgba(15,23,42,.08);
}

.doctor-header {
    padding: 20px 24px;
    background:
        linear-gradient(
            135deg,
            #f0fdfa 0%,
            #eff6ff 100%
        );
    border-bottom: 1px solid #e5edf1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.doctor-title {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.doctor-avatar {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 14px;
    background:
        linear-gradient(
            135deg,
            #dff7f3,
            #dbeafe
        );
    border: 1px solid #c9eeea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    box-shadow: 0 4px 10px rgba(15,118,110,.08);
}

.doctor-title > div:last-child {
    min-width: 0;
}

.doctor-title h2 {
    margin: 0;
    font-size: 19px;
    line-height: 1.3;
    font-weight: 800;
    color: #172033;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.doctor-title p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 11px;
    font-weight: 500;
}

.doctor-count {
    background:
        linear-gradient(
            135deg,
            #0f766e,
            #0e7490
        );
    color: white;
    border-radius: 999px;
    padding: 9px 15px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}


/* =========================================================
   SECTION
========================================================= */

.section {
    width: 100%;
    padding: 22px 24px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
    font-size: 13px;
    font-weight: 800;
    color: #334155;
}

.section-title span {
    padding: 7px 11px;
    border-radius: 8px;
    background: #f1f5f9;
    font-size: 10px;
    font-weight: 800;
    color: #475569;
}


/* =========================================================
   TABLE
========================================================= */

.table-wrapper {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #0f766e #e2e8f0;
    border: 1px solid #dce7eb;
    border-radius: 12px;
    background: white;
}

.table-wrapper::-webkit-scrollbar {
    height: 9px;
}

.table-wrapper::-webkit-scrollbar-track {
    background: #e2e8f0;
    border-radius: 10px;
}

.table-wrapper::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            90deg,
            #0f766e,
            #0e7490
        );
    border-radius: 10px;
}

.table-wrapper::-webkit-scrollbar-thumb:hover {
    background: #115e59;
}

.table-wrapper table {
    width: max-content;
    min-width: 1400px;
    border-collapse: separate;
    border-spacing: 0;
}

.table-wrapper th {
    background: #f1f5f9;
    color: #475569;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .45px;
    padding: 15px 14px;
    text-align: left;
    white-space: nowrap;
    font-weight: 800;
    border-bottom: 1px solid #dce7eb;
}

.table-wrapper th:first-child {
    padding-left: 16px;
}

.table-wrapper td {
    padding: 15px 14px;
    border-bottom: 1px solid #edf2f5;
    font-size: 13px;
    color: #334155;
    vertical-align: middle;
    white-space: nowrap;
    background: white;
}

.table-wrapper tbody tr:hover td {
    background: #f0fdfa;
}

.table-wrapper tbody tr:last-child td {
    border-bottom: none;
}

.table-wrapper td:first-child strong {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 30px;
    padding: 0 7px;
    border-radius: 8px;
    background: #f1f5f9;
    color: #475569;
    font-size: 12px;
}


/* =========================================================
   PATIENT CELL
========================================================= */

.patient-cell {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 230px;
}

.patient-avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 12px;
    background:
        linear-gradient(
            135deg,
            #e0f2fe,
            #dbeafe
        );
    border: 1px solid #bfdbfe;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
}

.patient-name {
    font-weight: 800;
    color: #1e293b;
    font-size: 14px;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.patient-id {
    display: block;
    margin-top: 4px;
    color: #94a3b8;
    font-size: 10px;
    font-weight: 500;
}


/* =========================================================
   TYPE
========================================================= */

.type-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
}

.type-new {
    background: #dbeafe;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}

.type-old {
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #bbf7d0;
}


/* =========================================================
   VISIT
========================================================= */

.visit-badge {
    display: inline-flex;
    align-items: center;
    padding: 7px 10px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-weight: 800;
    font-size: 10px;
    color: #475569;
}

.table-wrapper td strong {
    font-weight: 800;
}

.table-wrapper td div[style] {
    margin-top: 5px !important;
    font-size: 10px !important;
    color: #64748b !important;
}


/* =========================================================
   AMOUNT
========================================================= */

.amount-box {
    display: flex;
    align-items: center;
    gap: 7px;
}

.amount-input {
    width: 90px;
    height: 38px;
    padding: 8px 10px;
    border: 1px solid #dbe4e8;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    outline: none;
    color: #1e293b;
    background: white;
}

.amount-input:focus {
    border-color: #0f766e;
    box-shadow: 0 0 0 3px rgba(15,118,110,.10);
}

.save-amount {
    height: 38px;
    border: none;
    background:
        linear-gradient(
            135deg,
            #0f766e,
            #0e7490
        );
    color: white;
    border-radius: 8px;
    padding: 8px 13px;
    cursor: pointer;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
}

.save-amount:hover {
    transform: translateY(-2px);
}


/* =========================================================
   OLD
========================================================= */

.old-btn {
    border: 1px solid #fed7aa;
    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #ffedd5
        );
    color: #c2410c;
    padding: 9px 14px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
}

.old-btn:hover {
    background: #ffedd5;
    border-color: #fdba74;
    transform: translateY(-2px);
}

.already-old {
    display: inline-flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 999px;
    background: #dcfce7;
    border: 1px solid #bbf7d0;
    color: #15803d;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
}


/* =========================================================
   ACTION
========================================================= */

.action-buttons {
    display: flex;
    gap: 8px;
    align-items: center;
    white-space: nowrap;
}

.details-btn,
.follow-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 37px;
    padding: 9px 13px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
}

.details-btn {
    border: 1px solid #bae6fd;
    background:
        linear-gradient(
            135deg,
            #e0f2fe,
            #dbeafe
        );
    color: #0369a1;
}

.follow-btn {
    text-decoration: none;
    border: 1px solid #a7f3d0;
    background:
        linear-gradient(
            135deg,
            #ecfdf5,
            #d1fae5
        );
    color: #047857;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.68);
    backdrop-filter: blur(3px);
    z-index: 99999;
    padding: 20px;
    overflow-y: auto;
    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
}


/* =========================================================
   DETAILS MODAL
========================================================= */

.details-modal-content {
    width: 100%;
    max-width: 1050px;
    max-height: 92vh;
    background: #f8fafc;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,.28);
    animation: detailsModalIn .22s ease;
}

@keyframes detailsModalIn {

    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================================
   MODAL HEADER
========================================================= */

.modal-header {
    min-height: 68px;
    background:
        linear-gradient(
            135deg,
            #0f766e,
            #0e7490
        );
    color: white;
    padding: 13px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
}

.close-btn {
    border: none;
    background: rgba(255,255,255,.15);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 23px;
}


/* =========================================================
   DETAILS BODY
========================================================= */

.details-body {
    padding: 20px;
    max-height: calc(92vh - 68px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}


/* =========================================================
   PROFILE
========================================================= */

.patient-profile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 20px;
    background:
        linear-gradient(
            135deg,
            #f0fdfa,
            #eff6ff
        );
    border: 1px solid #dcefee;
    border-radius: 15px;
    margin-bottom: 15px;
}

.patient-profile-left {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
}

.large-patient-avatar {
    width: 62px;
    height: 62px;
    min-width: 62px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background:
        linear-gradient(
            135deg,
            #0f766e,
            #0e7490
        );
    color: white;
}

.patient-profile-left h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.patient-profile-left p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 10px;
}

.patient-phone {
    margin-top: 7px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
}

.detail-old,
.detail-new {
    flex-shrink: 0;
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
}

.detail-old {
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #bbf7d0;
}

.detail-new {
    background: #dbeafe;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}


/* =========================================================
   DETAIL SECTION
========================================================= */

.detail-section {
    margin-bottom: 14px;
    padding: 18px;
    border: 1px solid #e5edf1;
    border-radius: 14px;
    background: white;
}

.detail-section-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
    color: #134e4a;
    font-size: 13px;
    font-weight: 800;
}

.detail-section-title > span:first-child {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: #ecfdf5;
    font-size: 14px;
}

.visit-count {
    margin-left: auto;
    background: #f1f5f9;
    color: #64748b;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 9px;
}


/* =========================================================
   PATIENT INFO
========================================================= */

.patient-info-grid {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0, 1fr));
    gap: 10px;
}

.info-item {
    min-width: 0;
    padding: 12px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid #edf2f5;
}

.info-item.full {
    grid-column: 1 / -1;
}

.info-item span {
    display: block;
    color: #94a3b8;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .3px;
    margin-bottom: 6px;
}

.info-item strong {
    display: block;
    font-size: 11px;
    color: #334155;
    line-height: 1.5;
    overflow-wrap: anywhere;
}


/* =========================================================
   CURRENT APPOINTMENT
========================================================= */

.current-appointment-card {
    border-radius: 12px;
    padding: 15px;
    background:
        linear-gradient(
            135deg,
            #f8fffe,
            #f8fbff
        );
    border: 1px solid #dcefee;
}

.doctor-profile {
    display: flex;
    align-items: center;
    gap: 11px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid #e5edf1;
}

.small-doctor-avatar {
    width: 43px;
    height: 43px;
    min-width: 43px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0f2fe;
    font-size: 19px;
}

.doctor-profile strong {
    display: block;
    font-size: 13px;
}

.doctor-profile span {
    display: block;
    margin-top: 3px;
    color: #64748b;
    font-size: 9px;
}

.appointment-info {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 9px;
}

.appointment-info div {
    min-width: 0;
    padding: 10px;
    background: white;
    border-radius: 9px;
    border: 1px solid #edf2f5;
}

.appointment-info span {
    display: block;
    font-size: 7px;
    font-weight: 800;
    color: #94a3b8;
    letter-spacing: .3px;
    margin-bottom: 5px;
}

.appointment-info strong {
    display: block;
    font-size: 10px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.current-amount {
    color: #0f766e !important;
}


/* =========================================================
   VISIT HISTORY
========================================================= */

.visit-history {
    width: 100%;
    border: 1px solid #e8eef2;
    border-radius: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.history-heading {
    display: grid;
    grid-template-columns:
        1.2fr
        1.5fr
        1fr
        .8fr
        .8fr;
    gap: 10px;
    min-width: 650px;
    padding: 10px 13px;
    background: #f8fafc;
    color: #94a3b8;
    font-size: 8px;
    font-weight: 800;
    text-transform: uppercase;
}

.visit-history-row {
    display: grid;
    grid-template-columns:
        1.2fr
        1.5fr
        1fr
        .8fr
        .8fr;
    align-items: center;
    gap: 10px;
    min-width: 650px;
    padding: 13px;
    border-bottom: 1px solid #edf2f5;
    background: white;
}

.visit-history-row:last-child {
    border-bottom: none;
}

<script type="module">

import {

from

import {
    getAuth,

}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

const firebaseApp =
    getApps().length
        ? getApp()
        : initializeApp(firebaseConfig);


const auth =
    getAuth(firebaseApp);


/* =====================================================
   AUTH READY
===================================================== */

const authReady =
    new Promise(
        (resolve) => {

            const unsubscribe =
                onAuthStateChanged(
                    auth,
                    (user) => {

                        unsubscribe();

                        resolve(user);

                    }
                );

        }
    );


/* =====================================================
   TOKEN
===================================================== */

async function getStatuslyToken() {

    const user =
        await authReady;


    if (!user) {

        throw new Error(
            "Login session not found. Please login again."
        );

    }


    return await user.getIdToken(true);

}


/* =====================================================
   AUTH FETCH
===================================================== */

async function statuslyFetch(
    url,
    options = {}
) {

    const token =
        await getStatuslyToken();


    const headers =
        new Headers(
            options.headers || {}
        );


    headers.set(
        "Authorization",
        "Bearer " + token
    );


    if (
        options.body &&
        !headers.has("Content-Type")
    ) {

        headers.set(
            "Content-Type",
            "application/json"
        );

    }


    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}


/* =====================================================
   FLASK DATA

   Flask:

   render_template(
       "appointments.html",
       patients=patients,
       uid=uid
   )
===================================================== */

const APPOINTMENTS =
    {{ patients | default([]) | tojson | safe }};


const UID =
    "{{ uid }}";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   NORMALIZE MOBILE
===================================================== */

function normalizeMobile(mobile) {

    let digits =
        String(mobile || "")
            .replace(/\D/g, "");


    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.slice(-10);

    }


    return digits;

}


/* =====================================================
   NORMALIZE PATIENT NAME

   This is important.

   "Rahul Patil"
   "rahul patil"
   "  Rahul   Patil  "

   all become:

   "rahul patil"
===================================================== */

function normalizePatientName(name) {

    return String(name || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

}


/* =====================================================
   PATIENT IDENTITY

   IMPORTANT:

   Patient identity =
       NAME + MOBILE

   Example:

   rahul patil||9876543210
===================================================== */

function getPatientIdentity(patient) {

    const name =
        normalizePatientName(
            patient.patient_name
        );


    const mobile =
        normalizeMobile(
            patient.mobile
        );


    return name + "||" + mobile;

}


/* =====================================================
   NORMALIZE DATE
===================================================== */

function normalizeDate(date) {

    if (!date) {
        return "";
    }


    const value =
        String(date).trim();


    if (
        /^\d{4}-\d{2}-\d{2}$/.test(value)
    ) {

        return value;

    }


    const parts =
        value.split(/[-/]/);


    if (parts.length === 3) {

        if (parts[0].length === 4) {

            return [

                parts[0],

                parts[1].padStart(2, "0"),

                parts[2].padStart(2, "0")

            ].join("-");

        }


        return [

            parts[2],

            parts[1].padStart(2, "0"),

            parts[0].padStart(2, "0")

        ].join("-");

    }


    return value;

}


/* =====================================================
   TODAY
===================================================== */

function todayISO() {

    const now =
        new Date();


    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");

}


/* =====================================================
   AMOUNT
===================================================== */

function amount(value) {

    const n =
        Number(value || 0);


    return Number.isFinite(n)
        ? n
        : 0;

}


/* =====================================================
   MONEY
===================================================== */

function money(value) {

    return "₹" +
        amount(value)
            .toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    const normalized =
        normalizeDate(date);


    if (!normalized) {
        return "-";
    }


    const d =
        new Date(
            normalized + "T00:00:00"
        );


    if (isNaN(d.getTime())) {

        return escapeHtml(date);

    }


    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   CATEGORY
===================================================== */

function getCategory(p) {

    const date =
        normalizeDate(
            p.appointment_date
        );


    const today =
        todayISO();


    if (date === today) {
        return "today";
    }


    if (date > today) {
        return "upcoming";
    }


    return "past";

}


/* =====================================================
   PATIENT TYPE
===================================================== */

function getPatientType(p) {

    const status =
        String(
            p.patient_status || "NEW"
        )
        .toUpperCase()
        .trim();


    return status === "OLD"
        ? "OLD"
        : "NEW";

}


/* =====================================================
   SORT
===================================================== */

function sortAppointments(list) {

    return [...list].sort(
        (a, b) => {

            const dateA =
                normalizeDate(
                    a.appointment_date
                );


            const dateB =
                normalizeDate(
                    b.appointment_date
                );


            const timeA =
                String(
                    a.appointment_time || "00:00"
                );


            const timeB =
                String(
                    b.appointment_time || "00:00"
                );


            const valueA =
                new Date(
                    dateA + "T" + timeA
                ).getTime();


            const valueB =
                new Date(
                    dateB + "T" + timeB
                ).getTime();


            return valueB - valueA;

        }
    );

}


/* =====================================================
   DOCTORS
===================================================== */

/* =====================================================
   RENDER
===================================================== */

function render() {

    const doctor =
        document.getElementById(
            "doctorFilter"
        ).value;


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const appointmentFilter =
        document.getElementById(
            "appointmentFilter"
        ).value;


    const patientTypeFilter =
        document.getElementById(
            "patientTypeFilter"
        ).value;


    const date =
        document.getElementById(
            "dateFilter"
        ).value;


    function matchesSearch(p) {

        if (!search) {
            return true;
        }


        let searchable = "";


        try {

            searchable =
                JSON.stringify(p);

        }

        catch (error) {

            searchable = "";

        }


        searchable +=
            " " + getCategory(p);


        searchable +=
            " " + getPatientType(p);


        searchable +=
            " " + normalizeDate(
                p.appointment_date
            );


        searchable +=
            " " + normalizePatientName(
                p.patient_name
            );


        searchable +=
            " " + normalizeMobile(
                p.mobile
            );


        return searchable
            .toLowerCase()
            .includes(search);

    }


    const filtered =
        APPOINTMENTS.filter(
            p => {

                const doctorName =
                    String(
                        p.doctor_name ||
                        "Unknown Doctor"
                    ).trim();


                if (
                    doctor &&
                    doctorName !== doctor
                ) {

                    return false;

                }


                if (!matchesSearch(p)) {
                    return false;
                }


                if (
                    appointmentFilter &&
                    getCategory(p) !==
                    appointmentFilter
                ) {

                    return false;

                }


                if (
                    patientTypeFilter &&
                    getPatientType(p) !==
                    patientTypeFilter
                ) {

                    return false;

                }


                if (
                    date &&
                    normalizeDate(
                        p.appointment_date
                    ) !== date
                ) {

                    return false;

                }


                return true;

            }
        );


    updateSummary(filtered);


    const container =
        document.getElementById(
            "doctorCards"
        );


    container.innerHTML = "";


    if (!filtered.length) {

        container.innerHTML = `

            <div class="doctor-card">

                <div class="empty">

                    🔎

                    <br><br>

                    <strong>
                        No appointments found.
                    </strong>

                    <br><br>

                    <small>
                        Try changing your search or filters.
                    </small>

                </div>

            </div>

        `;

        return;

    }


    const grouped = {};


    filtered.forEach(
        p => {

            const doctorName =
                p.doctor_name ||
                "Unknown Doctor";


            if (!grouped[doctorName]) {
                grouped[doctorName] = [];
            }


            grouped[doctorName].push(p);

        }
    );


    Object.entries(grouped).forEach(
        ([doctorName, patients]) => {


            patients =
                sortAppointments(
                    patients
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "doctor-card";


            card.innerHTML = `

                <div class="doctor-header">

                    <div class="doctor-title">

                        <div class="doctor-avatar">
                            👨‍⚕️
                        </div>

                        <div>

                            <h2>
                                ${escapeHtml(
                                    doctorName
                                )}
                            </h2>

                            <p>
                                Doctor Appointments
                            </p>

                        </div>

                    </div>


                    <div class="doctor-count">

                        ${patients.length}
                        Patients

                    </div>

                </div>

            `;


            const categories = [

                ["today", "📅 TODAY"],

                ["upcoming", "🔔 UPCOMING"],

                ["past", "📁 PAST"]

            ];


            let number = 1;


            categories.forEach(
                ([category, title]) => {


                    const rows =
                        patients.filter(
                            p =>
                                getCategory(p) ===
                                category
                        );


                    if (!rows.length) {
                        return;
                    }


                    const section =
                        document.createElement(
                            "div"
                        );


                    section.className =
                        "section";


                    section.innerHTML = `

                        <div class="section-title">

                            <span>
                                ${title}
                            </span>

                            ${rows.length}

                            Appointment${
                                rows.length === 1
                                    ? ""
                                    : "s"
                            }

                        </div>


                        <div class="table-wrapper">

                            <table>

                                <thead>

                                    <tr>

                                        <th>No</th>

                                        <th>
                                            Patient
                                        </th>

                                        <th>
                                            Gender
                                        </th>

                                        <th>
                                            Age
                                        </th>

                                        <th>
                                            Mobile
                                        </th>

                                        <th>
                                            Date / Time
                                        </th>

                                        <th>
                                            Visit
                                        </th>

                                        <th>
                                            Type
                                        </th>

                                        <th>
                                            Amount
                                        </th>

                                        <th>
                                            Make OLD
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${rows.map(
                                        p =>
                                            createRow(
                                                p,
                                                number++
                                            )
                                    ).join("")}

                                </tbody>

                            </table>

                        </div>

                    `;


                    card.appendChild(
                        section
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );

}

    selectedMobile = "";

    selectedPatientName = "";


    document.getElementById(
        "oldModal"
    ).classList.remove(
        "show"
    );


    document.body.style.overflow =

};


/* =====================================================
   CONFIRM MAKE OLD

   Sends:

   patient_name
   mobile

   Backend should use BOTH.
===================================================== */

window.confirmMakeOld =
async function() {


    if (
        !selectedPatientName &&
        !selectedMobile
    ) {

        return;

    }


    const button =
        document.getElementById(
            "confirmOldButton"
        );


    const patientName =
        selectedPatientName ||
        "Patient";


    try {


        button.disabled =
            true;


        button.textContent =
            "Updating...";


        const response =
            await statuslyFetch(

                "/api/doctor/make-patient-old",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            patient_name:
                                patientName,

                            mobile:
                                selectedMobile

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.error ||
                "Unable to make patient OLD."

            );

        }


        closeOldModal();


        alert(
            `${patientName} is now OLD.`
        );


        window.location.reload();


    }

    catch(error) {


        console.error(
            "MAKE OLD ERROR:",
            error
        );


        alert(

            error.message ||
            "Something went wrong while updating patient."

        );


        button.disabled =
            false;


        button.textContent =
            "Yes, Make OLD";

    }

};


/* =====================================================
   SAVE AMOUNT
===================================================== */

window.saveAmount =
async function(
    appointmentId
) {


    const input =
        document.getElementById(
            "amount-" +
            appointmentId
        );


    if (!input) {

        alert(
            "Amount field not found."
        );

        return;

    }


    const amountValue =
        Number(
            input.value
        );


    if (
        !Number.isFinite(
            amountValue
        ) ||
        amountValue < 0
    ) {

        alert(
            "Please enter a valid amount."
        );

        return;

    }


    try {


        const response =
            await statuslyFetch(

                "/api/appointment/" +
                encodeURIComponent(
                    appointmentId
                ) +
                "/amount",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            amount:
                                amountValue

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.error ||
                "Unable to save amount."

            );

        }


        const appointment =
            APPOINTMENTS.find(
                p =>
                    String(p.id) ===
                    String(appointmentId)
            );


        if (appointment) {

            appointment.amount =
                amountValue;

        }


        alert(
            "Amount saved successfully."
        );


    }

    catch(error) {


        console.error(
            "SAVE AMOUNT ERROR:",
            error
        );


        alert(

            error.message ||
            "Unable to save amount."

        );

    }

};

   BACKGROUND CLICK
===================================================== */

document.getElementById(
    "detailsModal"
)
.addEventListener(
    "click",
    function(e) {

            closeDetails();

        }

    }
);

)

    function(e) {

);


/* =====================================================
   ESC KEY
===================================================== */

    "keydown",
    function(e) {

        if (e.key === "Escape") {

            closeDetails();

            closeOldModal();

        }

    }
);
