<head>

    <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>

    <link

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family:
                "Inter",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa 0%,
                    #f8fafc 55%,
                    #eef6ff 100%
                );

            color: #172033;

            overflow-x: hidden;
        }


        /* =====================================================
           PAGE
        ====================================================== */

        .page {

            width: 100%;
            min-height: 100vh;

            padding: 24px;
        }


        .container {

            width: 100%;
            max-width: 1450px;

            margin: auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header {

            background: #ffffff;

            border:
                1px solid #e2eaee;

            border-radius: 18px;

            padding: 20px 24px;

            margin-bottom: 18px;

            box-shadow:
                0 10px 30px
                rgba(15, 23, 42, .06);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .header-left {

            min-width: 0;
        }


        .brand {

            color: #0f766e;

            font-size: 25px;

            font-weight: 800;
        }


        .brand span {

            color: #64748b;
        }


        .page-title {

            margin-top: 5px;

            font-size: 22px;

            font-weight: 800;

            color: #172033;
        }


        .page-subtitle {

            margin-top: 5px;

            color: #64748b;

            font-size: 12px;
        }


        .total-badge {

            flex-shrink: 0;

            background:
                #ecfdf5;

            color:
                #0f766e;

            border:
                1px solid #ccefe5;

            border-radius:
                999px;

            padding:
                10px 15px;

            font-size:
                12px;

            font-weight:
                800;
        }


        /* =====================================================
           FILTER PANEL
        ====================================================== */

        .filter-panel {

            background: #ffffff;

            border:
                1px solid #e2eaee;

            border-radius: 16px;

            padding: 18px;

            margin-bottom: 18px;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, .05);
        }


        .filter-grid {

            display: grid;

            grid-template-columns:
                1fr 1.5fr 1fr;

            gap: 12px;
        }


        .filter-field label {

            display: block;

            margin-bottom: 6px;

            color: #475569;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;
        }


        .filter-field input,
        .filter-field select {

            width: 100%;

            height: 43px;

            padding: 0 12px;

            border:
                1px solid #d9e4e8;

            border-radius: 9px;

            background: #fbfdfe;

            color: #172033;

            font-family: inherit;

            font-size: 12px;

            outline: none;
        }


        .filter-field input:focus,
        .filter-field select:focus {

            border-color: #0f766e;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(15, 118, 110, .08);
        }


        /* =====================================================
           DATE FILTER
        ====================================================== */

        .date-filter {

            display: flex;

            gap: 7px;

            margin-top: 14px;

            flex-wrap: wrap;
        }


        .date-btn {

            border: none;

            background: #f1f5f9;

            color: #64748b;

            padding: 9px 15px;

            border-radius: 9px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;
        }


        .date-btn:hover {

            background: #e2e8f0;
        }


        .date-btn.active {

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: #ffffff;
        }


        /* =====================================================
           SUMMARY CARDS
        ====================================================== */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 14px;

            margin-bottom: 20px;
        }


        .summary-card {

            background: #ffffff;

            border:
                1px solid #e2eaee;

            border-radius: 15px;

            padding: 17px;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, .05);
        }


        .summary-label {

            color: #64748b;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;
        }


        .summary-value {

            color: #172033;

            font-size: 25px;

            font-weight: 800;

            margin-top: 7px;
        }


        /* =====================================================
           DOCTOR CARD
        ====================================================== */

        .doctor-card {

            background: #ffffff;

            border:
                1px solid #e2eaee;

            border-radius: 18px;

            margin-bottom: 18px;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, .05);
        }


        .doctor-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 12px;

            padding: 16px 18px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #f8fafc

            border-bottom:
                1px solid #e5eeee;

        .doctor-name {

            font-size: 15px;

            font-weight: 800;

            color: #0f766e;
        }


        .doctor-count {

            background: #ffffff;

            border:
                1px solid #d8e9e8;

            color: #475569;

            padding: 6px 10px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 800;
        }


        /* =====================================================
           SECTION
        ====================================================== */

        .appointment-section {

            padding: 16px 18px;
        }


        .section-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;
        }


        .section-title h3 {

            font-size: 13px;

            font-weight: 800;

            color: #172033;
        }


        .section-title span {

            font-size: 10px;

            color: #64748b;

            font-weight: 700;
        }


        /* =====================================================
           TABLE
        ====================================================== */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            border:
                1px solid #e8eef0;

            border-radius: 12px;
        }


        table {

            width: 100%;

            min-width: 1050px;

            border-collapse: collapse;
        }


        th {

            background: #f8fafc;

            color: #64748b;

            padding: 11px 10px;

            text-align: left;

            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

            white-space: nowrap;

            border-bottom:
                1px solid #e8eef0;
        }


        td {

            padding: 12px 10px;

            border-bottom:
                1px solid #eef2f4;

            font-size: 11px;

            color: #334155;

            white-space: nowrap;

            vertical-align: middle;
        }


        tr:last-child td {

        }


        tbody tr:hover {

            background: #f8fffd;
        }


        .patient-name {

            color: #172033;

            font-weight: 800;
        }


        .mobile {

            color: #475569;

            font-weight: 600;
        }


        .date {

            font-weight: 700;

            color: #334155;
        }


        /* =====================================================
           STATUS
        ====================================================== */

        .patient-status {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 58px;

            padding: 5px 8px;

            border-radius: 999px;

            font-size: 9px;

            font-weight: 800;
        }


        .patient-status.new {

            background: #eff6ff;

            color: #2563eb;

            border:
                1px solid #dbeafe;
        }


        .patient-status.old {

            background: #ecfdf5;

            color: #15803d;

            border:
                1px solid #bbf7d0;
        }


        /* =====================================================
           VISIT
        ====================================================== */

        .visit-number {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 34px;

            height: 28px;

            border-radius: 8px;

            background: #f1f5f9;

            color: #334155;

            font-weight: 800;

            font-size: 10px;
        }


        /* =====================================================
           AMOUNT
        ====================================================== */

        .amount {

            color: #0f766e;

            font-weight: 800;

            font-size: 12px;
        }


        .amount::before {

            content: "₹";
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .action-group {

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .action-btn {

            border: none;

            border-radius: 7px;

            padding: 7px 9px;

            font-family: inherit;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;
        }


        .old-btn {

            background: #fff7ed;

            color: #c2410c;

            border:
                1px solid #fed7aa;
        }


        .old-btn:hover {

            background: #ffedd5;
        }


        .old-btn:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        .old-btn.done {

            background: #ecfdf5;

            color: #15803d;

            border-color: #bbf7d0;
        }


        .follow-btn {

            background: #eff6ff;

            color: #2563eb;

            border:
                1px solid #dbeafe;

            text-decoration: none;

            display: inline-flex;

            align-items: center;
        }


        .follow-btn:hover {

            background: #dbeafe;
        }


        /* =====================================================
           EMPTY
        ====================================================== */

        .empty {

            padding: 35px 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            font-weight: 700;
        }


        .hidden {

            display: none !important;
        }


        /* =====================================================
           TOAST
        ====================================================== */

        #toast {

            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translate(-50%, 100px);

            background: #172033;

            color: #ffffff;

            padding: 12px 18px;

            border-radius: 10px;

            font-size: 11px;

            font-weight: 700;

            z-index: 99999;

            opacity: 0;

            transition:
                .3s ease;
        }


        #toast.show {

            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        #toast.success {

            background: #15803d;
        }


        #toast.error {

            background: #dc2626;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {

            padding: 40px;

            text-align: center;

            color: #64748b;

            font-size: 12px;

            font-weight: 700;
        }


        .spinner {

            display: inline-block;

            width: 17px;

            height: 17px;

            border:
                2px solid #dbeafe;

            border-top-color:
                #0f766e;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 900px) {

            .page {

                padding: 12px;
            }


            .header {

                padding: 16px;

                align-items: flex-start;

                flex-direction: column;
            }


            .total-badge {

                align-self: flex-start;
            }


            .filter-grid {

                grid-template-columns: 1fr;
            }


            .summary-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .doctor-header {

                padding: 14px;
            }


            .appointment-section {

                padding: 12px;
            }

        }


        @media (max-width: 480px) {

            .page {

                padding: 7px;
            }


            .brand {

                font-size: 21px;
            }


            .page-title {

                font-size: 18px;
            }


            .page-subtitle {

                font-size: 10px;
            }


            .filter-panel {

                padding: 12px;
            }


            .summary-grid {

                gap: 8px;
            }


            .summary-card {

                padding: 12px;
            }


            .summary-value {

                font-size: 21px;
            }


            .date-filter {

                gap: 5px;
            }


            .date-btn {

                flex: 1;

                padding: 8px 6px;

                font-size: 9px;
            }

        }

    </style>

</head>


<body>

<script>


/* =========================================================
   FIREBASE CONFIG
   SAME CONFIG AS login.html
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"

};


/* =========================================================
   FIREBASE INITIALIZATION
========================================================= */

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();


/* =========================================================
   HOSPITAL ID
========================================================= */

const hospitalId =
    "{{ uid }}";


/* =========================================================
   DATA
========================================================= */

let allAppointments = [];

let activeDateFilter = "all";


/* =========================================================
   NORMALIZE MOBILE
========================================================= */

function normalizeMobile(mobile) {

    let digits =
        String(mobile || "")
            .replace(/\D/g, "");

    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.slice(-10);

    }

    return digits;
}


/* =========================================================
   DATE HELPERS
========================================================= */

function toDateObject(value) {

    if (!value) {
        return null;
    }

    const str =
        String(value).trim();


    /*
     * YYYY-MM-DD
     */

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(str)
    ) {

        const parts =
            str.split("-");

        return new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

    }


    /*
     * DD-MM-YYYY
     */

    if (
        /^\d{2}-\d{2}-\d{4}$/.test(str)
    ) {

        const parts =
            str.split("-");

        return new Date(
            Number(parts[2]),
            Number(parts[1]) - 1,
            Number(parts[0])
        );

    }


    /*
     * DD/MM/YYYY
     */

    if (
        /^\d{2}\/\d{2}\/\d{4}$/.test(str)
    ) {

        const parts =
            str.split("/");

        return new Date(
            Number(parts[2]),
            Number(parts[1]) - 1,
            Number(parts[0])
        );

    }


    const parsed =
        new Date(str);

    return isNaN(
        parsed.getTime()
    )
        ? null
        : parsed;
}


/* =========================================================
   LOCAL DATE
========================================================= */

function todayISO() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   DATE KEY
========================================================= */

function dateKey(value) {

    const date =
        toDateObject(value);

    if (!date) {
        return "";
    }

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   DATE STATUS
========================================================= */

function getDateStatus(value) {

    const key =
        dateKey(value);

    const today =
        todayISO();


    if (!key) {
        return "past";
    }


    if (key === today) {
        return "today";
    }


    if (key > today) {
        return "upcoming";
    }


    return "past";
}


/* =========================================================
   TIME TO NUMBER
========================================================= */

function timeNumber(value) {

    if (!value) {
        return 0;
    }

    const str =
        String(value)
            .trim()
            .toUpperCase();


    let match =
        str.match(
            /^(\d{1,2}):(\d{2})\s*(AM|PM)?$/
        );


    if (!match) {

        return 0;

    }


    let hour =
        Number(match[1]);

    const minute =
        Number(match[2]);

    const ampm =
        match[3];


    if (ampm === "AM" && hour === 12) {
        hour = 0;
    }


    if (ampm === "PM" && hour !== 12) {
        hour += 12;
    }


    return (
        hour * 60 +
        minute
    );

}


/* =========================================================
   SORT APPOINTMENTS
   LATEST FIRST
========================================================= */

function sortAppointments(list) {

    return list.sort(
        (a, b) => {

            const dateA =
                toDateObject(
                    a.appointment_date
                );

            const dateB =
                toDateObject(
                    b.appointment_date
                );


            const timeA =
                timeNumber(
                    a.appointment_time
                );

            const timeB =
                timeNumber(
                    b.appointment_time
                );


            const valueA =
                dateA
                    ? dateA.getTime()
                    : 0;

            const valueB =
                dateB
                    ? dateB.getTime()
                    : 0;


            if (
                valueA !== valueB
            ) {

                return valueB - valueA;

            }


            return timeB - timeA;

        }
    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value) {

    const date =
        toDateObject(value);

    if (!date) {
        return "-";
    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   SHOW TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message,
    type = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        "";


    toast.classList.add(
        "show",
        type
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================================
   GET FIREBASE USER
========================================================= */

async function getFirebaseUser() {

    if (auth.currentUser) {

        return auth.currentUser;

    }


    return new Promise(
        (resolve, reject) => {

            let finished = false;


            const unsubscribe =
                auth.onAuthStateChanged(
                    user => {

                        if (finished) {
                            return;
                        }


                        finished = true;

                        unsubscribe();


                        if (user) {

                            resolve(user);

                        }
                        else {

                            reject(
                                new Error(
                                    "Firebase user is not logged in."
                                )
                            );

                        }

                    }
                );


            setTimeout(
                () => {

                    if (finished) {
                        return;
                    }


                    finished = true;

                    unsubscribe();


                    reject(
                        new Error(
                            "Firebase authentication timeout."
                        )
                    );

                },
                10000
            );

        }
    );

}


/* =========================================================
   LOAD APPOINTMENTS FROM PAGE
========================================================= */

function loadAppointments() {

    /*
     * Jinja sends backend appointments
     * into JavaScript.
     */

    const rawAppointments =
        {{ patients|default([])|tojson }};


    if (
        Array.isArray(
            rawAppointments
        )
    ) {

        allAppointments =
            rawAppointments.map(
                appointment => {

                    return {
                        ...appointment
                    };

                }
            );

    }
    else {

        allAppointments = [];

    }


    /*
     * Make sure appointment IDs exist
     */

    allAppointments =
        allAppointments.map(
            (appointment, index) => {

                if (
                    !appointment.id &&
                    appointment.appointment_id
                ) {

                    appointment.id =
                        appointment.appointment_id;

                }


                if (!appointment.id) {

                    appointment.id =
                        "appointment-" +
                        index;

                }


                if (
                    !appointment.patient_status
                ) {

                    appointment.patient_status =
                        "NEW";

                }


                if (
                    !appointment.visit_number
                ) {

                    appointment.visit_number =
                        "-";

                }


                if (
                    appointment.charge === undefined ||
                    appointment.charge === null
                ) {

                    appointment.charge = 0;

                }


                return appointment;

            }
        );


    sortAppointments(
        allAppointments
    );


    populateDoctorFilter();

    updateSummary();

    renderAppointments();

}


/* =========================================================
   POPULATE DOCTOR FILTER
========================================================= */

function populateDoctorFilter() {

    const select =
        document.getElementById(
            "doctorFilter"
        );


    const doctors =
        new Set();


    allAppointments.forEach(
        appointment => {

            const doctor =
                String(
                    appointment.doctor_name || ""
                ).trim();


            if (doctor) {

                doctors.add(
                    doctor
                );

            }

        }
    );


    select.innerHTML =
        '<option value="all">All Doctors</option>';


    Array.from(doctors)
        .sort(
            (a, b) =>
                a.localeCompare(b)
        )
        .forEach(
            doctor => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    doctor;

                option.textContent =
                    doctor;

                select.appendChild(
                    option
                );

            }
        );

}


/* =========================================================
   GET FILTERED APPOINTMENTS
========================================================= */

function getFilteredAppointments() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const doctor =
        document
            .getElementById(
                "doctorFilter"
            )
            .value;


    const specificDate =
        document
            .getElementById(
                "specificDate"
            )
            .value;


    let filtered =
        allAppointments.filter(
            appointment => {

                const patient =
                    String(
                        appointment.patient_name || ""
                    ).toLowerCase();


                const doctorName =
                    String(
                        appointment.doctor_name || ""
                    ).toLowerCase();


                const mobile =
                    String(
                        appointment.mobile || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    patient.includes(search) ||
                    doctorName.includes(search) ||
                    mobile.includes(search);


                const matchesDoctor =
                    doctor === "all" ||
                    String(
                        appointment.doctor_name || ""
                    ) === doctor;


                const matchesDate =
                    !specificDate ||
                    dateKey(
                        appointment.appointment_date
                    ) === specificDate;


                const matchesSection =
                    activeDateFilter === "all" ||
                    getDateStatus(
                        appointment.appointment_date
                    ) === activeDateFilter;


                return (
                    matchesSearch &&
                    matchesDoctor &&
                    matchesDate &&
                    matchesSection
                );

            }
        );


    return sortAppointments(
        filtered
    );

}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary() {

    const total =
        allAppointments.length;


    const doctors =
        new Set();


    let today = 0;

    let upcoming = 0;


    allAppointments.forEach(
        appointment => {

            if (
                appointment.doctor_name
            ) {

                doctors.add(
                    appointment.doctor_name
                );

            }


            const status =
                getDateStatus(
                    appointment.appointment_date
                );


            if (
                status === "today"
            ) {

                today++;

            }


            if (
                status === "upcoming"
            ) {

                upcoming++;

            }

        }
    );


    document
        .getElementById(
            "summaryTotal"
        )
        .textContent =
        total;


    document
        .getElementById(
            "summaryDoctors"
        )
        .textContent =
        doctors.size;


    document
        .getElementById(
            "summaryToday"
        )
        .textContent =
        today;


    document
        .getElementById(
            "summaryUpcoming"
        )
        .textContent =
        upcoming;


    document
        .getElementById(
            "totalBadge"
        )
        .textContent =
        "Total: " + total;

}


/* =========================================================
   RENDER APPOINTMENTS
========================================================= */

function renderAppointments() {

    const container =
        document.getElementById(
            "appointmentsContainer"
        );


    const appointments =
        getFilteredAppointments();


    if (
        appointments.length === 0
    ) {

        container.innerHTML = `

            <div class="doctor-card">

                <div class="empty">

                    No appointments found.

                </div>

            </div>

        `;

        return;

    }


    /*
     * Group by doctor
     */

    const grouped =
        {};


    appointments.forEach(
        appointment => {

            const doctor =
                appointment.doctor_name ||
                "Doctor";


            if (
                !grouped[doctor]
            ) {

                grouped[doctor] = [];

            }


            grouped[doctor].push(
                appointment
            );

        }
    );


    let html = "";


    Object.keys(grouped)
        .sort()
        .forEach(
            doctor => {

                const list =
                    grouped[doctor];


                html += `

                    <div
                        class="doctor-card"
                    >

                        <div class="doctor-header">

                            <div class="doctor-name">

                                👨‍⚕️
                                ${escapeHtml(doctor)}

                            </div>

                            <div class="doctor-count">

                                ${list.length}
                                Appointments

                            </div>

                        </div>

                `;


                /*
                 * Separate today / upcoming / past
                 */

                const sections = [
                    {
                        key: "today",
                        title: "Today"
                    },
                    {
                        key: "upcoming",
                        title: "Upcoming"
                    },
                    {
                        key: "past",
                        title: "Past"
                    }
                ];


                sections.forEach(
                    section => {

                        const sectionAppointments =
                            list.filter(
                                appointment =>
                                    getDateStatus(
                                        appointment.appointment_date
                                    ) ===
                                    section.key
                            );


                        if (
                            sectionAppointments.length === 0
                        ) {

                            return;

                        }


                        /*
                         * Latest first
                         */

                        sortAppointments(
                            sectionAppointments
                        );


                        html += `

                            <div
                                class="appointment-section"
                            >

                                <div class="section-title">

                                    <h3>
                                        ${section.title}
                                    </h3>

                                    <span>
                                        ${sectionAppointments.length}
                                        appointment(s)
                                    </span>

                                </div>


                                <div class="table-wrapper">

                                    <table>

                                        <thead>

                                            <tr>

                                                <th>
                                                    No
                                                </th>

                                                <th>
                                                    Patient
                                                </th>

                                                <th>
                                                    Visit
                                                </th>

                                                <th>
                                                    Status
                                                </th>

                                                <th>
                                                    Gender
                                                </th>

                                                <th>
                                                    Age
                                                </th>

                                                <th>
                                                    Mobile
                                                </th>

                                                <th>
                                                    Date
                                                </th>

                                                <th>
                                                    Time
                                                </th>

                                                <th>
                                                    Amount
                                                </th>

                                                <th>
                                                    Action
                                                </th>

                                            </tr>

                                        </thead>

                                        <tbody>

                        `;


                        sectionAppointments.forEach(
                            (appointment, index) => {

                                const status =
                                    String(
                                        appointment.patient_status ||
                                        "NEW"
                                    ).toUpperCase();


                                const normalizedStatus =
                                    status === "OLD"
                                        ? "OLD"
                                        : "NEW";


                                const mobile =
                                    appointment.mobile ||
                                    "";


                                const visit =
                                    appointment.visit_number ||
                                    "-";


                                const charge =
                                    Number(
                                        appointment.charge || 0
                                    );


                                const amount =
                                    Number.isFinite(
                                        charge
                                    )
                                        ? charge
                                        : 0;


                                html += `

                                    <tr
                                        data-appointment-id="${escapeHtml(
                                            appointment.id || ""
                                        )}"
                                        data-patient-mobile="${escapeHtml(
                                            mobile
                                        )}"
                                    >

                                        <td>
                                            ${index + 1}
                                        </td>


                                        <td>

                                            <div class="patient-name">

                                                ${escapeHtml(
                                                    appointment.patient_name ||
                                                    "Unknown Patient"
                                                )}

                                            </div>

                                        </td>


                                        <td>

                                            <span class="visit-number">

                                                ${escapeHtml(
                                                    visit
                                                )}

                                            </span>

                                        </td>


                                        <td>

                                            <span
                                                class="patient-status ${
                                                    normalizedStatus === "OLD"
                                                        ? "old"
                                                        : "new"
                                                }"
                                            >

                                                ${normalizedStatus}

                                            </span>

                                        </td>


                                        <td>

                                            ${escapeHtml(
                                                appointment.gender ||
                                                "-"
                                            )}

                                        </td>


                                        <td>

                                            ${escapeHtml(
                                                appointment.age ||
                                                "-"
                                            )}

                                        </td>


                                        <td>

                                            <span class="mobile">

                                                ${escapeHtml(
                                                    mobile ||
                                                    "-"
                                                )}

                                            </span>

                                        </td>


                                        <td>

                                            <span class="date">

                                                ${formatDate(
                                                    appointment.appointment_date
                                                )}

                                            </span>

                                        </td>


                                        <td>

                                            ${escapeHtml(
                                                appointment.appointment_time ||
                                                "-"
                                            )}

                                        </td>


                                        <td>

                                            <span class="amount">

                                                ${amount.toFixed(2)}

                                            </span>

                                        </td>


                                        <td>

                                            <div class="action-group">

                        `;


                                /*
                                 * Only NEW patient gets Mark OLD.
                                 */

                                if (
                                    normalizedStatus ===
                                    "NEW"
                                ) {

                                    html += `

                                        <button
                                            type="button"
                                            class="action-btn old-btn"
                                            data-appointment-id="${escapeHtml(
                                                appointment.id || ""
                                            )}"
                                            data-patient-mobile="${escapeHtml(
                                                mobile
                                            )}"
                                            onclick="markPatientOld(this)"
                                        >

                                            Mark OLD

                                        </button>

                                    `;

                                }
                                else {

                                    html += `

                                        <span
                                            class="action-btn old-btn done"
                                        >
                                            OLD
                                        </span>

                                    `;

                                }


                                /*
                                 * Follow-up
                                 */

                                html += `

                                    <a
                                        href="/followups/${encodeURIComponent(
                                            hospitalId
                                        )}"
                                        class="action-btn follow-btn"
                                    >

                                        Follow-up

                                    </a>

                                `;


                                html += `

                                            </div>

                                        </td>

                                    </tr>

                                `;

                            }
                        );


                        html += `

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                    </div>

                `;

            }
        );


    container.innerHTML =
        html;

}


/* =========================================================
   MARK PATIENT OLD
========================================================= */

async function markPatientOld(button) {

    if (
        !button ||
        button.disabled
    ) {

        return;

    }


    const appointmentId =
        button.dataset.appointmentId ||
        "";


    const patientMobile =
        button.dataset.patientMobile ||
        "";


    if (
        !patientMobile
    ) {

        showToast(
            "Patient mobile number is missing.",
            "error"
        );

        return;

    }


    const confirmOld =
        window.confirm(
            "Are you sure you want to mark this patient as OLD?\n\nOnce changed, future appointments for this patient will automatically be treated as OLD."
        );


    if (!confirmOld) {

        return;

    }


    try {

        button.disabled = true;

        button.textContent =
            "Updating...";


        /*
         * Get Firebase user
         */

        const user =
            await getFirebaseUser();


        /*
         * Get fresh Firebase token
         */

        const token =
            await user.getIdToken(
                true
            );


        if (!token) {

            throw new Error(
                "Firebase authentication token missing."
            );

        }


        /*
         * Backend request
         */

        const response =
            await fetch(
                "/api/patient/status",
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            hospital_id:
                                hospitalId,

                            appointment_id:
                                appointmentId,

                            patient_key:
                                patientMobile,

                            status:
                                "OLD"

                        })

                }
            );


        let data = {};


        try {

            data =
                await response.json();

        }
        catch {

            data = {};

        }


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Unable to update patient status."
            );

        }


        /*
         * Normalize mobile
         */

        const targetMobile =
            normalizeMobile(
                patientMobile
            );


        /*
         * Update local data
         *
         * IMPORTANT:
         * Do NOT change charge here.
         *
         * Current appointment keeps
         * the historical amount.
         */

        allAppointments =
            allAppointments.map(
                appointment => {

                    const appointmentMobile =
                        normalizeMobile(
                            appointment.mobile
                        );


                    if (
                        appointmentMobile ===
                        targetMobile
                    ) {

                        appointment.patient_status =
                            "OLD";

                    }


                    return appointment;

                }
            );


        /*
         * Re-render page
         */

        renderAppointments();


        showToast(
            "Patient marked as OLD successfully.",
            "success"
        );

    }
    catch (error) {

        console.error(
            "Mark OLD Error:",
            error
        );


        showToast(
            error.message ||
            "Unable to update patient.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "Mark OLD";

    }

}


/* =========================================================
   MAKE FUNCTION GLOBAL
========================================================= */

window.markPatientOld =
    markPatientOld;


/* =========================================================
   SEARCH EVENT
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderAppointments
    );


/* =========================================================
   DOCTOR FILTER EVENT
========================================================= */

document
    .getElementById(
        "doctorFilter"
    )
    .addEventListener(
        "change",
        renderAppointments
    );


/* =========================================================
   SPECIFIC DATE EVENT
========================================================= */

document
    .getElementById(
        "specificDate"
    )
    .addEventListener(
        "change",
        renderAppointments
    );


/* =========================================================
   DATE FILTER BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".date-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".date-btn"
                        )
                        .forEach(
                            btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    activeDateFilter =
                        button.dataset.filter ||
                        "all";


                    renderAppointments();

                }
            );

        }
    );


/* =========================================================
   FIREBASE SESSION CHECK
========================================================= */

auth.onAuthStateChanged(
    user => {

        if (user) {

            console.log(
                "Firebase session active:",
                user.uid
            );

        }
        else {

            console.warn(
                "No Firebase user currently active."
            );

        }

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadAppointments();

    }
);
