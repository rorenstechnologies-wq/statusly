<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Visit History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        .search-box {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .search-row input:focus {
            border-color: #2563eb;
        }

        .search-row button {
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-row button:hover {
            background: #1d4ed8;
        }

        .patient-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .patient-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .patient-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .patient-mobile {
            color: #6b7280;
            font-size: 14px;
        }

        .visit-count {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-box {
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .summary-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 21px;
            font-weight: 700;
        }

        .visit-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .visit-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .visit-card {
            border: 1px solid #e5e7eb;
            border-radius: 13px;
            padding: 16px;
            background: white;
        }

        .visit-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .visit-number {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .visit-date {
            color: #6b7280;
            font-size: 14px;
        }

        .visit-type {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .new {
            color: #047857;
            background: #ecfdf5;
        }

        .old {
            color: #1d4ed8;
            background: #eff6ff;
        }

        .visit-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .detail {
            background: #f8fafc;
            padding: 11px;
            border-radius: 9px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
        }

        .amount {
            color: #047857;
        }

        .total {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-weight: 700;
            color: #166534;
        }

        .total-value {
            font-size: 24px;
            font-weight: 800;
            color: #15803d;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            border-radius: 16px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .search-row {
                flex-direction: column;
            }

            .search-row button {
                height: 45px;
            }

            .patient-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .visit-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .visit-top {
                flex-direction: column;
            }

            .total {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Complete Visit History</h1>
        <p>Patient history grouped using both name and mobile number</p>
    </div>

    <div class="search-box">
        <div class="search-row">
            <input
                type="text"
                id="searchInput"
                placeholder="Search patient by name or mobile number..."
            >

            <button onclick="searchPatient()">
                Search
            </button>
        </div>
    </div>

    <div id="historyContainer">
        <div class="loading">
            Loading visit history...
        </div>
    </div>

</div>


<script>

    /*
    ============================================================
    CONFIGURATION
    ============================================================
    */

    /*
       Change this URL to your existing Flask API.

       Example:
       /api/patient/visits

       Expected response:
       {
           "visits": [...]
       }

       OR directly:
       [...]
    */

    const VISITS_API_URL = "/api/patient/visits";


    /*
    ============================================================
    SAMPLE DATA
    ============================================================

    Remove this sample data after connecting your API.
    It is here so the page works immediately.
    */

    const SAMPLE_VISITS = [
        {
            id: "1",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-04",
            time: "Evening",
            amount: 0
        },

        {
            id: "2",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-04",
            time: "Evening",
            amount: 0
        },

        {
            id: "3",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-04",
            time: "Evening",
            amount: 0
        },

        {
            id: "4",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-04",
            time: "Evening",
            amount: 0
        },

        {
            id: "5",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-04",
            time: "Evening",
            amount: 500
        },

        {
            id: "6",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-03",
            time: "Evening",
            amount: 500
        },

        {
            id: "7",
            patient_name: "Rajvardhan",
            mobile: "9876543210",
            doctor_name: "dr.sahil",
            specialization: "General",
            date: "2026-10-03",
            time: "Evening",
            amount: 250
        }
    ];


    let allVisits = [];


    /*
    ============================================================
    NORMALIZE NAME
    ============================================================
    */

    function normalizeName(name) {

        if (!name) {
            return "";
        }

        return String(name)
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ");
    }


    /*
    ============================================================
    NORMALIZE MOBILE
    ============================================================
    */

    function normalizeMobile(mobile) {

        if (!mobile) {
            return "";
        }

        /*
        Keep only numbers.

        Example:
        +91 98765 43210
        becomes
        919876543210
        */

        let value = String(mobile).replace(/\D/g, "");

        /*
        Indian numbers:
        919876543210
        and
        9876543210

        should match.
        */

        if (value.length === 12 && value.startsWith("91")) {
            value = value.substring(2);
        }

        if (value.length > 10) {
            value = value.slice(-10);
        }

        return value;
    }


    /*
    ============================================================
    PATIENT MATCH KEY
    ============================================================

    IMPORTANT:

    Patient identity is based on:

        NAME + MOBILE

    NOT mobile only.

    NOT name only.
    */

    function getPatientKey(visit) {

        const name = normalizeName(
            visit.patient_name ||
            visit.name ||
            visit.patientName
        );

        const mobile = normalizeMobile(
            visit.mobile ||
            visit.phone ||
            visit.phone_number ||
            visit.patient_mobile ||
            visit.patientMobile
        );

        return `${name}|||${mobile}`;
    }


    /*
    ============================================================
    GET PATIENT NAME
    ============================================================
    */

    function getPatientName(visit) {

        return (
            visit.patient_name ||
            visit.name ||
            visit.patientName ||
            "Unknown Patient"
        );
    }


    /*
    ============================================================
    GET MOBILE
    ============================================================
    */

    function getPatientMobile(visit) {

        return (
            visit.mobile ||
            visit.phone ||
            visit.phone_number ||
            visit.patient_mobile ||
            visit.patientMobile ||
            "-"
        );
    }


    /*
    ============================================================
    GET DOCTOR
    ============================================================
    */

    function getDoctor(visit) {

        return (
            visit.doctor_name ||
            visit.doctor ||
            visit.doctorName ||
            "Unknown Doctor"
        );
    }


    /*
    ============================================================
    GET SPECIALIZATION
    ============================================================
    */

    function getSpecialization(visit) {

        return (
            visit.specialization ||
            visit.department ||
            visit.type ||
            "General"
        );
    }


    /*
    ============================================================
    GET DATE
    ============================================================
    */

    function getDate(visit) {

        return (
            visit.date ||
            visit.visit_date ||
            visit.appointment_date ||
            visit.created_at ||
            ""
        );
    }


    /*
    ============================================================
    GET TIME
    ============================================================
    */

    function getTime(visit) {

        return (
            visit.time ||
            visit.visit_time ||
            visit.appointment_time ||
            "Not specified"
        );
    }


    /*
    ============================================================
    GET AMOUNT
    ============================================================
    */

    function getAmount(visit) {

        const amount =
            visit.amount ??
            visit.fees ??
            visit.fee ??
            visit.consultation_fee ??
            visit.payment_amount ??
            0;

        const number = Number(amount);

        return Number.isFinite(number) ? number : 0;
    }


    /*
    ============================================================
    FORMAT DATE
    ============================================================
    */

    function formatDate(dateValue) {

        if (!dateValue) {
            return "-";
        }

        const date = new Date(dateValue);

        if (isNaN(date.getTime())) {
            return dateValue;
        }

        return date.toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });
    }


    /*
    ============================================================
    FORMAT MONEY
    ============================================================
    */

    function formatMoney(amount) {

        return Number(amount || 0).toLocaleString("en-IN", {
            maximumFractionDigits: 2
        });
    }


    /*
    ============================================================
    SORT VISITS
    ============================================================
    */

    function sortVisits(visits) {

        return [...visits].sort(function(a, b) {

            const dateA = new Date(
                getDate(a)
            ).getTime();

            const dateB = new Date(
                getDate(b)
            ).getTime();

            return dateB - dateA;
        });
    }


    /*
    ============================================================
    GROUP VISITS BY NAME + MOBILE
    ============================================================
    */

    function groupVisitsByPatient(visits) {

        const groups = {};

        visits.forEach(function(visit) {

            const key = getPatientKey(visit);

            if (!groups[key]) {
                groups[key] = {
                    key: key,
                    patient_name: getPatientName(visit),
                    mobile: getPatientMobile(visit),
                    visits: []
                };
            }

            groups[key].visits.push(visit);
        });

        return Object.values(groups);
    }


    /*
    ============================================================
    DETERMINE NEW / OLD
    ============================================================

    First visit of a patient = NEW

    All following visits = OLD

    This is calculated separately for each
    NAME + MOBILE combination.
    */

    function addVisitType(visits) {

        const sorted = sortVisits(visits);

        return sorted.map(function(visit, index) {

            return {
                ...visit,
                visit_number: index + 1,
                visit_type: index === 0 ? "NEW" : "OLD"
            };

        });
    }


    /*
    ============================================================
    RENDER
    ============================================================
    */

    function renderHistory(visits) {

        const container =
            document.getElementById("historyContainer");

        if (!visits || visits.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No visit history found</h3>
                    <p>Try another patient name or mobile number.</p>
                </div>
            `;

            return;
        }


        const groups =
            groupVisitsByPatient(visits);


        let html = "";


        groups.forEach(function(group) {

            const patientVisits =
                addVisitType(group.visits);


            const totalAmount =
                patientVisits.reduce(function(total, visit) {

                    return total + getAmount(visit);

                }, 0);


            html += `
                <div class="patient-card">

                    <div class="patient-header">

                        <div>
                            <div class="patient-name">
                                ${escapeHtml(group.patient_name)}
                            </div>

                            <div class="patient-mobile">
                                📱 ${escapeHtml(String(group.mobile))}
                            </div>
                        </div>

                        <div class="visit-count">
                            ${patientVisits.length}
                            ${patientVisits.length === 1 ? "Visit" : "Visits"}
                        </div>

                    </div>


                    <div class="summary">

                        <div class="summary-box">
                            <div class="summary-label">
                                Total Visits
                            </div>

                            <div class="summary-value">
                                ${patientVisits.length}
                            </div>
                        </div>


                        <div class="summary-box">
                            <div class="summary-label">
                                Total Amount Paid
                            </div>

                            <div class="summary-value">
                                ₹${formatMoney(totalAmount)}
                            </div>
                        </div>


                        <div class="summary-box">
                            <div class="summary-label">
                                Patient Match
                            </div>

                            <div class="summary-value"
                                 style="font-size:15px;">
                                Name + Mobile
                            </div>
                        </div>

                    </div>


                    <div class="visit-title">
                        Complete Visit History
                    </div>


                    <div class="visit-list">
            `;


            patientVisits.forEach(function(visit) {

                const typeClass =
                    visit.visit_type === "NEW"
                        ? "new"
                        : "old";


                const typeText =
                    visit.visit_type === "NEW"
                        ? "🆕 NEW"
                        : "🔵 OLD";


                html += `

                    <div class="visit-card">

                        <div class="visit-top">

                            <div>

                                <div class="visit-number">
                                    Visit ${visit.visit_number}
                                </div>

                                <div class="visit-date">
                                    ${formatDate(getDate(visit))}
                                </div>

                            </div>


                            <div class="visit-type ${typeClass}">
                                ${typeText}
                            </div>

                        </div>


                        <div class="visit-details">

                            <div class="detail">

                                <div class="detail-label">
                                    Doctor
                                </div>

                                <div class="detail-value">
                                    👨‍⚕️
                                    ${escapeHtml(getDoctor(visit))}
                                </div>

                            </div>


                            <div class="detail">

                                <div class="detail-label">
                                    Specialization
                                </div>

                                <div class="detail-value">
                                    ${escapeHtml(
                                        getSpecialization(visit)
                                    )}
                                </div>

                            </div>


                            <div class="detail">

                                <div class="detail-label">
                                    Time
                                </div>

                                <div class="detail-value">
                                    🕐
                                    ${escapeHtml(getTime(visit))}
                                </div>

                            </div>


                            <div class="detail">

                                <div class="detail-label">
                                    Amount
                                </div>

                                <div class="detail-value amount">
                                    ₹${formatMoney(
                                        getAmount(visit)
                                    )}
                                </div>

                            </div>

                        </div>

                    </div>

                `;

            });


            html += `

                    </div>


                    <div class="total">

                        <div class="total-label">
                            Total Amount Paid
                            <br>
                            <small>
                                Across ${patientVisits.length} visits
                            </small>
                        </div>

                        <div class="total-value">
                            ₹${formatMoney(totalAmount)}
                        </div>

                    </div>

                </div>
            `;

        });


        container.innerHTML = html;
    }


    /*
    ============================================================
    SEARCH
    ============================================================
    */

    function searchPatient() {

        const input =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        if (!input) {

            renderHistory(allVisits);

            return;
        }


        const digits =
            input.replace(/\D/g, "");


        const filtered =
            allVisits.filter(function(visit) {

                const name =
                    normalizeName(
                        getPatientName(visit)
                    );


                const mobile =
                    normalizeMobile(
                        getPatientMobile(visit)
                    );


                const nameMatch =
                    name.includes(input);


                const mobileMatch =
                    digits &&
                    mobile.includes(digits);


                return nameMatch || mobileMatch;

            });


        renderHistory(filtered);
    }


    /*
    ============================================================
    ENTER KEY SEARCH
    ============================================================
    */

    document
        .getElementById("searchInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                searchPatient();
            }

        });


    /*
    ============================================================
    LOAD API DATA
    ============================================================
    */

    async function loadVisits() {

        const container =
            document.getElementById("historyContainer");


        try {

            /*
            If you have your Flask API ready,
            this fetches the real Firebase data.
            */

            const response =
                await fetch(VISITS_API_URL);


            if (!response.ok) {
                throw new Error(
                    "API returned " + response.status
                );
            }


            const data =
                await response.json();


            /*
            Support both:

            {
                "visits": [...]
            }

            and

            [...]
            */

            if (Array.isArray(data)) {

                allVisits = data;

            } else if (Array.isArray(data.visits)) {

                allVisits = data.visits;

            } else if (Array.isArray(data.data)) {

                allVisits = data.data;

            } else {

                throw new Error(
                    "Invalid API response"
                );

            }


            renderHistory(allVisits);

        }

        catch (error) {

            console.error(
                "Unable to load API data:",
                error
            );


            /*
            TEMPORARY FALLBACK

            This allows the UI to work even if
            the Flask endpoint is not connected yet.

            Remove this section when your API is ready.
            */

            allVisits = SAMPLE_VISITS;

            renderHistory(allVisits);

        }

    }


    /*
    ============================================================
    HTML ESCAPE
    ============================================================
    */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /*
    ============================================================
    START
    ============================================================
    */

    loadVisits();

</script>

</body>
</html>
