<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
            color: #263238;
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(135deg, #00695c, #00897b);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .header-left h1 {
            font-size: 25px;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.9;
        }

        .total-badge {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 9px 15px;
            border-radius: 25px;
            font-size: 14px;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 96%;
            max-width: 1500px;
            margin: 25px auto;
        }

        /* ================= FILTERS ================= */

        .filter-box {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: #546e7a;
        }

        select,
        input {
            height: 42px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        select:focus,
        input:focus {
            border-color: #00897b;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
        }

        .date-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .date-btn {
            height: 38px;
            padding: 0 14px;
            border: none;
            border-radius: 20px;
            background: #eceff1;
            color: #455a64;
            cursor: pointer;
            font-weight: 600;
        }

        .date-btn.active {
            background: #00897b;
            color: white;
        }

        /* ================= SUMMARY ================= */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: white;
            padding: 18px;
            border-radius: 13px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .summary-card .label {
            color: #78909c;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-card .value {
            color: #00695c;
            font-size: 26px;
            font-weight: 700;
        }

        /* ================= SECTION ================= */

        .section {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 22px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 700;
            color: #00695c;
        }

        .section-count {
            background: #e0f2f1;
            color: #00695c;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .appointments-table {
            width: 100%;
            min-width: 1150px;
            border-collapse: collapse;
        }

        .appointments-table th {
            background: #f1f8f7;
            color: #455a64;
            padding: 13px 10px;
            text-align: left;
            font-size: 12px;
            white-space: nowrap;
            border-bottom: 2px solid #e0e0e0;
        }

        .appointments-table td {
            padding: 13px 10px;
            border-bottom: 1px solid #eeeeee;
            font-size: 13px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .appointments-table tbody tr:hover {
            background: #f8fbfb;
        }

        .patient-name {
            font-weight: 700;
            color: #263238;
        }

        .mobile-number {
            color: #546e7a;
        }

        .amount {
            font-weight: 700;
            color: #00695c;
            font-size: 14px;
        }

        /* ================= TYPE ================= */

        .patient-type {
            display: inline-block;
            min-width: 55px;
            text-align: center;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .new-type {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .old-type {
            background: #e3f2fd;
            color: #1565c0;
        }

        /* ================= STATUS ================= */

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-pending {
            background: #fff8e1;
            color: #f57f17;
        }

        .status-completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-cancelled {
            background: #ffebee;
            color: #c62828;
        }

        /* ================= BUTTONS ================= */

        .action-box {
            display: flex;
            gap: 6px;
        }

        .btn {
            border: none;
            border-radius: 7px;
            padding: 7px 11px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-old {
            background: #e3f2fd;
            color: #1565c0;
        }

        .btn-old:hover {
            background: #bbdefb;
        }

        .btn-follow {
            background: #e0f2f1;
            color: #00695c;
        }

        .btn-follow:hover {
            background: #b2dfdb;
        }

        /* ================= DOCTOR ================= */

        .doctor-title {
            margin: 20px 0 10px;
            padding: 10px 13px;
            background: #f5f7f8;
            border-left: 4px solid #00897b;
            border-radius: 7px;
            color: #37474f;
            font-weight: 700;
        }

        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 35px 15px;
            color: #90a4ae;
        }

        .empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            padding: 30px;
            color: #607d8b;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 900px) {

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                padding: 15px;
            }

            .header-left h1 {
                font-size: 20px;
            }
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin-top: 15px;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .summary-card {
                padding: 14px;
            }

            .summary-card .value {
                font-size: 21px;
            }

            .header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .total-badge {
                align-self: flex-start;
            }
        }
    </style>
</head>
