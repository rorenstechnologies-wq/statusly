<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Appointments</title>

<style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {
        --primary: #0f766e;
        --primary-dark: #115e59;
        --primary-light: #ecfdf5;

        --blue: #2563eb;
        --blue-light: #eff6ff;

        --text: #172033;
        --text-soft: #475569;
        --muted: #64748b;
        --light: #94a3b8;

        --border: #e2e8f0;
        --border-light: #edf2f7;

        --bg: #f7f9fc;
        --white: #ffffff;

        --green: #15803d;
        --green-bg: #f0fdf4;

        --orange: #c2410c;
        --orange-bg: #fff7ed;

        --shadow-sm:
            0 2px 8px rgba(15, 23, 42, 0.04);

        --shadow:
            0 5px 20px rgba(15, 23, 42, 0.06);

        --shadow-lg:
            0 20px 60px rgba(15, 23, 42, 0.16);

        --radius: 14px;
    }


    * {
        box-sizing: border-box;
    }


    html {
        scroll-behavior: smooth;
    }


    body {
        margin: 0;

        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        background: var(--bg);

        color: var(--text);

        font-size: 13px;

        -webkit-font-smoothing: antialiased;
    }


    button,
    input,
    select {
        font-family: inherit;
    }


    button {
        outline: none;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {

        position: relative;

        background: #ffffff;

        color: var(--text);

        padding: 24px 32px;

        border-bottom:
            1px solid var(--border);

        display: flex;

        align-items: center;

        justify-content: space-between;
    }


    .header::before {

        content: "";

        position: absolute;

        left: 0;
        top: 0;
        bottom: 0;

        width: 4px;

        background:
            linear-gradient(
                180deg,
                #0f766e,
                #0e7490
            );
    }


    .header h1 {

        margin: 0;

        font-size: 22px;

        line-height: 1.3;

        font-weight: 750;

        letter-spacing: -0.4px;

        color: #0f172a;
    }


    .header p {

        margin: 6px 0 0;

        font-size: 12px;

        color: var(--muted);

        font-weight: 450;
    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .container {

        width: 100%;

        max-width: 1550px;

        margin: 0 auto;

        padding: 24px 28px 40px;
    }


    /* =========================================================
       FILTER CARD
    ========================================================= */

    .filter-card {

        background: var(--white);

        border:
            1px solid var(--border);

        border-radius: var(--radius);

        padding: 18px;

        margin-bottom: 20px;

        box-shadow: var(--shadow-sm);
    }


    .filters {

        display: grid;

        grid-template-columns:
            minmax(180px, 1fr)
            minmax(250px, 1.5fr)
            minmax(180px, 1fr);

        gap: 14px;
    }


    .filter-group label {

        display: block;

        margin-bottom: 7px;

        font-size: 10px;

        font-weight: 700;

        color: #475569;

        letter-spacing: .3px;

        text-transform: uppercase;
    }


    .filter-group select,
    .filter-group input {

        width: 100%;

        height: 42px;

        padding: 0 13px;

        background: #ffffff;

        border:
            1px solid #dbe3ea;

        border-radius: 9px;

        color: #1e293b;

        font-size: 12px;

        outline: none;

        transition:
            border-color .2s ease,
            box-shadow .2s ease;
    }


    .filter-group select:hover,
    .filter-group input:hover {

        border-color: #cbd5e1;
    }


    .filter-group select:focus,
    .filter-group input:focus {

        border-color: var(--primary);

        box-shadow:
            0 0 0 3px
            rgba(15, 118, 110, .08);
    }


    /* =========================================================
       SUMMARY CARDS
    ========================================================= */

    .summary-grid {

        display: grid;

        grid-template-columns:
            repeat(4, minmax(0, 1fr));

        gap: 14px;

        margin-bottom: 22px;
    }


    .summary-card {

        position: relative;

        background: #ffffff;

        border:
            1px solid var(--border);

        border-radius: 13px;

        padding: 17px;

        display: flex;

        align-items: center;

        gap: 13px;

        box-shadow: var(--shadow-sm);

        transition:
            transform .2s ease,
            box-shadow .2s ease;
    }


    .summary-card:hover {

        transform: translateY(-2px);

        box-shadow: var(--shadow);
    }


    .summary-icon {

        width: 44px;

        height: 44px;

        flex-shrink: 0;

        border-radius: 11px;

        background: var(--primary-light);

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 19px;
    }


    .summary-card span {

        display: block;

        font-size: 9px;

        line-height: 1;

        color: var(--muted);

        font-weight: 700;

        letter-spacing: .4px;

        text-transform: uppercase;
    }


    .summary-card strong {

        display: block;

        margin-top: 7px;

        font-size: 22px;

        line-height: 1;

        color: #0f172a;

        font-weight: 750;
    }


    /* =========================================================
       DOCTOR CARD
    ========================================================= */

    .doctor-card {

        background: #ffffff;

        border:
            1px solid var(--border);

        border-radius: 15px;

        margin-bottom: 20px;

        overflow: hidden;

        box-shadow: var(--shadow-sm);
    }


    .doctor-header {

        min-height: 72px;

        padding: 14px 18px;

        background: #ffffff;

        border-bottom:
            1px solid var(--border);

        display: flex;

        align-items: center;

        justify-content: space-between;
    }


    .doctor-title {

        display: flex;

        align-items: center;

        gap: 11px;
    }


    .doctor-avatar {

        width: 42px;

        height: 42px;

        flex-shrink: 0;

        border-radius: 11px;

        background: #f0fdfa;

        border:
            1px solid #ccfbf1;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 20px;
    }


    .doctor-title h2 {

        margin: 0;

        font-size: 14px;

        line-height: 1.3;

        font-weight: 750;

        color: #172033;
    }


    .doctor-title p {

        margin: 3px 0 0;

        color: var(--muted);

        font-size: 10px;
    }


    .doctor-count {

        padding: 6px 10px;

        border-radius: 999px;

        background: #f1f5f9;

        color: #475569;

        font-size: 9px;

        font-weight: 700;

        white-space: nowrap;
    }


    /* =========================================================
       SECTIONS
    ========================================================= */

    .section {

        padding: 17px 18px;
    }


    .section + .section {

        padding-top: 2px;
    }


    .section-title {

        min-height: 25px;

        display: flex;

        align-items: center;

        gap: 8px;

        margin-bottom: 9px;

        color: #64748b;

        font-size: 10px;

        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: .35px;
    }


    .section-title span {

        padding: 5px 8px;

        border-radius: 6px;

        background: #f1f5f9;

        color: #475569;

        font-size: 8px;

        font-weight: 800;

        letter-spacing: .2px;
    }


    /* =========================================================
       TABLE
    ========================================================= */

    .table-wrapper {

        width: 100%;

        overflow-x: auto;

        border:
            1px solid var(--border);

        border-radius: 10px;

        background: #ffffff;
    }


    table {

        width: 100%;

        min-width: 1350px;

        border-collapse: separate;

        border-spacing: 0;
    }


    th {

        height: 40px;

        padding: 0 11px;

        background: #f8fafc;

        color: #64748b;

        font-size: 8px;

        font-weight: 750;

        letter-spacing: .35px;

        text-transform: uppercase;

        text-align: left;

        white-space: nowrap;

        border-bottom:
            1px solid var(--border);
    }


    th:first-child {

        padding-left: 14px;
    }


    td {

        height: 60px;

        padding: 9px 11px;

        color: #334155;

        font-size: 10px;

        vertical-align: middle;

        border-bottom:
            1px solid var(--border-light);
    }


    td:first-child {

        padding-left: 14px;
    }


    tbody tr {

        transition:
            background .15s ease;
    }


    tbody tr:hover {

        background: #fbfefd;
    }


    tbody tr:last-child td {

        border-bottom: none;
    }


    /* =========================================================
       PATIENT CELL
    ========================================================= */

    .patient-cell {

        display: flex;

        align-items: center;

        gap: 10px;

        min-width: 175px;
    }


    .patient-avatar {

        width: 34px;

        height: 34px;

        flex-shrink: 0;

        border-radius: 9px;

        background: #f1f5f9;

        border:
            1px solid #e2e8f0;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 15px;
    }


    .patient-name {

        color: #1e293b;

        font-size: 10px;

        line-height: 1.3;

        font-weight: 700;

        max-width: 145px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
    }


    .patient-id {

        display: block;

        margin-top: 3px;

        color: #94a3b8;

        font-size: 8px;

        font-weight: 500;
    }


    /* =========================================================
       TYPE BADGES
    ========================================================= */

    .type-badge {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        min-width: 52px;

        padding: 5px 8px;

        border-radius: 999px;

        font-size: 8px;

        line-height: 1;

        font-weight: 750;

        letter-spacing: .1px;
    }


    .type-new {

        background: #eff6ff;

        color: #2563eb;

        border:
            1px solid #dbeafe;
    }


    .type-old {

        background: #f0fdf4;

        color: #15803d;

        border:
            1px solid #dcfce7;
    }


    /* =========================================================
       VISIT BADGE
    ========================================================= */

    .visit-badge {

        display: inline-flex;

        align-items: center;

        padding: 5px 8px;

        background: #f8fafc;

        border:
            1px solid #e2e8f0;

        border-radius: 6px;

        color: #475569;

        font-size: 8px;

        font-weight: 700;

        white-space: nowrap;
    }


    /* =========================================================
       AMOUNT
    ========================================================= */

    .amount-box {

        display: flex;

        align-items: center;

        gap: 5px;
    }


    .amount-input {

        width: 72px;

        height: 30px;

        padding: 0 8px;

        border:
            1px solid #dbe3ea;

        border-radius: 7px;

        background: #ffffff;

        color: #172033;

        font-size: 9px;

        font-weight: 600;

        outline: none;

        transition: .2s ease;
    }


    .amount-input:focus {

        border-color: var(--primary);

        box-shadow:
            0 0 0 2px
            rgba(15,118,110,.08);
    }


    .save-amount {

        height: 30px;

        border: none;

        padding: 0 8px;

        border-radius: 7px;

        background: var(--primary);

        color: #ffffff;

        font-size: 8px;

        font-weight: 700;

        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }


    .save-amount:hover {

        background: var(--primary-dark);

        transform: translateY(-1px);
    }


    /* =========================================================
       MAKE OLD
    ========================================================= */

    .old-btn {

        height: 31px;

        border:
            1px solid #fed7aa;

        background: var(--orange-bg);

        color: var(--orange);

        padding: 0 10px;

        border-radius: 7px;

        font-size: 8px;

        font-weight: 750;

        cursor: pointer;

        white-space: nowrap;

        transition:
            background .2s ease,
            border-color .2s ease,
            transform .15s ease;
    }


    .old-btn:hover {

        background: #ffedd5;

        border-color: #fdba74;

        transform: translateY(-1px);
    }


    .already-old {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        height: 29px;

        padding: 0 9px;

        border-radius: 999px;

        background: var(--green-bg);

        border:
            1px solid #dcfce7;

        color: var(--green);

        font-size: 8px;

        font-weight: 750;

        white-space: nowrap;
    }


    /* =========================================================
       ACTION BUTTONS
    ========================================================= */

    .action-buttons {

        display: flex;

        align-items: center;

        gap: 6px;

        white-space: nowrap;
    }


    .details-btn,
    .follow-btn {

        height: 31px;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        padding: 0 10px;

        border-radius: 7px;

        font-size: 8px;

        font-weight: 750;

        text-decoration: none;

        white-space: nowrap;

        cursor: pointer;

        transition:
            background .2s ease,
            transform .15s ease;
    }


    .details-btn {

        border:
            1px solid #dbeafe;

        background: #eff6ff;

        color: #2563eb;
    }


    .details-btn:hover {

        background: #dbeafe;

        transform: translateY(-1px);
    }


    .follow-btn {

        border:
            1px solid #d1fae5;

        background: #ecfdf5;

        color: #047857;
    }


    .follow-btn:hover {

        background: #d1fae5;

        transform: translateY(-1px);
    }


    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty {

        padding: 45px 20px;

        text-align: center;

        color: #94a3b8;

        font-size: 11px;

        line-height: 1.8;
    }


    /* =========================================================
       MODAL BASE
    ========================================================= */

    .modal {

        display: none;

        position: fixed;

        inset: 0;

        z-index: 9999;

        padding: 24px;

        background:
            rgba(15, 23, 42, .55);

        backdrop-filter:
            blur(4px);

        overflow-y: auto;

        align-items: center;

        justify-content: center;
    }


    .modal.show {

        display: flex;
    }


    /* =========================================================
       DETAILS MODAL
    ========================================================= */

    .details-modal-content {

        width: 100%;

        max-width: 1000px;

        max-height: 92vh;

        background: #f8fafc;

        border:
            1px solid rgba(255,255,255,.7);

        border-radius: 18px;

        overflow: hidden;

        box-shadow: var(--shadow-lg);

        animation:
            modalIn .2s ease;
    }


    @keyframes modalIn {

        from {

            opacity: 0;

            transform:
                translateY(12px)
                scale(.98);
        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }
    }


    .modal-header {

        height: 62px;

        padding: 0 20px;

        background: #ffffff;

        border-bottom:
            1px solid var(--border);

        display: flex;

        align-items: center;

        justify-content: space-between;
    }


    .modal-header h2 {

        margin: 0;

        color: #172033;

        font-size: 15px;

        font-weight: 750;
    }


    .close-btn {

        width: 32px;

        height: 32px;

        border:
            1px solid #e2e8f0;

        border-radius: 8px;

        background: #f8fafc;

        color: #64748b;

        cursor: pointer;

        font-size: 19px;

        line-height: 1;

        transition: .2s ease;
    }


    .close-btn:hover {

        background: #f1f5f9;

        color: #172033;
    }


    .details-body {

        padding: 20px;

        max-height:
            calc(92vh - 62px);

        overflow-y: auto;
    }


    /* =========================================================
       PATIENT PROFILE HEADER
    ========================================================= */

    .patient-profile-header {

        padding: 18px 20px;

        background: #ffffff;

        border:
            1px solid var(--border);

        border-radius: 13px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

        margin-bottom: 15px;
    }


    .patient-profile-left {

        display: flex;

        align-items: center;

        gap: 13px;
    }


    .large-patient-avatar {

        width: 58px;

        height: 58px;

        flex-shrink: 0;

        border-radius: 14px;

        background: #f0fdfa;

        border:
            1px solid #ccfbf1;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 26px;
    }


    .patient-profile-left h2 {

        margin: 0;

        color: #172033;

        font-size: 18px;

        font-weight: 750;
    }


    .patient-profile-left p {

        margin: 4px 0 0;

        color: #94a3b8;

        font-size: 8px;
    }


    .patient-phone {

        margin-top: 5px;

        color: #475569;

        font-size: 10px;

        font-weight: 650;
    }


    .detail-old,
    .detail-new {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        padding: 7px 11px;

        border-radius: 999px;

        font-size: 8px;

        font-weight: 750;

        white-space: nowrap;
    }


    .detail-old {

        background: var(--green-bg);

        border:
            1px solid #dcfce7;

        color: var(--green);
    }


    .detail-new {

        background: #eff6ff;

        border:
            1px solid #dbeafe;

        color: #2563eb;
    }


    /* =========================================================
       DETAIL SECTIONS
    ========================================================= */

    .detail-section {

        background: #ffffff;

        border:
            1px solid var(--border);

        border-radius: 13px;

        padding: 17px;

        margin-bottom: 15px;
    }


    .detail-section-title {

        display: flex;

        align-items: center;

        gap: 8px;

        margin-bottom: 14px;

        color: #334155;

        font-size: 11px;

        font-weight: 750;
    }


    .detail-section-title > span:first-child {

        width: 28px;

        height: 28px;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #f0fdfa;

        border:
            1px solid #ccfbf1;

        border-radius: 8px;

        font-size: 13px;
    }


    .visit-count {

        margin-left: auto;

        padding: 5px 8px;

        background: #f8fafc;

        border:
            1px solid #e2e8f0;

        border-radius: 999px;

        color: #64748b;

        font-size: 8px;
    }


    /* =========================================================
       PATIENT INFORMATION
    ========================================================= */

    .patient-info-grid {

        display: grid;

        grid-template-columns:
            repeat(3, minmax(0,1fr));

        gap: 10px;
    }


    .info-item {

        min-height: 61px;

        padding: 11px;

        background: #f8fafc;

        border:
            1px solid #edf2f7;

        border-radius: 9px;
    }


    .info-item.full {

        grid-column: 1 / -1;
    }


    .info-item span {

        display: block;

        margin-bottom: 5px;

        color: #94a3b8;

        font-size: 7px;

        font-weight: 750;

        letter-spacing: .35px;

        text-transform: uppercase;
    }


    .info-item strong {

        color: #334155;

        font-size: 10px;

        line-height: 1.4;

        font-weight: 650;
    }


    /* =========================================================
       CURRENT APPOINTMENT
    ========================================================= */

    .current-appointment-card {

        padding: 15px;

        background: #f8fafc;

        border:
            1px solid #e2e8f0;

        border-radius: 11px;
    }


    .doctor-profile {

        display: flex;

        align-items: center;

        gap: 10px;

        padding-bottom: 13px;

        margin-bottom: 13px;

        border-bottom:
            1px solid #e2e8f0;
    }


    .small-doctor-avatar {

        width: 42px;

        height: 42px;

        border-radius: 10px;

        background: #ffffff;

        border:
            1px solid #e2e8f0;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 19px;
    }


    .doctor-profile strong {

        display: block;

        color: #1e293b;

        font-size: 11px;

        font-weight: 750;
    }


    .doctor-profile span {

        display: block;

        margin-top: 3px;

        color: #64748b;

        font-size: 8px;
    }


    .appointment-info {

        display: grid;

        grid-template-columns:
            repeat(4, minmax(0,1fr));

        gap: 9px;
    }


    .appointment-info div {

        padding: 10px;

        background: #ffffff;

        border:
            1px solid #e2e8f0;

        border-radius: 8px;
    }


    .appointment-info span {

        display: block;

        margin-bottom: 5px;

        color: #94a3b8;

        font-size: 7px;

        font-weight: 750;

        text-transform: uppercase;
    }


    .appointment-info strong {

        color: #334155;

        font-size: 9px;

        font-weight: 700;
    }


    .appointment-info .current-amount {

        color: var(--primary);

        font-size: 11px;
    }


    /* =========================================================
       VISIT HISTORY
    ========================================================= */

    .visit-history {

        overflow: hidden;

        border:
            1px solid var(--border);

        border-radius: 9px;
    }


    .history-heading,
    .visit-history-row {

        display: grid;

        grid-template-columns:
            1.1fr
            1.5fr
            .9fr
            .8fr
            .7fr;

        gap: 10px;

        align-items: center;
    }


    .history-heading {

        min-height: 38px;

        padding: 0 12px;

        background: #f8fafc;

        border-bottom:
            1px solid var(--border);

        color: #94a3b8;

        font-size: 7px;

        font-weight: 750;

        letter-spacing: .3px;

        text-transform: uppercase;
    }


    .visit-history-row {

        min-height: 59px;

        padding: 8px 12px;

        background: #ffffff;

        border-bottom:
            1px solid var(--border-light);
    }


    .visit-history-row:last-child {

<script type="module">

}

/* =====================================================

===================================================== */

const firebaseApp =
    getApps().length
        ? getApp()
        : initializeApp(
            firebaseConfig
        );


const auth =
    getAuth(
        firebaseApp
    );


/* =====================================================
   AUTH READY
===================================================== */

const authReady =
    new Promise(
        (resolve) => {

            const unsubscribe =
                onAuthStateChanged(
                    auth,
                    (user) => {

                        unsubscribe();

                        resolve(user);

                    }
                );

        }
    );


/* =====================================================
   TOKEN
===================================================== */

async function getStatuslyToken() {

    const user =
        await authReady;


    if (!user) {

        throw new Error(
            "Login session not found. Please login again."
        );

    }


    return await user.getIdToken(
        true
    );

}


/* =====================================================
   AUTH FETCH
===================================================== */

async function statuslyFetch(
    url,
    options = {}
) {

    const token =
        await getStatuslyToken();


    const headers =
        new Headers(
            options.headers || {}
        );


    headers.set(
        "Authorization",
        "Bearer " + token
    );


    if (
        options.body &&
        !headers.has(
            "Content-Type"
        )
    ) {

        headers.set(
            "Content-Type",
            "application/json"
        );

    }


    return fetch(
        url,
        {
            ...options,
            headers
        }
    );

}


/* =====================================================
   FLASK DATA
   IMPORTANT:
   ROUTE SENDS patients=patients
===================================================== */

const APPOINTMENTS =
    {{ patients | default([]) | tojson | safe }};


const UID =
    "{{ uid }}";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   NORMALIZE MOBILE
===================================================== */

function normalizeMobile(
    mobile
) {

    let digits =
        String(
            mobile || ""
        )
        .replace(
            /\D/g,
            ""
        );


    if (
        digits.length === 12 &&
        digits.startsWith("91")
    ) {

        digits =
            digits.slice(-10);

    }


    return digits;

}


/* =====================================================
   NORMALIZE DATE
===================================================== */

function normalizeDate(
    date
) {

    if (!date) {

        return "";

    }


    const value =
        String(date)
        .trim();


    if (
        /^\d{4}-\d{2}-\d{2}$/
            .test(value)
    ) {

        return value;

    }


    const parts =
        value.split(
            /[-/]/
        );


    if (
        parts.length === 3
    ) {

        if (
            parts[0].length === 4
        ) {

            return [

                parts[0],

                parts[1].padStart(
                    2,
                    "0"
                ),

                parts[2].padStart(
                    2,
                    "0"
                )

            ].join("-");

        }


        return [

            parts[2],

            parts[1].padStart(
                2,
                "0"
            ),

            parts[0].padStart(
                2,
                "0"
            )

        ].join("-");

    }


    return value;

}


/* =====================================================
   TODAY
===================================================== */

function todayISO() {

    const now =
        new Date();


    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        ),

        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        )

    ].join("-");

}


/* =====================================================
   MONEY
===================================================== */

function amount(
    value
) {

    const n =
        Number(
            value || 0
        );


    return Number.isFinite(n)
        ? n
        : 0;

}


function money(
    value
) {

    return "₹" +
        amount(
            value
        ).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    date
) {

    const normalized =
        normalizeDate(
            date
        );


    if (!normalized) {

        return "-";

    }


    const d =
        new Date(
            normalized +
            "T00:00:00"
        );


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return escapeHtml(
            date
        );

    }


    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   CATEGORY
===================================================== */

function getCategory(
    p
) {

    const date =
        normalizeDate(
            p.appointment_date
        );


    const today =
        todayISO();


    if (
        date === today
    ) {

        return "today";

    }


    if (
        date > today
    ) {

        return "upcoming";

    }


    return "past";

}


/* =====================================================
   PATIENT TYPE
===================================================== */

function getPatientType(
    p
) {

    const visit =
        Number(
            p.visit_number || 1
        );


    /*
       IMPORTANT:
       Backend should save current status.
       Visit 1 is allowed to become OLD now.
    */

    const status =
        String(
            p.patient_status ||
            "NEW"
        )
        .toUpperCase()
        .trim();


    return status === "OLD"
        ? "OLD"
        : "NEW";

}


/* =====================================================
   DOCTORS
===================================================== */

function populateDoctors() {

    const select =
        document.getElementById(
            "doctorFilter"
        );


    const doctors =
        [
            ...new Set(

                APPOINTMENTS.map(
                    p =>
                        p.doctor_name ||
                        "Unknown Doctor"
                )

            )
        ]
        .sort();


    doctors.forEach(
        doctor => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                doctor;


            option.textContent =
                doctor;


            select.appendChild(
                option
            );

        }
    );


    document.getElementById(
        "totalDoctors"
    ).textContent =
        doctors.length;

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(
    list
) {

    document.getElementById(
        "totalPatients"
    ).textContent =
        list.length;


    document.getElementById(
        "todayCount"
    ).textContent =

        list.filter(
            p =>
                getCategory(p) ===
                "today"
        ).length;


    document.getElementById(
        "upcomingCount"
    ).textContent =

        list.filter(
            p =>
                getCategory(p) ===
                "upcoming"
        ).length;

}


/* =====================================================
   CREATE ROW
===================================================== */

function createRow(

                        ""
                    )
                    .toLowerCase();


                const mobile =
                    String(
                        p.mobile ||
                        ""
                    )
                    .toLowerCase();


                if (
                    doctor &&
                    doctorName !== doctor
                ) {

                    return false;

                }


                if (
                    search &&
                    !name.includes(
                        search
                    ) &&
                    !mobile.includes(
                        search
                    )
                ) {

                    return false;

                }


                if (
                    date &&
                    normalizeDate(
                        p.appointment_date
                    ) !== date
                ) {

                    return false;

                }


                return true;

            }
        );


    updateSummary(
        filtered
    );


    const container =
        document.getElementById(
            "doctorCards"
        );


    container.innerHTML = "";


    if (
        !filtered.length
    ) {

        container.innerHTML = `

            <div class="doctor-card">

                <div class="empty">

                    👥

                    <br><br>

                    No appointments found.

                </div>

            </div>

        `;

        return;

    }


    const grouped = {};


    filtered.forEach(
        p => {

            const doctorName =
                p.doctor_name ||
                "Unknown Doctor";


            if (
                !grouped[doctorName]
            ) {

                grouped[doctorName] = [];

            }


            grouped[doctorName].push(
                p
            );

        }
    );


    Object.entries(
        grouped
    ).forEach(
        ([doctorName, patients]) => {


            patients.sort(
                (a,b) => {

                    const dateA =
                        normalizeDate(
                            a.appointment_date
                        ) +
                        "T" +
                        (
                            a.appointment_time ||
                            "00:00"
                        );


                    const dateB =
                        normalizeDate(
                            b.appointment_date
                        ) +
                        "T" +
                        (
                            b.appointment_time ||
                            "00:00"
                        );


                    return (
                        new Date(dateB) -
                        new Date(dateA)
                    );

                }
            );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "doctor-card";


            card.innerHTML = `

                <div class="doctor-header">


                    <div class="doctor-title">


                        <div class="doctor-avatar">
                            👨‍⚕️
                        </div>


                        <div>

                            <h2>

                                ${escapeHtml(
                                    doctorName
                                )}

                            </h2>


                            <p>
                                Doctor Appointments
                            </p>

                        </div>


                    </div>


                    <div class="doctor-count">

                        ${patients.length}

                        Patients

                    </div>


                </div>

            `;


            const categories = [

                [
                    "today",
                    "📅 TODAY"
                ],

                [
                    "upcoming",
                    "🔔 UPCOMING"
                ],

                [
                    "past",
                    "📁 PAST"
                ]

            ];


            let number = 1;


            categories.forEach(
                ([category,title]) => {


                    const rows =
                        patients.filter(
                            p =>
                                getCategory(p) ===
                                category
                        );


                    if (
                        !rows.length
                    ) {

                        return;

                    }


                    const section =
                        document.createElement(
                            "div"
                        );


                    section.className =
                        "section";


                    section.innerHTML = `

                        <div class="section-title">

                            <span>

                                ${title}

                            </span>

                            ${rows.length}

                            Appointment${
                                rows.length === 1
                                    ? ""
                                    : "s"
                            }

                        </div>


                        <div class="table-wrapper">

                            <table>

                                <thead>

                                    <tr>

                                        <th>
                                            No
                                        </th>

                                        <th>
                                            Patient
                                        </th>

                                        <th>
                                            Gender
                                        </th>

                                        <th>
                                            Age
                                        </th>

                                        <th>
                                            Mobile
                                        </th>

                                        <th>
                                            Date / Time
                                        </th>

                                        <th>
                                            Visit
                                        </th>

                                        <th>
                                            Type
                                        </th>

                                        <th>
                                            Amount
                                        </th>

                                        <th>
                                            Make OLD
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${rows.map(
                                        p =>
                                            createRow(
                                                p,
                                                number++
                                            )
                                    ).join("")}

                                </tbody>

                            </table>

                        </div>

                    `;


                    card.appendChild(
                        section
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );

}

                        a.appointment_date

                                current.patient_name ||

   CLOSE DETAILS

/* =====================================================
   MAKE OLD
===================================================== */

let selectedMobile = "";

let selectedPatientName = "";


window.openOldModal =
function(
    mobile,
    patientName
) {


    selectedMobile =
        normalizeMobile(
            mobile
        );


    selectedPatientName =
        patientName ||
        "Patient";


    if (!selectedMobile) {

        alert(
            "Patient mobile number not found."
        );

        return;

    }


    /*
       EXACT MESSAGE
    */

    document.getElementById(
        "oldMessage"
    ).innerHTML = `

        Are you sure you want to make

        patient

        <strong
            style="
                color:#172033;
                font-size:12px;
            "
        >

            ${escapeHtml(
                selectedMobile
            )}

        </strong>

        OLD?

    `;


    document.getElementById(
        "oldModal"
    ).classList.add(
        "show"
    );

};


/* =====================================================
   CLOSE OLD MODAL
===================================================== */

window.closeOldModal =
function() {


    selectedMobile = "";

    selectedPatientName = "";


    document.getElementById(
        "oldModal"
    ).classList.remove(
        "show"
    );

};


/* =====================================================
   CONFIRM MAKE OLD
===================================================== */

window.confirmMakeOld =
async function() {


    if (!selectedMobile) {

        return;

    }


    const button =
        document.getElementById(
            "confirmOldButton"
        );


    const patientName =
        selectedPatientName ||
        "Patient";


    try {


        button.disabled =
            true;


        button.textContent =
            "Updating...";


        const response =
            await statuslyFetch(
                "/api/doctor/make-patient-old",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            mobile:
                                selectedMobile

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.error ||
                "Unable to make patient OLD."

            );

        }


        closeOldModal();


        alert(
            `${patientName} is now OLD.`
        );


        window.location.reload();


    }
    catch(error) {


        console.error(
            "MAKE OLD ERROR:",
            error
        );


        alert(

            error.message ||
            "Something went wrong while updating patient."

        );


        button.disabled =
            false;


        button.textContent =
            "Yes, Make OLD";

    }

};


/* =====================================================
   SAVE AMOUNT
===================================================== */

window.saveAmount =
async function(
    appointmentId
) {


    const input =
        document.getElementById(
            "amount-" +
            appointmentId
        );


    if (!input) {

        alert(
            "Amount field not found."
        );

        return;

    }


    const amountValue =
        Number(
            input.value
        );


    if (
        !Number.isFinite(
            amountValue
        ) ||
        amountValue < 0
    ) {

        alert(
            "Please enter a valid amount."
        );

        return;

    }


    try {


        const response =
            await statuslyFetch(

                "/api/appointment/" +
                encodeURIComponent(
                    appointmentId
                ) +
                "/amount",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            amount:
                                amountValue

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.error ||
                "Unable to save amount."

            );

        }


        alert(
            "Amount saved successfully."
        );


    }
    catch(error) {


        console.error(
            "SAVE AMOUNT ERROR:",
            error
        );


        alert(

            error.message ||
            "Unable to save amount."

        );

    }

};

        ) {

        }

    }
);


document.getElementById(
    "oldModal"
).addEventListener(
    "click",
    function(e) {

        if (
            e.target === this
        ) {

            closeOldModal();

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Escape"
        ) {

            closeDetails();

            closeOldModal();

        }

    }
);


/* =====================================================
   START
===================================================== */

populateDoctors();

render();
