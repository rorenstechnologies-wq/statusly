<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Appointments</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fa;
            color: #172033;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            padding: 24px 30px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,.08);
        }

        .header h1 {

            margin: 0;

            font-size: 25px;

            font-weight: 800;
        }

        .header p {

            margin: 7px 0 0;

            font-size: 13px;

            opacity: .9;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width: 100%;

            max-width: 1550px;

            margin: auto;

            padding: 25px;
        }


        /* =====================================================
           FILTER CARD
        ===================================================== */

        .filter-card {

            background: white;

            padding: 18px;

            border-radius: 14px;

            box-shadow:
                0 3px 14px
                rgba(15,23,42,.06);

            margin-bottom: 20px;
        }

        .filters {

            display: grid;

            grid-template-columns:
                1fr 2fr 1fr 1fr 1fr auto;

            align-items: end;

            gap: 12px;
        }


        .clear-filter-btn {

            min-height: 40px;

            padding: 10px 14px;

            border: 1px solid #fecaca;

            border-radius: 9px;

            background: #fff1f2;

            color: #dc2626;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;
        }

        .clear-filter-btn:hover {
            background: #fee2e2;
        }

        @media(max-width:1200px) {
            .filters {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .filter-group label {

            display: block;

            font-size: 10px;

            font-weight: 800;

            color: #64748b;

            margin-bottom: 6px;
        }

        .filter-group select,
        .filter-group input {

            width: 100%;

            min-height: 40px;

            padding: 10px 12px;

            border:
                1px solid #dbe4e8;

            border-radius: 9px;

            outline: none;

            font-size: 12px;

            background: white;
        }

        .filter-group select:focus,
        .filter-group input:focus {

            border-color: #0f766e;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 22px;
        }

        .summary-card {

            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 3px 14px
                rgba(15,23,42,.06);

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .summary-icon {

            width: 45px;

            height: 45px;

            min-width: 45px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

            background: #ecfdf5;
        }

        .summary-card span {

            display: block;

            font-size: 9px;

            color: #64748b;

            font-weight: 800;
        }

        .summary-card strong {

            display: block;

            margin-top: 4px;

            font-size: 20px;
        }


        /* =====================================================
           DOCTOR CARD
        ===================================================== */

        .doctor-card {

            background: white;

            border-radius: 16px;

            margin-bottom: 22px;

            overflow: hidden;

            box-shadow:
                0 4px 18px
                rgba(15,23,42,.07);
        }

        .doctor-header {

            padding: 17px 20px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border-bottom:
                1px solid #e5edf1;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }

        .doctor-title {

            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;
        }

        .doctor-avatar {

            width: 43px;

            height: 43px;

            min-width: 43px;

            border-radius: 12px;

            background: #dff7f3;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;
        }

        .doctor-title h2 {

            margin: 0;

            font-size: 15px;
        }

        .doctor-title p {

            margin: 4px 0 0;

            color: #64748b;

            font-size: 10px;
        }

        .doctor-count {

            background: #0f766e;

            color: white;

            border-radius: 999px;

            padding: 6px 11px;

            font-size: 9px;

            font-weight: 800;

            white-space: nowrap;
        }


        /* =====================================================
           SECTION
        ===================================================== */

        .section {

            padding: 18px 20px;
        }

        .section-title {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 11px;

            font-size: 11px;

            font-weight: 800;

            color: #334155;
        }

        .section-title span {

            padding: 5px 8px;

            border-radius: 7px;

            background: #f1f5f9;

            font-size: 9px;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .table-wrapper {

            width: 100%;

            max-width: 100%;

            overflow-x: auto;

            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: thin;

            border:
                1px solid #e5edf1;

            border-radius: 11px;
        }

        .table-wrapper::-webkit-scrollbar {

            height: 7px;
        }

        .table-wrapper::-webkit-scrollbar-track {

            background: #f1f5f9;

            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {

            background: #94a3b8;

            border-radius: 10px;
        }

        table {

            width: max-content;

            min-width: 1400px;

            border-collapse: collapse;
        }

        th {

            background: #f8fafc;

            color: #64748b;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: .3px;

            padding: 12px 10px;

            text-align: left;

            white-space: nowrap;

            border-bottom:
                1px solid #e5edf1;
        }

        td {

            padding: 12px 10px;

            border-bottom:
                1px solid #edf2f5;

            font-size: 10px;

            vertical-align: middle;

            white-space: nowrap;
        }

        tr:last-child td {

            border-bottom: none;
        }

        tbody tr:hover {

            background: #f8fffe;
        }


        /* =====================================================
           PATIENT
        ===================================================== */

        .patient-cell {

            display: flex;

            align-items: center;

            gap: 9px;

            min-width: 180px;
        }

        .patient-avatar {

            width: 35px;

            height: 35px;

            min-width: 35px;

            border-radius: 10px;

            background: #e0f2fe;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 16px;
        }

        .patient-name {

            font-weight: 800;

            color: #1e293b;

            font-size: 10px;

            max-width: 180px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .patient-id {

            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 8px;
        }


        /* =====================================================
           TYPE
        ===================================================== */

        .type-badge {

            display: inline-block;

            padding: 5px 8px;

            border-radius: 999px;

            font-size: 8px;

            font-weight: 800;
        }

        .type-new {

            background: #dbeafe;

            color: #1d4ed8;
        }

        .type-old {

            background: #dcfce7;

            color: #15803d;
        }


        /* =====================================================
           VISIT
        ===================================================== */

        .visit-badge {

            display: inline-block;

            padding: 5px 8px;

            background: #f1f5f9;

            border-radius: 7px;

            font-weight: 800;

            font-size: 8px;

            color: #475569;
        }


        /* =====================================================
           AMOUNT
        ===================================================== */

        .amount-box {

            display: flex;

            align-items: center;

            gap: 4px;
        }

        .amount-input {

            width: 75px;

            height: 31px;

            padding: 6px 7px;

            border:
                1px solid #dbe4e8;

            border-radius: 7px;

            font-size: 9px;

            outline: none;
        }

        .amount-input:focus {

            border-color: #0f766e;
        }

        .save-amount {

            height: 31px;

            border: none;

            background: #0f766e;

            color: white;

            border-radius: 7px;

            padding: 6px 8px;

            cursor: pointer;

            font-size: 8px;

            font-weight: 700;
        }

        .save-amount:hover {

            background: #115e59;
        }


        /* =====================================================
           MAKE OLD
        ===================================================== */

        .old-btn {

            border:
                1px solid #fed7aa;

            background: #fff7ed;

            color: #c2410c;

            padding: 8px 11px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;

            transition: .2s;
        }

        .old-btn:hover {

            background: #ffedd5;

            border-color: #fdba74;

            transform: translateY(-1px);
        }

        .already-old {

            display: inline-flex;

            align-items: center;

            padding: 7px 10px;

            border-radius: 999px;

            background: #dcfce7;

            color: #15803d;

            font-size: 8px;

            font-weight: 800;

            white-space: nowrap;
        }


        /* =====================================================
           ACTION
        ===================================================== */

        .action-buttons {

            display: flex;

            gap: 6px;

            align-items: center;

            white-space: nowrap;
        }

        .details-btn {

            border: none;

            background: #e0f2fe;

            color: #0369a1;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;
        }

        .details-btn:hover {

            background: #bae6fd;
        }

        .follow-btn {

            display: inline-block;

            text-decoration: none;

            background: #ecfdf5;

            color: #047857;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 8px;

            font-weight: 800;

            white-space: nowrap;
        }

        .follow-btn:hover {

            background: #d1fae5;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15,23,42,.65);

            z-index: 99999;

            padding: 20px;

            overflow-y: auto;

            align-items: center;

            justify-content: center;
        }

        .modal.show {

            display: flex;
        }


        /* =====================================================
           DETAILS MODAL
        ===================================================== */

        .details-modal-content {

            width: 100%;

            max-width: 1050px;

            max-height: 92vh;

            background: #f8fafc;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.28);

            animation:
                detailsModalIn .22s ease;
        }

        @keyframes detailsModalIn {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .modal-header {

            min-height: 68px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;

            padding: 13px 18px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .modal-header h2 {

            margin: 0;

            font-size: 15px;
        }

        .close-btn {

            border: none;

            background:
                rgba(255,255,255,.15);

            color: white;

            width: 35px;

            height: 35px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 20px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .details-body {

            padding: 18px;

            max-height:
                calc(92vh - 68px);

            overflow-y: auto;

            -webkit-overflow-scrolling: touch;
        }


        /* =====================================================
           PATIENT PROFILE
        ===================================================== */

        .patient-profile-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 18px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdfa,
                    #eff6ff
                );

            border:
                1px solid #dcefee;

            border-radius: 15px;

            margin-bottom: 14px;
        }

        .patient-profile-left {

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .large-patient-avatar {

            width: 58px;

            height: 58px;

            min-width: 58px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 26px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #0e7490
                );

            color: white;
        }

        .patient-profile-left h2 {

            margin: 0;

            font-size: 18px;

            font-weight: 800;

            overflow-wrap: anywhere;
        }

        .patient-profile-left p {

            margin: 4px 0 0;

            color: #64748b;

            font-size: 8px;
        }

        .patient-phone {

            margin-top: 6px;

            font-size: 10px;

            font-weight: 700;

            color: #334155;
        }

        .detail-old,
        .detail-new {

            flex-shrink: 0;

            padding: 8px 11px;

            border-radius: 999px;

            font-size: 8px;

            font-weight: 800;

            white-space: nowrap;
        }

        .detail-old {

            background: #dcfce7;

            color: #15803d;
        }

        .detail-new {

            background: #dbeafe;

            color: #1d4ed8;
        }

           /* =========================================================
   TABLE WITH HORIZONTAL SCROLL
   ========================================================= */

.table-container {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

/* Keep table wide enough so columns don't become too small */
.table-container table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
}

/* Table cells */
.table-container th,
.table-container td {
    padding: 12px 14px;
    white-space: nowrap;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

/* Header */
.table-container th {
    background: #f8fafc;
    color: #374151;
    font-weight: 600;
}

/* Hover */
.table-container tbody tr:hover {
    background: #f8fafc;
}

/* Mobile */
@media (max-width: 768px) {
    .table-container {
        overflow-x: auto;
    }

    .table-container table {
        min-width: 1100px;
    }

    .table-container th,
    .table-container td {
        padding: 10px 12px;
        font-size: 13px;
    }
}
        /* =====================================================
           DETAIL SECTION
        ===================================================== */

        .detail-section {

            margin-bottom: 13px;

            padding: 16px;

            border:
                1px solid #e5edf1;

            border-radius: 13px;

            background: white;
        }

        .detail-section-title {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 12px;

            color: #134e4a;

            font-size: 11px;

            font-weight: 800;
        }

        .detail-section-title > span:first-child {

            width: 27px;

            height: 27px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background: #ecfdf5;
        }

        .visit-count {

            margin-left: auto;

            background: #f1f5f9;

            color: #64748b;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 7px;

            white-space: nowrap;
        }


        /* =====================================================
           PATIENT INFO
        ===================================================== */

        .patient-info-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0,1fr));

            gap: 9px;
        }

        .info-item {

            min-width: 0;

            padding: 11px;

            background: #f8fafc;

            border-radius: 9px;

            border:
                1px solid #edf2f5;
        }

        .info-item.full {

            grid-column: 1 / -1;
        }

        .info-item span {

            display: block;

            color: #94a3b8;

            font-size: 7px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .info-item strong {

            display: block;

            font-size: 9px;

            color: #334155;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }


        /* =====================================================
           CURRENT APPOINTMENT
        ===================================================== */

        .current-appointment-card {

            border-radius: 11px;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f8fffe,
                    #f8fbff
                );

            border:
                1px solid #dcefee;
        }

        .doctor-profile {

            display: flex;

            align-items: center;

            gap: 10px;

            padding-bottom: 11px;

            margin-bottom: 11px;

            border-bottom:
                1px solid #e5edf1;
        }

        .small-doctor-avatar {

            width: 40px;

            height: 40px;

            min-width: 40px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e0f2fe;

            font-size: 18px;
        }

        .doctor-profile strong {

            display: block;

            font-size: 11px;
        }

        .doctor-profile span {

            display: block;

            margin-top: 3px;

            color: #64748b;

            font-size: 8px;
        }

        .appointment-info {

            display: grid;

            grid-template-columns:
                repeat(4,minmax(0,1fr));

            gap: 8px;
        }

        .appointment-info div {

            min-width: 0;

            padding: 9px;

            background: white;

            border-radius: 8px;

            border:
                1px solid #edf2f5;
        }

        .appointment-info span {

            display: block;

            font-size: 6px;

            font-weight: 800;

            color: #94a3b8;

            margin-bottom: 4px;
        }

        .appointment-info strong {

            display: block;

            font-size: 9px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .current-amount {

            color: #0f766e !important;
        }


        /* =====================================================
           HISTORY
        ===================================================== */

        .visit-history {

            width: 100%;

            border:
                1px solid #e8eef2;

            border-radius: 10px;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }

        .history-heading {

            display: grid;

            grid-template-columns:
                1.2fr
                1.5fr
                1fr
                .8fr
                .8fr;

            gap: 10px;

            min-width: 650px;

            padding: 9px 12px;

            background: #f8fafc;

            color: #94a3b8;

            font-size: 7px;

            font-weight: 800;

            text-transform: uppercase;
        }

        .visit-history-row {

            display: grid;

            grid-template-columns:
                1.2fr
                1.5fr
                1fr
                .8fr
                .8fr;

            align-items: center;

            gap: 10px;

            min-width: 650px;

            padding: 12px;

            border-bottom:
                1px solid #edf2f5;

            background: white;
        }

        .visit-history-row:last-child {

            border-bottom: none;
        }

        .visit-history-row:hover {

            background: #f8fffe;
        }

        .visit-number strong,
        .visit-doctor strong {

            display: block;

            font-size: 9px;
        }

        .visit-number span,
        .visit-doctor span {

            display: block;

            margin-top: 3px;

            color: #94a3b8;

            font-size: 7px;
        }

        .visit-time {

            font-size: 8px;

            color: #475569;
        }

        .visit-amount {

            font-weight: 800;

            color: #0f766e;

            font-size: 9px;
        }

        .history-status {

            display: inline-block;

            padding: 5px 7px;

            border-radius: 999px;

            font-size: 7px;

            font-weight: 800;

            white-space: nowrap;
        }

        .history-old {

            background: #dcfce7;

            color: #15803d;
        }

        .history-new {

            background: #dbeafe;

            color: #1d4ed8;
        }


        /* =====================================================
           TOTAL PAID
        ===================================================== */

        .total-paid-card {

            margin-top: 10px;

            padding: 13px 15px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #f0fdfa
                );

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .total-paid-card span {

            display: block;

            font-size: 9px;

            font-weight: 800;

            color: #166534;
        }

        .total-paid-card small {

            display: block;

            margin-top: 3px;

            font-size: 7px;

            color: #65a30d;
        }

        .total-paid-card strong {

            font-size: 18px;

            color: #15803d;
        }


        /* =====================================================
           CONFIRM MODAL
        ===================================================== */

        .confirm-box {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            border-radius: 18px;

            padding: 30px 28px;

            text-align: center;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.28);

            animation:
                modalIn .2s ease;
        }

        @keyframes modalIn {

            from {

                opacity: 0;

                transform:
                    scale(.94)
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        .confirm-icon {

            width: 60px;

            height: 60px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #fff7ed;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;
        }

        .confirm-box h3 {

            margin: 0;

<script type="module">

}
from

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",  
  
    projectId:  
        "hospital-57fc8",  
  
    storageBucket:  
        "hospital-57fc8.firebasestorage.app",  
  
    messagingSenderId:  
        "711314420912",  
  
    appId:  
        "1:711314420912:web:14ec889664980679a13775"  
  
};  
  
  
/* =====================================================  
   FIREBASE INITIALIZE  
===================================================== */  
  
const firebaseApp =  
    getApps().length  
        ? getApp()  
        : initializeApp(  
            firebaseConfig  
        );  
  
  
const auth =  
    getAuth(  
        firebaseApp  
    );  
  
  
/* =====================================================  
   AUTH READY  
===================================================== */  
  
const authReady =  
    new Promise(  
        (resolve) => {  
  
            const unsubscribe =  
                onAuthStateChanged(  
                    auth,  
                    (user) => {  
  
                        unsubscribe();  
  
                        resolve(user);  
  
                    }  
                );  
  
        }  
    );  
  
  
/* =====================================================  
   TOKEN  
===================================================== */  
  
async function getStatuslyToken() {  
  
    const user =  
        await authReady;  
  
  
    if (!user) {  
  
        throw new Error(  
            "Login session not found. Please login again."  
        );  
  
    }  
  
  
    return await user.getIdToken(  
        true  
    );  
  
}  
  
  
/* =====================================================  
   AUTH FETCH  
===================================================== */  
  
async function statuslyFetch(  
    url,  
    options = {}  
) {  
  
    const token =  
        await getStatuslyToken();  
  
  
    const headers =  
        new Headers(  
            options.headers || {}  
        );  
  
  
    headers.set(  
        "Authorization",  
        "Bearer " + token  
    );  
  
  
    if (  
        options.body &&  
        !headers.has(  
            "Content-Type"  
        )  
    ) {  
  
        headers.set(  
            "Content-Type",  
            "application/json"  
        );  
  
    }  
  
  
    return fetch(  
        url,  
        {  
            ...options,  
            headers  
        }  
    );  
  
}  
  
  
/* =====================================================  
   FLASK DATA  
  
   IMPORTANT:  
   Flask route sends:  
  
   render_template(  
       "appointments.html",  
       patients=patients,  
       uid=uid  
   )  
  
===================================================== */  
  
const APPOINTMENTS =  
    {{ patients | default([]) | tojson | safe }};  
  
  
const UID =  
    "{{ uid }}";  
  
  
/* =====================================================  
   ESCAPE HTML  
===================================================== */  
  
function escapeHtml(value) {  
  
    return String(  
        value ?? ""  
    )  
  
    .replace(  
        /&/g,  
        "&amp;"  
    )  
  
    .replace(  
        /</g,  
        "&lt;"  
    )  
  
    .replace(  
        />/g,  
        "&gt;"  
    )  
  
    .replace(  
        /"/g,  
        "&quot;"  
    )  
  
    .replace(  
        /'/g,  
        "&#039;"  
    );  
  
}  
  
  
/* =====================================================  
   NORMALIZE MOBILE  
===================================================== */  
  
function normalizeMobile(  
    mobile  
) {  
  
    let digits =  
        String(  
            mobile || ""  
        )  
        .replace(  
            /\D/g,  
            ""  
        );  
  
  
    if (  
        digits.length === 12 &&  
        digits.startsWith("91")  
    ) {  
  
        digits =  
            digits.slice(-10);  
  
    }  
  
  
    return digits;  
  
}  
  
  
/* =====================================================  
   NORMALIZE DATE  
===================================================== */  
  
function normalizeDate(  
    date  
) {  
  
    if (!date) {  
  
        return "";  
  
    }  
  
  
    const value =  
        String(date)  
        .trim();  
  
  
    if (  
        /^\d{4}-\d{2}-\d{2}$/  
            .test(value)  
    ) {  
  
        return value;  
  
    }  
  
  
    const parts =  
        value.split(  
            /[-/]/  
        );  
  
  
    if (  
        parts.length === 3  
    ) {  
  
        if (  
            parts[0].length === 4  
        ) {  
  
            return [  
  
                parts[0],  
  
                parts[1].padStart(  
                    2,  
                    "0"  
                ),  
  
                parts[2].padStart(  
                    2,  
                    "0"  
                )  
  
            ].join("-");  
  
        }  
  
  
        return [  
  
            parts[2],  
  
            parts[1].padStart(  
                2,  
                "0"  
            ),  
  
            parts[0].padStart(  
                2,  
                "0"  
            )  
  
        ].join("-");  
  
    }  
  
  
    return value;  
  
}  
  
  
/* =====================================================  
   TODAY  
===================================================== */  
  
function todayISO() {  
  
    const now =  
        new Date();  
  
  
    return [  
  
        now.getFullYear(),  
  
        String(  
            now.getMonth() + 1  
        ).padStart(  
            2,  
            "0"  
        ),  
  
        String(  
            now.getDate()  
        ).padStart(  
            2,  
            "0"  
        )  
  
    ].join("-");  
  
}  
  
  
/* =====================================================  
   AMOUNT  
===================================================== */  
  
function amount(  
    value  
) {  
  
    const n =  
        Number(  
            value || 0  
        );  
  
  
    return Number.isFinite(n)  
        ? n  
        : 0;  
  
}  
  
  
/* =====================================================  
   MONEY  
===================================================== */  
  
function money(  
    value  
) {  
  
    return "₹" +  
        amount(  
            value  
        ).toLocaleString(  
            "en-IN",  
            {  
                minimumFractionDigits: 0,  
                maximumFractionDigits: 2  
            }  
        );  
  
}  
  
  
/* =====================================================  
   FORMAT DATE  
===================================================== */  
  
function formatDate(  
    date  
) {  
  
    const normalized =  
        normalizeDate(  
            date  
        );  
  
  
    if (!normalized) {  
  
        return "-";  
  
    }  
  
  
    const d =  
        new Date(  
            normalized +  
            "T00:00:00"  
        );  
  
  
    if (  
        isNaN(  
            d.getTime()  
        )  
    ) {  
  
        return escapeHtml(  
            date  
        );  
  
    }  
  
  
    return d.toLocaleDateString(  
        "en-IN",  
        {  
            day: "2-digit",  
            month: "short",  
            year: "numeric"  
        }  
    );  
  
}  
  
  
/* =====================================================  
   CATEGORY  
===================================================== */  
  
function getCategory(  
    p  
) {  
  
    const date =  
        normalizeDate(  
            p.appointment_date  
        );  
  
  
    const today =  
        todayISO();  
  
  
    if (  
        date === today  
    ) {  
  
        return "today";  
  
    }  
  
  
    if (  
        date > today  
    ) {  
  
        return "upcoming";  
  
    }  
  
  
    return "past";  
  
}  
  
  
/* =====================================================  
   PATIENT TYPE  
===================================================== */  
  
function getPatientType(  
    p  
) {  
  
    const status =  
        String(  
            p.patient_status ||  
            "NEW"  
        )  
        .toUpperCase()  
        .trim();  
  
  
    return status === "OLD"  
        ? "OLD"  
        : "NEW";  
  
}  
  
  
/* =====================================================  
   APPOINTMENT SORT  
===================================================== */  
  
function sortAppointments(  
    list  
) {  
  
    return [...list].sort(  
        (a, b) => {  
  
            const dateA =  
                normalizeDate(  
                    a.appointment_date  
                );  
  
            const dateB =  
                normalizeDate(  
                    b.appointment_date  
                );  
  
  
            const timeA =  
                String(  
                    a.appointment_time ||  
                    "00:00"  
                );  
  
            const timeB =  
                String(  
                    b.appointment_time ||  
                    "00:00"  
                );  
  
  
            const valueA =  
                new Date(  
                    dateA +  
                    "T" +  
                    timeA  
                ).getTime();  
  
  
            const valueB =  
                new Date(  
                    dateB +  
                    "T" +  
                    timeB  
                ).getTime();  
  
  
            return valueB - valueA;  
  
        }  
    );  
  
}

/* =====================================================  
   RENDER  
===================================================== */  
  
function render() { 
 
    const doctor = 
        document.getElementById("doctorFilter").value; 
 
    const search = 
        document.getElementById("searchInput").value 
        .toLowerCase() 
        .trim(); 
 
    const appointmentFilter = 
        document.getElementById("appointmentFilter").value; 
 
    const patientTypeFilter = 
        document.getElementById("patientTypeFilter").value; 
 
    const date = 
        document.getElementById("dateFilter").value; 
 
 
    /* ===================================================== 
       SEARCH EVERYTHING 
    ===================================================== */ 
 
    function matchesSearch(p) { 
 
        if (!search) { 
            return true; 
        } 
 
        let searchable = ""; 
 
        try { 
            searchable = JSON.stringify(p); 
        } 
        catch (error) { 
            searchable = ""; 
        } 
 
        /* Add calculated values so these can also be searched: 
           today, upcoming, past, NEW and OLD. */ 
 
        searchable += " " + getCategory(p); 
        searchable += " " + getPatientType(p); 
        searchable += " " + normalizeDate(p.appointment_date); 
 
        return searchable 
            .toLowerCase() 
            .includes(search); 
    } 
 
 
    const filtered = APPOINTMENTS.filter( 
        p => { 
 
            const doctorName = 
                String( 
                    p.doctor_name || "Unknown Doctor" 
                ).trim(); 
 
            if ( 
                doctor && 
                doctorName !== doctor 
            ) { 
                return false; 
            } 
 
            if (!matchesSearch(p)) { 
                return false; 
            } 
 
            if ( 
                appointmentFilter && 
                getCategory(p) !== appointmentFilter 
            ) { 
                return false; 
            } 
 
            if ( 
                patientTypeFilter && 
                getPatientType(p) !== patientTypeFilter 
            ) { 
                return false; 
            } 
 
            if ( 
                date && 
                normalizeDate(p.appointment_date) !== date 
            ) { 
                return false; 
            } 
 
            return true; 
        } 
    ); 
 
 
    updateSummary(filtered); 
 
 
    const container = 
        document.getElementById("doctorCards"); 
 
    container.innerHTML = ""; 
 
 
    if (!filtered.length) { 
 
        container.innerHTML = ` 
            <div class="doctor-card"> 
                <div class="empty"> 
                    🔎 
                    <br><br> 
                    <strong>No appointments found.</strong> 
                    <br><br> 
                    <small>Try changing your search or filters.</small> 
                </div> 
            </div> 
        `; 
 
        return; 
    } 
 
 
    const grouped = {}; 
 
    filtered.forEach( 
        p => { 
 
            const doctorName = 
                p.doctor_name || "Unknown Doctor"; 
 
            if (!grouped[doctorName]) { 
                grouped[doctorName] = []; 
            } 
 
            grouped[doctorName].push(p); 
        } 
    ); 
 
 
    Object.entries(grouped).forEach( 
        ([doctorName, patients]) => { 
 
            patients = sortAppointments(patients); 
 
            const card = document.createElement("div"); 
 
            card.className = "doctor-card"; 
 
            card.innerHTML = ` 
                <div class="doctor-header"> 
                    <div class="doctor-title"> 
                        <div class="doctor-avatar">👨‍⚕️</div> 
                        <div> 
                            <h2>${escapeHtml(doctorName)}</h2> 
                            <p>Doctor Appointments</p> 
                        </div> 
                    </div> 
 
                    <div class="doctor-count"> 
                        ${patients.length} Patients 
                    </div> 
                </div> 
            `; 
 
            const categories = [ 
                ["today", "📅 TODAY"], 
                ["upcoming", "🔔 UPCOMING"], 
                ["past", "📁 PAST"] 
            ]; 
 
            let number = 1; 
 
            categories.forEach( 
                ([category, title]) => { 
 
                    const rows = patients.filter( 
                        p => getCategory(p) === category 
                    ); 
 
                    if (!rows.length) { 
                        return; 
                    } 
 
                    const section = document.createElement("div"); 
                    section.className = "section"; 
 
                    section.innerHTML = ` 
                        <div class="section-title"> 
                            <span>${title}</span> 
                            ${rows.length} 
                            Appointment${rows.length === 1 ? "" : "s"} 
                        </div> 
 
                        <div class="table-wrapper"> 
                            <table> 
                                <thead> 
                                    <tr> 
                                        <th>No</th> 
                                        <th>Patient</th> 
                                        <th>Gender</th> 
                                        <th>Age</th> 
                                        <th>Mobile</th> 
                                        <th>Date / Time</th> 
                                        <th>Visit</th> 
                                        <th>Type</th> 
                                        <th>Amount</th> 
                                        <th>Make OLD</th> 
                                        <th>Action</th> 
                                    </tr> 
                                </thead> 
                                <tbody> 
                                    ${rows.map( 
                                        p => createRow(p, number++) 
                                    ).join("")} 
                                </tbody> 
                            </table> 
                        </div> 
                    `; 
 
                    card.appendChild(section); 
                } 
            ); 
 
            container.appendChild(card); 
        } 
    ); 
}

                                current.visit_number ||  
                                1  
                            }  
  
                        </strong>  
  
                    </div>  
  
  
                    <div>  
  
                        <span>  
                            AMOUNT  
                        </span>  
  
                        <strong  
                            class="current-amount"  
                        >  
  
                            ${money(  
                                current.amount  
                            )}  
  
                        </strong>  
  
                    </div>  
  
  
                </div>  
  
  
            </div>  
  
  
        </div>  
  
  
        <!-- VISIT HISTORY -->  
  
        <div class="detail-section">  
  
  
            <div class="detail-section-title">  
  
  
                <span>  
                    📋  
                </span>  
  
  
                Complete Visit History  
  
  
                <span class="visit-count">  
  
                    ${history.length}  
  
                    Visits  
  
                </span>  
  
  
            </div>  
  
  
            <div class="visit-history">  
  
  
                <div class="history-heading">  
  
  
                    <div>  
                        Visit / Date  
                    </div>  
  
  
                    <div>  
                        Doctor  
                    </div>  
  
  
                    <div>  
                        Time  
                    </div>  
  
  
                    <div>  
                        Amount  
                    </div>  
  
  
                    <div>  
                        Type  
                    </div>  
  
  
                </div>  
  
  
                ${  
                    historyHTML ||  
                    `  
                        <div class="empty">  
  
                            No previous visits.  
  
                        </div>  
                    `  
                }  
  
  
            </div>  
  
  
            <div class="total-paid-card">  
  
  
                <div>  
  
                    <span>  
  
                        Total Amount Paid  
  
                    </span>  
  
  
                    <small>  
  
                        Across  
  
                        ${history.length}  
  
                        visit${  
                            history.length === 1  
                                ? ""  
                                : "s"  
                        }  
  
                    </small>  
  
                </div>  
  
  
                <strong>  
  
                    ${money(  
                        totalPaid  
                    )}  
  
                </strong>  
  
  
            </div>  
  
  
        </div>  
  
  
    `;  
  
  
    document.getElementById(  
        "detailsModal"  
    ).classList.add(  
        "show"  
    );  
  
  
    document.body.style.overflow =  
        "hidden";  
  
};  
  
  
/* =====================================================  
   CLOSE DETAILS  
===================================================== */  
  
window.closeDetails =  
function() {  
  
    document.getElementById(  
        "detailsModal"  
    ).classList.remove(  
        "show"  
    );  
  
  
    document.body.style.overflow =  
        "";  
  
};  
  
  
/* =====================================================  
   MAKE OLD  
===================================================== */  
  
let selectedMobile = "";  
  
let selectedPatientName = "";  
  
  
window.openOldModal =  
function(  
    mobile,  
    patientName  
) {  
  
  
    selectedMobile =  
        normalizeMobile(  
            mobile  
        );  
  
  
    selectedPatientName =  
        patientName ||  
        "Patient";  
  
  
    if (!selectedMobile) {  
  
        alert(  
            "Patient mobile number not found."  
        );  
  
        return;  
  
    }  
  
  
    document.getElementById(  
        "oldMessage"  
    ).innerHTML = `  
  
        Are you sure you want to make  
  
        patient  
  
        <strong  
            style="  
                color:#172033;  
                font-size:12px;  
            "  
        >  
  
            ${escapeHtml(  
                selectedMobile  
            )}  
  
        </strong>  
  
        OLD?  
  
    `;  
  
  
    document.getElementById(  
        "oldModal"  
    ).classList.add(  
        "show"  
    );  
  
  
    document.body.style.overflow =  
        "hidden";  
  
};  
  
  
/* =====================================================  
   CLOSE OLD MODAL  
===================================================== */  
  
window.closeOldModal =  
function() {  
  
  
    selectedMobile = "";  
  
    selectedPatientName = "";  
  
  
    document.getElementById(  
        "oldModal"  
    ).classList.remove(  
        "show"  
    );  
  
  
    document.body.style.overflow =  
        "";  
  
};  
  
  
/* =====================================================  
   CONFIRM MAKE OLD  
===================================================== */  
  
window.confirmMakeOld =  
async function() {  
  
  
    if (!selectedMobile) {  
  
        return;  
  
    }  
  
  
    const button =  
        document.getElementById(  
            "confirmOldButton"  
        );  
  
  
    const patientName =  
        selectedPatientName ||  
        "Patient";  
  
  
    try {  
  
  
        button.disabled =  
            true;  
  
  
        button.textContent =  
            "Updating...";  
  
  
        const response =  
            await statuslyFetch(  
                "/api/doctor/make-patient-old",  
                {  
  
                    method: "POST",  
  
                    headers: {  
  
                        "Content-Type":  
                            "application/json"  
  
                    },  
  
                    body:  
                        JSON.stringify({  
  
                            mobile:  
                                selectedMobile  
  
                        })  
  
                }  
            );  
  
  
        const data =  
            await response.json();  
  
  
        if (  
            !response.ok ||  
            !data.success  
        ) {  
  
            throw new Error(  
  
                data.error ||  
                "Unable to make patient OLD."  
  
            );  
  
        }  
  
  
        closeOldModal();  
  
  
        alert(  
            `${patientName} is now OLD.`  
        );  
  
  
        window.location.reload();  
  
  
    }  
    catch(error) {  
  
  
        console.error(  
            "MAKE OLD ERROR:",  
            error  
        );  
  
  
        alert(  
  
            error.message ||  
            "Something went wrong while updating patient."  
  
        );  
  
  
        button.disabled =  
            false;  
  
  
        button.textContent =  
            "Yes, Make OLD";  
  
    }  
  
};  
  
  
/* =====================================================  
   SAVE AMOUNT  
===================================================== */  
  
window.saveAmount =  
async function(  
    appointmentId  
) {  
  
  
    const input =  
        document.getElementById(  
            "amount-" +  
            appointmentId  
        );  
  
  
    if (!input) {  
  
        alert(  
            "Amount field not found."  
        );  
  
        return;  
  
    }  
  
  
    const amountValue =  
        Number(  
            input.value  
        );  
  
  
    if (  
        !Number.isFinite(  
            amountValue  
        ) ||  
        amountValue < 0  
    ) {  
  
        alert(  
            "Please enter a valid amount."  
        );  
  
        return;  
  
    }  
  
  
    try {  
  
  
        const response =  
            await statuslyFetch(  
  
                "/api/appointment/" +  
                encodeURIComponent(  
                    appointmentId  
                ) +  
                "/amount",  
  
                {  
  
                    method: "POST",  
  
                    headers: {  
  
                        "Content-Type":  
                            "application/json"  
  
                    },  
  
                    body:  
                        JSON.stringify({  
  
                            amount:  
                                amountValue  
  
                        })  
  
                }  
  
            );  
  
  
        const data =  
            await response.json();  
  
  
        if (  
            !response.ok ||  
            !data.success  
        ) {  
  
            throw new Error(  
  
                data.error ||  
                "Unable to save amount."  
  
            );  
  
        }  
  
  
        /* Update local appointment data too */  
  
        const appointment =  
            APPOINTMENTS.find(  
                p =>  
                    String(p.id) ===  
                    String(appointmentId)  
            );  
  
  
        if (appointment) {  
  
            appointment.amount =  
                amountValue;  
  
        }  
  
  
        alert(  
            "Amount saved successfully."  
        );  
  
  
    }  
    catch(error) {  
  
  
        console.error(  
            "SAVE AMOUNT ERROR:",  
            error  
        );  
  
  
        alert(  
  
            error.message ||  
            "Unable to save amount."  
  
        );  
  
    }  
  
};  
  
  
/* ===================================================== 
   FILTER EVENTS 
===================================================== */ 
 
document.getElementById("doctorFilter") 
    .addEventListener("change", render); 
 
document.getElementById("searchInput") 
    .addEventListener("input", render); 
 
document.getElementById("appointmentFilter") 
    .addEventListener("change", render); 
 
document.getElementById("patientTypeFilter") 
    .addEventListener("change", render); 
 
document.getElementById("dateFilter") 
    .addEventListener("change", render); 
 
 
/* ===================================================== 
   CLEAR ALL FILTERS 
===================================================== */ 
 
document.getElementById("clearFilters") 
    .addEventListener( 
        "click", 
        function() { 
 
            document.getElementById("doctorFilter").value = ""; 
            document.getElementById("searchInput").value = ""; 
            document.getElementById("appointmentFilter").value = ""; 
            document.getElementById("patientTypeFilter").value = ""; 
            document.getElementById("dateFilter").value = ""; 
 
            render(); 
        } 
    ); 
 
 
/* =====================================================  
   BACKGROUND CLICK  
===================================================== */  
  
document.getElementById(  
    "detailsModal"  
).addEventListener(  
    "click",  
    function(e) {  
  
        if (  
            e.target === this  
        ) {  
  
            closeDetails();  
  
        }  
  
    }  
);  
  
  
document.getElementById(  
    "oldModal"  
).addEventListener(  
    "click",  
    function(e) {  
  
        if (  
            e.target === this  
        ) {  
  
            closeOldModal();  
  
        }  
  
    }  
);  
  
  
/* =====================================================  
   ESC KEY  
===================================================== */  
  
document.addEventListener(  
    "keydown",  
    function(e) {  
  
        if (  
            e.key === "Escape"  
        ) {  
  
            closeDetails();  
  
            closeOldModal();  
  
        }  
  
    }  
);  
  
  
/* =====================================================  
   START  
===================================================== */  
  
populateDoctors();  
  
render();  
  
  
</script>  
  
  
</body>  
  
</html>
