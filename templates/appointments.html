<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appointments - Statusly</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8fb;
    color: #17202a;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    background: linear-gradient(135deg, #007c91, #005f73);
    color: white;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.header-left h1 {
    margin: 0;
    font-size: 25px;
}

.header-left p {
    margin: 6px 0 0;
    opacity: .9;
    font-size: 14px;
}

.back-btn {
    text-decoration: none;
    color: white;
    border: 1px solid rgba(255,255,255,.5);
    padding: 10px 16px;
    border-radius: 9px;
    font-size: 14px;
}

.back-btn:hover {
    background: rgba(255,255,255,.12);
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    max-width: 1500px;
    margin: auto;
    padding: 25px;
}


/* =========================================================
   SUMMARY
========================================================= */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 22px;
}

.summary-card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

.summary-card .label {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 8px;
}

.summary-card .value {
    font-size: 27px;
    font-weight: bold;
    color: #006b7b;
}


/* =========================================================
   FILTER AREA
========================================================= */

.filter-box {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

.filters {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr auto;
    gap: 12px;
    align-items: end;
}

.filter-group label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #4b5563;
}

.filter-group input,
.filter-group select {
    width: 100%;
    height: 42px;
    border: 1px solid #d5dce2;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    background: white;
}

.filter-group input:focus,
.filter-group select:focus {
    border-color: #007c91;
}

.clear-btn {
    height: 42px;
    padding: 0 18px;
    border: none;
    border-radius: 8px;
    background: #64748b;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.clear-btn:hover {
    background: #475569;
}


/* =========================================================
   SECTION
========================================================= */

.section {
    margin-bottom: 25px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.section-title h2 {
    margin: 0;
    font-size: 19px;
}

.section-title span {
    font-size: 13px;
    color: #64748b;
}


/* =========================================================
   TABLE CARD
========================================================= */

.table-card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
    overflow: hidden;
}

/*
IMPORTANT:
Do not hide columns on mobile.
The appointment table contains important medical/admin data.

Horizontal scrolling is used instead.
*/

.table-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
}

.appointment-table {
    min-width: 1320px;
    width: 100%;
}


/* =========================================================
   TABLE HEADER
========================================================= */

.table-header,
.patient-row {
    display: grid;

    grid-template-columns:
        58px
        minmax(190px, 1.5fr)
        100px
        80px
        140px
        150px
        80px
        150px
        170px
        150px;

    align-items: center;
}

.table-header {
    background: #eef7f8;
    color: #31535b;
    font-size: 12px;
    font-weight: bold;
    padding: 14px 15px;
    border-bottom: 1px solid #dcecef;
}

.patient-row {
    padding: 14px 15px;
    border-bottom: 1px solid #edf1f3;
    font-size: 13px;
}

.patient-row:last-child {
    border-bottom: none;
}

.patient-row:hover {
    background: #fbfdfe;
}

.cell {
    padding-right: 12px;
    min-width: 0;
}


/* =========================================================
   PATIENT
========================================================= */

.patient-name {
    font-weight: bold;
    color: #173f49;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.doctor-name {
    margin-top: 4px;
    font-size: 11px;
    color: #718096;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mobile-number {
    font-family: monospace;
    font-size: 12px;
}


/* =========================================================
   DATE
========================================================= */

.date-main {
    font-weight: bold;
    color: #334155;
}

.time-main {
    margin-top: 4px;
    color: #64748b;
    font-size: 11px;
}


/* =========================================================
   VISIT
========================================================= */

.visit-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    padding: 6px 9px;
    border-radius: 20px;
    background: #e0f2fe;
    color: #075985;
    font-weight: bold;
    font-size: 12px;
}


/* =========================================================
   TYPE
========================================================= */

.type-wrapper {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
}

.type-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 55px;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.type-new {
    background: #dcfce7;
    color: #166534;
}

.type-old {
    background: #e0e7ff;
    color: #3730a3;
}

.make-old-btn {
    border: none;
    background: #f59e0b;
    color: white;
    border-radius: 6px;
    padding: 6px 9px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.make-old-btn:hover {
    background: #d97706;
}

.make-old-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}


/* =========================================================
   AMOUNT
========================================================= */

.amount-wrapper {
    display: flex;
    align-items: center;
    gap: 7px;
}

.amount-input {
    width: 95px;
    height: 36px;
    border: 1px solid #d5dce2;
    border-radius: 7px;
    padding: 0 8px;
    font-size: 13px;
}

.amount-input:focus {
    outline: none;
    border-color: #007c91;
}

.save-amount-btn {
    height: 36px;
    border: none;
    border-radius: 7px;
    padding: 0 9px;
    background: #007c91;
    color: white;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.save-amount-btn:hover {
    background: #005f73;
}

.amount-symbol {
    font-weight: bold;
    color: #334155;
}


/* =========================================================
   ACTION
========================================================= */

.action-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.followup-btn {
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.followup-btn:hover {
    background: #1d4ed8;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-state {
    text-align: center;
    padding: 55px 20px;
    color: #64748b;
}

.empty-state .icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.empty-state h3 {
    margin: 0 0 6px;
    color: #334155;
}

.empty-state p {
    margin: 0;
    font-size: 13px;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    min-width: 250px;
    max-width: 380px;
    background: #17202a;
    color: white;
    padding: 14px 17px;
    border-radius: 9px;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    transform: translateY(120px);
    opacity: 0;
    transition: .25s ease;
    z-index: 9999;
    font-size: 13px;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

.toast.success {
    background: #166534;
}

.toast.error {
    background: #991b1b;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 5000;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 15px;
    padding: 22px;
    box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

.modal h3 {
    margin: 0 0 15px;
}

.modal label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 6px;
}

.modal input,
.modal textarea {
    width: 100%;
    border: 1px solid #d5dce2;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    margin-bottom: 14px;
}

.modal textarea {
    min-height: 100px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.modal-cancel {
    border: none;
    background: #e5e7eb;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.modal-save {
    border: none;
    background: #007c91;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .filters {
        grid-template-columns: 1fr 1fr;
    }

    .clear-btn {
        width: 100%;
    }
}

@media (max-width: 600px) {

    .header {
        padding: 18px;
    }

    .header-left h1 {
        font-size: 20px;
    }

    .container {
        padding: 15px;
    }

    .summary-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .summary-card {
        padding: 15px;
    }

    .summary-card .value {
        font-size: 22px;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .table-header,
    .patient-row {
        grid-template-columns:
            58px
            190px
            100px
            80px
            140px
            150px
            80px
            150px
            170px
            150px;
    }
}
</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-left">

        <h1>📋 Appointments</h1>

        <p>
            Manage patients, visits, type and appointment amount
        </p>

    </div>

    <a
        href="/dashboard"
        class="back-btn"
    >
        ← Dashboard
    </a>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <!-- =====================================================
         SUMMARY
    ====================================================== -->

    <section class="summary-grid">

        <div class="summary-card">

            <div class="label">
                Total Appointments
            </div>

            <div
                class="value"
                id="totalAppointments"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="label">
                Today's Appointments
            </div>

            <div
                class="value"
                id="todayAppointments"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="label">
                NEW Patients
            </div>

            <div
                class="value"
                id="newPatients"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="label">
                OLD Patients
            </div>

            <div
                class="value"
                id="oldPatients"
            >
                0
            </div>

        </div>

    </section>


    <!-- =====================================================
         FILTERS
    ====================================================== -->

    <section class="filter-box">

        <div class="filters">


            <div class="filter-group">

                <label>
                    Search Patient / Mobile
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search patient name or mobile..."
                    oninput="applyFilters()"
                >

            </div>


            <div class="filter-group">

                <label>
                    Doctor
                </label>

                <select
                    id="doctorFilter"
                    onchange="applyFilters()"
                >

                    <option value="">
                        All Doctors
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label>
                    Appointment Date
                </label>

                <input
                    type="date"
                    id="dateFilter"
                    onchange="applyFilters()"
                >

            </div>


            <button
                class="clear-btn"
                onclick="clearFilters()"
            >
                Clear
            </button>

        </div>

    </section>


    <!-- =====================================================
         APPOINTMENTS
    ====================================================== -->

    <section class="section">

        <div class="section-title">

            <h2>
                All Appointments
            </h2>

            <span id="resultCount">
                0 records
            </span>

        </div>


        <div class="table-card">

            <div class="table-scroll">

                <div class="appointment-table">


                    <!-- =================================================
                         HEADER
                    ================================================== -->

                    <div class="table-header">

                        <div class="cell">
                            No
                        </div>

                        <div class="cell">
                            Patient
                        </div>

                        <div class="cell">
                            Gender
                        </div>

                        <div class="cell">
                            Age
                        </div>

                        <div class="cell">
                            Mobile
                        </div>

                        <div class="cell">
                            Date
                        </div>

                        <div class="cell">
                            Visit
                        </div>

                        <div class="cell">
                            Type
                        </div>

                        <div class="cell">
                            Amount
                        </div>

                        <div class="cell">
                            Action
                        </div>

                    </div>


                    <!-- =================================================
                         ROWS
                    ================================================== -->

                    <div id="appointmentsContainer">

                        <div class="empty-state">

                            <div class="icon">
                                ⏳
                            </div>

                            <h3>
                                Loading appointments...
                            </h3>

                            <p>
                                Please wait
                            </p>

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </section>


</main>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast"
></div>


<!-- =========================================================
     FOLLOW-UP MODAL
========================================================= -->

<div
    id="followupModal"
    class="modal-overlay"
>

    <div class="modal">

        <h3>
            Add Follow-up
        </h3>

        <input
            type="hidden"
            id="followupPatientId"
        >

        <label>
            Next Visit Date
        </label>

        <input
            type="date"
            id="followupDate"
        >

        <label>
            Doctor Notes
        </label>

        <textarea
            id="followupNotes"
            placeholder="Enter doctor notes..."
        ></textarea>

        <div class="modal-actions">

            <button
                class="modal-cancel"
                onclick="closeFollowupModal()"
            >
                Cancel
            </button>

            <button
                class="modal-save"
                onclick="saveFollowup()"
            >
                Save Follow-up
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDbHoUVO_oXHCnY040sBLOiXVS6s6xJEb8",

    authDomain:
        "hospital-57fc8.firebaseapp.com",

    databaseURL:
        "https://hospital-57fc8-default-rtdb.firebaseio.com",

    projectId:
        "hospital-57fc8",

    storageBucket:
        "hospital-57fc8.firebasestorage.app",

    messagingSenderId:
        "711314420912",

    appId:
        "1:711314420912:web:14ec889664980679a13775"
};


/* =========================================================
   INIT FIREBASE
========================================================= */

const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            showToast(
                "Please login again.",
                "error"
            );

            return;
        }

        window.currentFirebaseUser =
            user;

        await loadAppointments();
    }
);


/* =========================================================
   GET TOKEN
========================================================= */

window.getFirebaseToken =
    async function () {

        const user =
            auth.currentUser;

        if (!user) {

            throw new Error(
                "User is not logged in"
            );
        }

        return await user.getIdToken(
            true
        );
    };


/* =========================================================
   LOAD APPOINTMENTS
========================================================= */

window.loadAppointments =
    async function () {

        try {

            const uid =
                "{{ uid }}";

            const response =
                await fetch(
                    `/api/analytics/overview/${uid}`
                );

            /*
             * Overview is used only for initial
             * summary fallback.
             */

            if (!response.ok) {

                console.warn(
                    "Overview request failed"
                );
            }

        } catch (error) {

            console.error(
                error
            );
        }

        /*
         * Appointment data is already passed
         * by Flask/Jinja.
         */

        window.allAppointments =
            {{ patients | tojson }};

        if (!Array.isArray(
            window.allAppointments
        )) {

            window.allAppointments = [];
        }

        initializePage();
    };


/* =========================================================
   INITIALIZE PAGE
========================================================= */

function initializePage() {

    /*
     * Backend already sorts:
     *
     * latest date + time first.
     */

    populateDoctorFilter();

    updateSummary();

    applyFilters();
}


/* =========================================================
   DOCTOR FILTER
========================================================= */

function populateDoctorFilter() {

    const select =
        document.getElementById(
            "doctorFilter"
        );

    const doctors =
        new Set();

    window.allAppointments.forEach(
        appointment => {

            const doctor =
                String(
                    appointment.doctor_name || ""
                ).trim();

            if (doctor) {

                doctors.add(
                    doctor
                );
            }
        }
    );

    Array.from(doctors)
        .sort()
        .forEach(
            doctor => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    doctor;

                option.textContent =
                    doctor;

                select.appendChild(
                    option
                );
            }
        );
}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {

    const appointments =
        window.allAppointments || [];

    const today =
        getTodayDate();

    const total =
        appointments.length;

    const todayCount =
        appointments.filter(
            appointment =>
                String(
                    appointment.appointment_date || ""
                ) === today
        ).length;

    const newCount =
        appointments.filter(
            appointment =>
                getPatientStatus(
                    appointment
                ) === "NEW"
        ).length;

    const oldCount =
        appointments.filter(
            appointment =>
                getPatientStatus(
                    appointment
                ) === "OLD"
        ).length;

    document.getElementById(
        "totalAppointments"
    ).textContent =
        total;

    document.getElementById(
        "todayAppointments"
    ).textContent =
        todayCount;

    document.getElementById(
        "newPatients"
    ).textContent =
        newCount;

    document.getElementById(
        "oldPatients"
    ).textContent =
        oldCount;
}


/* =========================================================
   FILTER
========================================================= */

window.applyFilters =
    function () {

        const search =
            document.getElementById(
                "searchInput"
            ).value
            .trim()
            .toLowerCase();

        const doctor =
            document.getElementById(
                "doctorFilter"
            ).value;

        const date =
            document.getElementById(
                "dateFilter"
            ).value;

        let filtered =
            window.allAppointments || [];


        if (search) {

            filtered =
                filtered.filter(
                    appointment => {

                        const name =
                            String(
                                appointment.patient_name || ""
                            ).toLowerCase();

                        const mobile =
                            String(
                                appointment.mobile || ""
                            ).toLowerCase();

                        return (
                            name.includes(search)
                            ||
                            mobile.includes(search)
                        );
                    }
                );
        }


        if (doctor) {

            filtered =
                filtered.filter(
                    appointment =>
                        String(
                            appointment.doctor_name || ""
                        ) === doctor
                );
        }


        if (date) {

            filtered =
                filtered.filter(
                    appointment =>
                        String(
                            appointment.appointment_date || ""
                        ) === date
                );
        }


        renderAppointments(
            filtered
        );

        document.getElementById(
            "resultCount"
        ).textContent =
            `${filtered.length} records`;
    };


/* =========================================================
   CLEAR FILTERS
========================================================= */

window.clearFilters =
    function () {

        document.getElementById(
            "searchInput"
        ).value = "";

        document.getElementById(
            "doctorFilter"
        ).value = "";

        document.getElementById(
            "dateFilter"
        ).value = "";

        applyFilters();
    };


/* =========================================================
   GET STATUS
========================================================= */

function getPatientStatus(
    appointment
) {

    let status =
        String(
            appointment.display_patient_status
            ||
            appointment.patient_status
            ||
            "NEW"
        )
        .toUpperCase()
        .trim();

    /*
     * Visit 1 must ALWAYS remain NEW.
     */

    const visit =
        parseInt(
            appointment.visit_number || 1
        );

    if (visit <= 1) {

        return "NEW";
    }

    if (
        status !== "NEW"
        &&
        status !== "OLD"
    ) {

        return "NEW";
    }

    return status;
}


/* =========================================================
   RENDER APPOINTMENTS
========================================================= */

function renderAppointments(
    appointments
) {

    const container =
        document.getElementById(
            "appointmentsContainer"
        );

    if (!appointments.length) {

        container.innerHTML = `

            <div class="empty-state">

                <div class="icon">
                    📋
                </div>

                <h3>
                    No appointments found
                </h3>

                <p>
                    Try changing your filters.
                </p>

            </div>

        `;

        return;
    }


    /*
     * Backend already sends latest first.
     * Sort again here for safety.
     */

    appointments =
        [...appointments].sort(
            compareAppointments
        );


    container.innerHTML =
        appointments
            .map(
                (appointment, index) =>
                    createAppointmentRow(
                        appointment,
                        index
                    )
            )
            .join("");
}


/* =========================================================
   CREATE ROW
========================================================= */

function createAppointmentRow(
    appointment,
    index
) {

    const appointmentId =
        escapeAttribute(
            appointment.id || ""
        );

    const patientName =
        escapeHtml(
            appointment.patient_name
            ||
            "Unknown"
        );

    const doctorName =
        escapeHtml(
            appointment.doctor_name
            ||
            "-"
        );

    const gender =
        escapeHtml(
            appointment.gender
            ||
            "-"
        );

    const age =
        escapeHtml(
            appointment.age
            ||
            "-"
        );

    const mobile =
        escapeHtml(
            appointment.mobile
            ||
            "-"
        );

    const date =
        escapeHtml(
            appointment.appointment_date
            ||
            "-"
        );

    const time =
        escapeHtml(
            appointment.appointment_time
            ||
            ""
        );

    const visit =
        parseInt(
            appointment.visit_number
            ||
            1
        );

    const status =
        getPatientStatus(
            appointment
        );

    let amount =
        Number(
            appointment.amount || 0
        );

    if (
        !Number.isFinite(amount)
    ) {

        amount = 0;
    }


    /* =====================================================
       TYPE HTML
    ====================================================== */

    let typeHtml = "";

    if (status === "OLD") {

        typeHtml = `

            <div class="type-wrapper">

                <span class="type-badge type-old">
                    OLD
                </span>

            </div>

        `;

    } else {

        typeHtml = `

            <div class="type-wrapper">

                <span class="type-badge type-new">
                    NEW
                </span>

                <button
                    class="make-old-btn"
                    onclick="makePatientOld('${escapeAttribute(appointment.mobile || "")}')"
                >
                    Make OLD
                </button>

            </div>

        `;
    }


    /* =====================================================
       AMOUNT HTML
    ====================================================== */

    const amountHtml = `

        <div class="amount-wrapper">

            <span class="amount-symbol">
                ₹
            </span>

            <input
                type="number"
                min="0"
                step="0.01"
                class="amount-input"
                id="amount-${appointmentId}"
                value="${amount}"
                placeholder="Amount"
            >

            <button
                class="save-amount-btn"
                onclick="saveAmount('${appointmentId}')"
            >
                Save
            </button>

        </div>

    `;


    /* =====================================================
       ACTION HTML
    ====================================================== */

    const actionHtml = `

        <div class="action-buttons">

            <button
                class="followup-btn"
                onclick="openFollowupModal('${appointmentId}')"
            >
                Follow-up
            </button>

        </div>

    `;


    return `

        <div
            class="patient-row"
            data-id="${appointmentId}"
        >

            <div class="cell">
                ${index + 1}
            </div>


            <div class="cell">

                <div class="patient-name">
                    ${patientName}
                </div>

                <div class="doctor-name">
                    ${doctorName}
                </div>

            </div>


            <div class="cell">
                ${gender}
            </div>


            <div class="cell">
                ${age}
            </div>


            <div class="cell mobile-number">
                ${mobile}
            </div>


            <div class="cell">

                <div class="date-main">
                    ${date}
                </div>

                <div class="time-main">
                    ${time}
                </div>

            </div>


            <div class="cell">

                <span class="visit-badge">
                    Visit ${visit}
                </span>

            </div>


            <div class="cell">

                ${typeHtml}

            </div>


            <div class="cell">

                ${amountHtml}

            </div>


            <div class="cell">

                ${actionHtml}

            </div>

        </div>

    `;
}


/* =========================================================
   MAKE PATIENT OLD
========================================================= */

window.makePatientOld =
    async function (
        mobile
    ) {

        if (!mobile) {

            showToast(
                "Mobile number missing.",
                "error"
            );

            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to make this patient OLD?\n\nVisit 1 will remain NEW. Visit 2 onward will become OLD."
            );

        if (!confirmed) {

            return;
        }


        try {

            const token =
                await getFirebaseToken();


            const response =
                await fetch(
                    "/api/doctor/make-patient-old",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`
                        },

                        body:
                            JSON.stringify({

                                mobile:
                                    mobile
                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok
                ||
                !result.success
            ) {

                throw new Error(
                    result.error
                    ||
                    "Unable to make patient OLD"
                );
            }


            showToast(
                "Patient changed to OLD successfully.",
                "success"
            );


            /*
             * Reload page data after backend update.
             */

            setTimeout(
                () => {

                    window.location.reload();

                },
                700
            );

        } catch (error) {

            console.error(
                error
            );

            showToast(
                error.message
                ||
                "Something went wrong.",
                "error"
            );
        }
    };


/* =========================================================
   SAVE AMOUNT
========================================================= */

window.saveAmount =
    async function (
        appointmentId
    ) {

        const input =
            document.getElementById(
                `amount-${appointmentId}`
            );

        if (!input) {

            showToast(
                "Amount field not found.",
                "error"
            );

            return;
        }


        const rawAmount =
            input.value.trim();


        if (rawAmount === "") {

            showToast(
                "Please enter amount.",
                "error"
            );

            return;
        }


        const amount =
            Number(
                rawAmount
            );


        if (
            !Number.isFinite(amount)
            ||
            amount < 0
        ) {

            showToast(
                "Please enter a valid amount.",
                "error"
            );

            return;
        }


        try {

            const token =
                await getFirebaseToken();


            const response =
                await fetch(
                    `/api/appointment/${encodeURIComponent(appointmentId)}/amount`,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`
                        },

                        body:
                            JSON.stringify({

                                amount:
                                    amount
                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok
                ||
                !result.success
            ) {

                throw new Error(
                    result.error
                    ||
                    "Unable to update amount"
                );
            }


            /*
             * Update local data also.
             */

            const appointment =
                window.allAppointments.find(
                    item =>
                        String(item.id)
                        ===
                        String(appointmentId)
                );


            if (appointment) {

                appointment.amount =
                    amount;
            }


            showToast(
                `Amount ₹${amount} saved successfully.`,
                "success"
            );

        } catch (error) {

            console.error(
                error
            );

            showToast(
                error.message
                ||
                "Unable to save amount.",
                "error"
            );
        }
    };


/* =========================================================
   FOLLOW-UP MODAL
========================================================= */

window.openFollowupModal =
    function (
        patientId
    ) {

        document.getElementById(
            "followupPatientId"
        ).value =
            patientId;

        document.getElementById(
            "followupDate"
        ).value = "";

        document.getElementById(
            "followupNotes"
        ).value = "";

        document.getElementById(
            "followupModal"
        ).classList.add(
            "show"
        );
    };


window.closeFollowupModal =
    function () {

        document.getElementById(
            "followupModal"
        ).classList.remove(
            "show"
        );
    };


/* =========================================================
   SAVE FOLLOW-UP
========================================================= */

window.saveFollowup =
    async function () {

        const patientId =
            document.getElementById(
                "followupPatientId"
            ).value;

        const date =
            document.getElementById(
                "followupDate"
            ).value;

        const notes =
            document.getElementById(
                "followupNotes"
            ).value;


        if (!patientId) {

            showToast(
                "Patient ID missing.",
                "error"
            );

            return;
        }


        if (!date) {

            showToast(
                "Please select next visit date.",
                "error"
            );

            return;
        }


        try {

            const formData =
                new FormData();

            formData.append(
                "patient_id",
                patientId
            );

            formData.append(
                "next_visit_date",
                date
            );

            formData.append(
                "doctor_notes",
                notes
            );


            const response =
                await fetch(
                    "/save_followup",
                    {

                        method:
                            "POST",

                        body:
                            formData
                    }
                );


            const result =
                await response.json();


            if (!response.ok
                ||
                !result.success
            ) {

                throw new Error(
                    result.error
                    ||
                    "Unable to save follow-up"
                );
            }


            closeFollowupModal();


            showToast(
                "Follow-up saved successfully.",
                "success"
            );


        } catch (error) {

            console.error(
                error
            );

            showToast(
                error.message
                ||
                "Unable to save follow-up.",
                "error"
            );
        }
    };


/* =========================================================
   SORT APPOINTMENTS
========================================================= */

function compareAppointments(
    a,
    b
) {

    const dateA =
        parseAppointmentDate(
            a
        );

    const dateB =
        parseAppointmentDate(
            b
        );

    return (
        dateB.getTime()
        -
        dateA.getTime()
    );
}


function parseAppointmentDate(
    appointment
) {

    const date =
        String(
            appointment.appointment_date
            ||
            ""
        ).trim();

    const time =
        String(
            appointment.appointment_time
            ||
            ""
        ).trim();


    /*
     * JavaScript date parsing.
     */

    let parsed =
        new Date(
            `${date}T${time}`
        );


    if (!Number.isNaN(
        parsed.getTime()
    )) {

        return parsed;
    }


    parsed =
        new Date(
            `${date} ${time}`
        );


    if (!Number.isNaN(
        parsed.getTime()
    )) {

        return parsed;
    }


    const created =
        String(
            appointment.created_at
            ||
            ""
        );


    parsed =
        new Date(
            created
        );


    if (!Number.isNaN(
        parsed.getTime()
    )) {

        return parsed;
    }


    return new Date(0);
}


/* =========================================================
   TODAY
========================================================= */

function getTodayDate() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${year}-${month}-${day}`;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(
    value
) {

    return String(
        value
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    );
}


/* =========================================================
   TOAST
========================================================= */

window.showToast =
    function (
        message,
        type = ""
    ) {

        const toast =
            document.getElementById(
                "toast"
            );

        toast.textContent =
            message;

        toast.className =
            "toast show " + type;


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
    };


/* =========================================================
   CLOSE MODAL ON BACKGROUND CLICK
========================================================= */

document.getElementById(
    "followupModal"
).addEventListener(
    "click",
    function (event) {

        if (
            event.target === this
        ) {

            closeFollowupModal();
        }
    }
);

</script>
