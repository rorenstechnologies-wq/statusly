<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Appointments</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #172033;

        }


        /* =================================================
           HEADER
        ================================================= */

        .topbar {

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                18px 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .title-area h1 {

            margin: 0;

            font-size: 24px;

            font-weight: 800;

        }


        .title-area p {

            margin:
                5px 0 0;

            color: #64748b;

            font-size: 13px;

        }


        /* =================================================
           MAIN
        ================================================= */

        .container {

            width: 100%;

            max-width: 1600px;

            margin: auto;

            padding: 20px;

        }


        /* =================================================
           SUMMARY
        ================================================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 14px;

            margin-bottom: 18px;

        }


        .summary-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 12px;

            padding: 18px;

        }


        .summary-label {

            font-size: 11px;

            font-weight: 800;

            color: #64748b;

            text-transform: uppercase;

        }


        .summary-value {

            margin-top: 8px;

            font-size: 26px;

            font-weight: 800;

        }


        /* =================================================
           FILTER CARD
        ================================================= */

        .filter-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 20px;

        }


        .filters {

            display: grid;

            grid-template-columns:
                1fr
                2fr
                1fr
                1fr
                1fr
                auto;

            gap: 12px;

            align-items: end;

        }


        .filter-group {

            display: flex;

            flex-direction: column;

            gap: 6px;

            min-width: 0;

        }


        .filter-group label {

            font-size: 10px;

            font-weight: 800;

            color: #475569;

            letter-spacing: .5px;

        }


        .filter-group select,
        .filter-group input {

            width: 100%;

            height: 42px;

            padding:
                0 12px;

            border:
                1px solid #dbe3ee;

            border-radius: 9px;

            background: #ffffff;

            color: #172033;

            font-size: 13px;

            outline: none;

        }


        .filter-group select:focus,
        .filter-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, .10);

        }


        .clear-button {

            height: 42px;

            padding:
                0 16px;

            border:
                1px solid #fecaca;

            border-radius: 9px;

            background: #fff1f2;

            color: #dc2626;

            font-weight: 800;

            cursor: pointer;

        }


        .clear-button:hover {

            background: #fee2e2;

        }


        /* =================================================
           DOCTOR CARD
        ================================================= */

        .doctor-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            margin-bottom: 18px;

            overflow: hidden;

        }


        .doctor-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px 20px;

            border-bottom:
                1px solid #eef2f7;

        }


        .doctor-title {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .doctor-avatar {

            width: 44px;

            height: 44px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

        }


        .doctor-title h2 {

            margin: 0;

            font-size: 17px;

        }


        .doctor-title p {

            margin:
                4px 0 0;

            color: #64748b;

            font-size: 11px;

        }


        .doctor-count {

            background: #eff6ff;

            color: #2563eb;

            padding:
                8px 12px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 800;

        }


        /* =================================================
           SECTION
        ================================================= */

        .section {

            padding: 0 16px 18px;

        }


        .section-title {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                16px 4px 10px;

            font-size: 12px;

            font-weight: 800;

            color: #334155;

        }


        .section-title span {

            font-size: 13px;

        }


        /* =================================================
           TABLE
        ================================================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;

        }


        th {

            background: #f8fafc;

            color: #64748b;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            padding:
                11px 10px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;

            white-space: nowrap;

        }


        td {

            padding:
                12px 10px;

            border-bottom:
                1px solid #f1f5f9;

            font-size: 12px;

            vertical-align: middle;

        }


        tr:last-child td {

            border-bottom: none;

        }


        .patient-name {

            font-weight: 800;

            color: #172033;

        }


        .muted {

            color: #64748b;

            font-size: 11px;

        }


        /* =================================================
           BADGES
        ================================================= */

        .badge {

            display: inline-flex;

            align-items: center;

            gap: 4px;

            padding:
                5px 8px;

            border-radius: 20px;

            font-size: 10px;

            font-weight: 800;

        }


        .badge-new {

            background: #ecfdf5;

            color: #047857;

        }


        .badge-old {

            background: #eff6ff;

            color: #2563eb;

        }


        .badge-status {

            background: #f1f5f9;

            color: #475569;

        }


        /* =================================================
           ACTION
        ================================================= */

        .action-button {

            border: none;

            background: #eff6ff;

            color: #2563eb;

            padding:
                7px 10px;

            border-radius: 7px;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

        }


        .action-button:hover {

            background: #dbeafe;

        }


        /* =================================================
           EMPTY
        ================================================= */

        .empty {

            text-align: center;

            padding: 70px 20px;

            color: #64748b;

        }


        .empty-icon {

            font-size: 42px;

            margin-bottom: 12px;

        }


        /* =================================================
           MODAL
        ================================================= */

        .modal {

            position: fixed;

            inset: 0;

            background:
                rgba(15, 23, 42, .55);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;

        }


        .modal.show {

            display: flex;

        }


        .modal-box {

            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 14px;

            padding: 22px;

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;

        }


        .modal-header h2 {

            margin: 0;

            font-size: 18px;

        }


        .close-modal {

            width: 34px;

            height: 34px;

            border: none;

            border-radius: 50%;

            background: #f1f5f9;

            cursor: pointer;

            font-size: 18px;

        }


        .details-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

        }


        .detail {

            padding: 12px;

            background: #f8fafc;

            border-radius: 8px;

        }


        .detail-label {

            font-size: 9px;

            font-weight: 800;

            color: #64748b;

            text-transform: uppercase;

        }


        .detail-value {

            margin-top: 4px;

            font-size: 13px;

            font-weight: 700;

            word-break: break-word;

        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (max-width: 1200px) {

            .filters {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media (max-width: 800px) {

            .summary {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .filters {

                grid-template-columns:
                    1fr 1fr;

            }

        }


        @media (max-width: 550px) {

            .summary {

                grid-template-columns:
                    1fr;

            }


            .filters {

                grid-template-columns:
                    1fr;

            }


            .doctor-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .details-grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="topbar">

    <div class="title-area">

        <h1>
            Appointments
        </h1>

        <p>
            Search and manage hospital appointments
        </p>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- =================================================
         SUMMARY
    ================================================== -->

    <div class="summary">

        <div class="summary-card">

            <div class="summary-label">
                Total Patients
            </div>

            <div
                class="summary-value"
                id="totalPatients"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Today
            </div>

            <div
                class="summary-value"
                id="todayCount"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Upcoming
            </div>

            <div
                class="summary-value"
                id="upcomingCount"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Doctors
            </div>

            <div
                class="summary-value"
                id="totalDoctors"
            >
                0
            </div>

        </div>

    </div>


    <!-- =================================================
         FILTERS
    ================================================== -->

    <div class="filter-card">

        <div class="filters">


            <!-- DOCTOR -->

            <div class="filter-group">

                <label>
                    DOCTOR
                </label>

                <select
                    id="doctorFilter"
                >

                    <option value="">
                        All Doctors
                    </option>

                </select>

            </div>


            <!-- UNIVERSAL SEARCH -->

            <div class="filter-group">

                <label>
                    SEARCH EVERYTHING
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="🔎 Patient, mobile, doctor, date, NEW, OLD..."
                    autocomplete="off"
                >

            </div>


            <!-- APPOINTMENT -->

            <div class="filter-group">

                <label>
                    APPOINTMENT
                </label>

                <select
                    id="appointmentFilter"
                >

                    <option value="">
                        All Appointments
                    </option>

                    <option value="today">
                        📅 Today
                    </option>

                    <option value="upcoming">
                        🔔 Upcoming
                    </option>

                    <option value="past">
                        📁 Past
                    </option>

                </select>

            </div>


            <!-- PATIENT TYPE -->

            <div class="filter-group">

                <label>
                    PATIENT TYPE
                </label>

                <select
                    id="patientTypeFilter"
                >

                    <option value="">
                        All Patients
                    </option>

                    <option value="NEW">
                        🆕 NEW Patient
                    </option>

                    <option value="OLD">
                        🔵 OLD Patient
                    </option>

                </select>

            </div>


            <!-- EXACT DATE -->

            <div class="filter-group">

                <label>
                    EXACT DATE
                </label>

                <input
                    type="date"
                    id="dateFilter"
                >

            </div>


            <!-- CLEAR -->

            <div class="filter-group">

                <label>
                    &nbsp;
                </label>

                <button
                    type="button"
                    id="clearFilters"
                    class="clear-button"
                >
                    ✕ Clear
                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         APPOINTMENT CARDS
    ================================================== -->

    <div id="doctorCards"></div>


</main>


<!-- =====================================================
     DETAILS MODAL
===================================================== -->

<div
    class="modal"
    id="detailsModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Patient Details
            </h2>

            <button
                class="close-modal"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div
            class="details-grid"
            id="detailsContent"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   APPOINTMENTS DATA
===================================================== */

let APPOINTMENTS = [];


/*
 * Flask can provide the data directly.
 *
 * If your template has:
 *
 * patients
 *
 * this will use it.
 */

{% if patients is defined %}

try {

    APPOINTMENTS =
        {{ patients | tojson }};

}
catch (error) {

    APPOINTMENTS = [];

}

{% endif %}


/* =====================================================
   UID
===================================================== */

const HOSPITAL_UID =
    "{{ uid | default('') }}";


/* =====================================================
   NORMALIZE DATE
===================================================== */

function normalizeDate(value) {

    if (!value) {

        return "";

    }


    const text =
        String(value)
            .trim();


    /*
     * YYYY-MM-DD
     */

    if (
        /^\d{4}-\d{2}-\d{2}$/
            .test(text)
    ) {

        return text;

    }


    /*
     * YYYY/MM/DD
     */

    if (
        /^\d{4}\/\d{2}\/\d{2}$/
            .test(text)
    ) {

        return text.replace(
            /\//g,
            "-"
        );

    }


    /*
     * DD-MM-YYYY
     */

    let match =
        text.match(
            /^(\d{2})-(\d{2})-(\d{4})$/
        );


    if (match) {

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );

    }


    /*
     * DD/MM/YYYY
     */

    match =
        text.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
        );


    if (match) {

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );

    }


    const date =
        new Date(text);


    if (
        !isNaN(
            date.getTime()
        )
    ) {

        return date
            .toISOString()
            .split("T")[0];

    }


    return "";

}


/* =====================================================
   TODAY / UPCOMING / PAST
===================================================== */

function getCategory(p) {

    const appointmentDate =
        normalizeDate(
            p.appointment_date
        );


    if (!appointmentDate) {

        return "past";

    }


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    if (
        appointmentDate ===
        today
    ) {

        return "today";

    }


    if (
        appointmentDate >
        today
    ) {

        return "upcoming";

    }


    return "past";

}


/* =====================================================
   PATIENT TYPE
===================================================== */

function getPatientType(p) {

    const status =
        String(
            p.patient_status ||
            "NEW"
        )
        .toUpperCase()
        .trim();


    return status === "OLD"
        ? "OLD"
        : "NEW";

}


/* =====================================================
   SORT APPOINTMENTS
===================================================== */

function sortAppointments(list) {

    return [
        ...list
    ].sort(
        (a, b) => {

            const dateA =
                normalizeDate(
                    a.appointment_date
                );


            const dateB =
                normalizeDate(
                    b.appointment_date
                );


            const timeA =
                String(
                    a.appointment_time ||
                    "00:00"
                );


            const timeB =
                String(
                    b.appointment_time ||
                    "00:00"
                );


            const valueA =
                new Date(
                    dateA +
                    "T" +
                    timeA
                ).getTime();


            const valueB =
                new Date(
                    dateB +
                    "T" +
                    timeB
                ).getTime();


            return valueB - valueA;

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   UNIVERSAL SEARCH
===================================================== */

function searchAppointment(
    appointment,
    searchTerm
) {

    if (!searchTerm) {

        return true;

    }


    let searchableText = "";


    /*
     * Search EVERY Firebase field.
     */

    try {

        searchableText =
            JSON.stringify(
                appointment
            );

    }
    catch (error) {

        searchableText = "";

    }


    /*
     * Also search calculated values.
     */

    const category =
        getCategory(
            appointment
        );


    const patientType =
        getPatientType(
            appointment
        );


    searchableText +=
        " " +
        category +
        " " +
        patientType +
        " today upcoming past new old";


    return searchableText
        .toLowerCase()
        .includes(
            searchTerm
        );

}


/* =====================================================
   POPULATE DOCTORS
===================================================== */

function populateDoctors() {

    const select =
        document.getElementById(
            "doctorFilter"
        );


    if (!select) {

        return;

    }


    /*
     * Keep first option.
     */

    select.innerHTML = `

        <option value="">
            All Doctors
        </option>

    `;


    const doctors =
        [
            ...new Set(

                APPOINTMENTS.map(
                    p =>
                        p.doctor_name ||
                        "Unknown Doctor"
                )

            )
        ]
        .sort(
            (a, b) =>
                String(a)
                    .localeCompare(
                        String(b)
                    )
        );


    doctors.forEach(
        doctor => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                doctor;


            option.textContent =
                doctor;


            select.appendChild(
                option
            );

        }
    );


    document.getElementById(
        "totalDoctors"
    ).textContent =
        doctors.length;

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(list) {

    document.getElementById(
        "totalPatients"
    ).textContent =
        list.length;


    document.getElementById(
        "todayCount"
    ).textContent =

        list.filter(
            p =>
                getCategory(p) ===
                "today"
        ).length;


    document.getElementById(
        "upcomingCount"
    ).textContent =

        list.filter(
            p =>
                getCategory(p) ===
                "upcoming"
        ).length;

}


/* =====================================================
   CREATE PATIENT ROW
===================================================== */

function createRow(
    p,
    number
) {

    const type =
        getPatientType(
            p
        );


    const typeBadge =
        type === "OLD"

            ? `
                <span class="badge badge-old">
                    🔵 OLD
                </span>
              `

            : `
                <span class="badge badge-new">
                    🆕 NEW
                </span>
              `;


    const patientName =
        p.patient_name ||
        p.name ||
        "Unknown Patient";


    const mobile =
        p.mobile ||
        p.phone ||
        "-";


    const gender =
        p.gender ||
        "-";


    const age =
        p.age ||
        "-";


    const date =
        p.appointment_date ||
        "-";


    const time =
        p.appointment_time ||
        "-";


    const visit =
        p.visit_number ||
        1;


    const amount =
        p.amount ??
        p.fee ??
        p.payment_amount ??
        0;


    const status =
        p.status ||
        p.payment_status ||
        "Booked";


    return `

        <tr>

            <td>
                ${number}
            </td>


            <td>

                <div class="patient-name">

                    ${escapeHtml(
                        patientName
                    )}

                </div>

                ${
                    p.patient_no
                        ? `
                            <div class="muted">
                                Patient No:
                                ${escapeHtml(
                                    p.patient_no
                                )}
                            </div>
                          `
                        : ""
                }

            </td>


            <td>
                ${escapeHtml(
                    gender
                )}
            </td>


            <td>
                ${escapeHtml(
                    age
                )}
            </td>


            <td>
                ${escapeHtml(
                    mobile
                )}
            </td>


            <td>

                <div>
                    ${escapeHtml(
                        date
                    )}
                </div>

                <div class="muted">
                    ${escapeHtml(
                        time
                    )}
                </div>

            </td>


            <td>
                ${escapeHtml(
                    visit
                )}
            </td>


            <td>
                ${typeBadge}
            </td>


            <td>
                ₹${escapeHtml(
                    amount
                )}
            </td>


            <td>

                <span
                    class="badge badge-status"
                >
                    ${escapeHtml(
                        status
                    )}
                </span>

            </td>


            <td>

                <button
                    type="button"
                    class="action-button"
                    onclick='openDetails(${JSON.stringify(p).replace(/'/g, "&#39;")})'
                >
                    View
                </button>

            </td>

        </tr>

    `;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const doctor =
        document.getElementById(
            "doctorFilter"
        ).value;


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const appointmentFilter =
        document.getElementById(
            "appointmentFilter"
        ).value;


    const patientTypeFilter =
        document.getElementById(
            "patientTypeFilter"
        ).value;


    const exactDate =
        document.getElementById(
            "dateFilter"
        ).value;


    /* =================================================
       FILTER
    ================================================= */

    const filtered =
        APPOINTMENTS.filter(
            p => {


                /* =====================================
                   DOCTOR
                ===================================== */

                if (
                    doctor &&
                    String(
                        p.doctor_name ||
                        "Unknown Doctor"
                    ).trim() !==
                    doctor
                ) {

                    return false;

                }


                /* =====================================
                   SEARCH EVERYTHING
                ===================================== */

                if (
                    search &&
                    !searchAppointment(
                        p,
                        search
                    )
                ) {

                    return false;

                }


                /* =====================================
                   TODAY / UPCOMING / PAST
                ===================================== */

                if (
                    appointmentFilter &&
                    getCategory(p) !==
                    appointmentFilter
                ) {

                    return false;

                }


                /* =====================================
                   NEW / OLD
                ===================================== */

                if (
                    patientTypeFilter &&
                    getPatientType(p) !==
                    patientTypeFilter
                ) {

                    return false;

                }


                /* =====================================
                   EXACT DATE
                ===================================== */

                if (
                    exactDate &&
                    normalizeDate(
                        p.appointment_date
                    ) !==
                    exactDate
                ) {

                    return false;

                }


                return true;

            }
        );


    updateSummary(
        filtered
    );


    const container =
        document.getElementById(
            "doctorCards"
        );


    container.innerHTML = "";


    /* =================================================
       EMPTY
    ================================================= */

    if (
        filtered.length === 0
    ) {

        container.innerHTML = `

            <div class="doctor-card">

                <div class="empty">

                    <div class="empty-icon">
                        🔎
                    </div>

                    <strong>
                        No appointments found
                    </strong>

                    <br><br>

                    <span>
                        Try changing your filters.
                    </span>

                </div>

            </div>

        `;

        return;

    }


    /* =================================================
       GROUP BY DOCTOR
    ================================================= */

    const grouped = {};


    filtered.forEach(
        p => {

            const doctorName =
                p.doctor_name ||
                "Unknown Doctor";


            if (
                !grouped[
                    doctorName
                ]
            ) {

                grouped[
                    doctorName
                ] = [];

            }


            grouped[
                doctorName
            ].push(
                p
            );

        }
    );


    /* =================================================
       DOCTOR CARDS
    ================================================= */

    Object.entries(
        grouped
    ).forEach(
        ([doctorName, patients]) => {


            patients =
                sortAppointments(
                    patients
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "doctor-card";


            card.innerHTML = `

                <div class="doctor-header">

                    <div class="doctor-title">

                        <div class="doctor-avatar">
                            👨‍⚕️
                        </div>

                        <div>

                            <h2>
                                ${escapeHtml(
                                    doctorName
                                )}
                            </h2>

                            <p>
                                Doctor Appointments
                            </p>

                        </div>

                    </div>


                    <div class="doctor-count">

                        ${patients.length}
                        Patients

                    </div>

                </div>

            `;


            /* =========================================
               DATE GROUPS
            ========================================= */

            const categories = [

                {
                    value: "today",
                    title: "📅 TODAY"
                },

                {
                    value: "upcoming",
                    title: "🔔 UPCOMING"
                },

                {
                    value: "past",
                    title: "📁 PAST"
                }

            ];


            let number = 1;


            categories.forEach(
                category => {


                    const rows =
                        patients.filter(
                            p =>
                                getCategory(p) ===
                                category.value
                        );


                    if (
                        rows.length === 0
                    ) {

                        return;

                    }


                    const section =
                        document.createElement(
                            "div"
                        );


                    section.className =
                        "section";


                    section.innerHTML = `

                        <div class="section-title">

                            <span>
                                ${category.title}
                            </span>

                            <span>
                                ${rows.length}
                                Appointment${
                                    rows.length === 1
                                        ? ""
                                        : "s"
                                }
                            </span>

                        </div>


                        <div class="table-wrapper">

                            <table>

                                <thead>

                                    <tr>

                                        <th>
                                            No
                                        </th>

                                        <th>
                                            Patient
                                        </th>

                                        <th>
                                            Gender
                                        </th>

                                        <th>
                                            Age
                                        </th>

                                        <th>
                                            Mobile
                                        </th>

                                        <th>
                                            Date / Time
                                        </th>

                                        <th>
                                            Visit
                                        </th>

                                        <th>
                                            Type
                                        </th>

                                        <th>
                                            Amount
                                        </th>

                                        <th>
                                            Status
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${rows
                                        .map(
                                            p =>
                                                createRow(
                                                    p,
                                                    number++
                                                )
                                        )
                                        .join("")
                                    }

                                </tbody>

                            </table>

                        </div>

                    `;


                    card.appendChild(
                        section
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   VIEW DETAILS
===================================================== */

function openDetails(p) {

    const container =
        document.getElementById(
            "detailsContent"
        );


    container.innerHTML = "";


    /*
     * Display every Firebase field.
     *
     * This also makes the details modal
     * automatically support future fields.
     */

    Object.entries(
        p || {}
    ).forEach(
        ([key, value]) => {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return;

            }


            let displayValue;


            if (
                typeof value ===
                "object"
            ) {

                try {

                    displayValue =
                        JSON.stringify(
                            value,
                            null,
                            2
                        );

                }
                catch {

                    displayValue =
                        String(
                            value
                        );

                }

            }
            else {

                displayValue =
                    String(
                        value
                    );

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "detail";


            item.innerHTML = `

                <div class="detail-label">

                    ${escapeHtml(
                        key.replace(
                            /_/g,
                            " "
                        )
                    )}

                </div>

                <div class="detail-value">

                    ${escapeHtml(
                        displayValue
                    )}

                </div>

            `;


            container.appendChild(
                item
            );

        }
    );


    document.getElementById(
        "detailsModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

    document.getElementById(
        "detailsModal"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

document.getElementById(
    "detailsModal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            this
        ) {

            closeModal();

        }

    }
);


/* =====================================================
   FILTER EVENTS
===================================================== */

document.getElementById(
    "doctorFilter"
).addEventListener(
    "change",
    render
);


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    render
);


document.getElementById(
    "appointmentFilter"
).addEventListener(
    "change",
    render
);


document.getElementById(
    "patientTypeFilter"
).addEventListener(
    "change",
    render
);


document.getElementById(
    "dateFilter"
).addEventListener(
    "change",
    render
);


/* =====================================================
   CLEAR FILTERS
===================================================== */

document.getElementById(
    "clearFilters"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "doctorFilter"
        ).value = "";


        document.getElementById(
            "searchInput"
        ).value = "";


        document.getElementById(
            "appointmentFilter"
        ).value = "";


        document.getElementById(
            "patientTypeFilter"
        ).value = "";


        document.getElementById(
            "dateFilter"
        ).value = "";


        render();

    }
);


/* =====================================================
   OPTIONAL API LOADER
===================================================== */

async function loadAppointmentsFromAPI() {

    /*
     * If Flask already injected patients,
     * don't overwrite them.
     */

    if (
        Array.isArray(
            APPOINTMENTS
        ) &&
        APPOINTMENTS.length > 0
    ) {

        return;

    }


    if (!HOSPITAL_UID) {

        console.warn(
            "No hospital UID available."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/appointments/" +
                encodeURIComponent(
                    HOSPITAL_UID
                )
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Support common response formats.
         */

        if (
            Array.isArray(data)
        ) {

            APPOINTMENTS =
                data;

        }

        else if (
            Array.isArray(
                data.appointments
            )
        ) {

            APPOINTMENTS =
                data.appointments;

        }

        else if (
            Array.isArray(
                data.patients
            )
        ) {

            APPOINTMENTS =
                data.patients;

        }

        else if (
            Array.isArray(
                data.data
            )
        ) {

            APPOINTMENTS =
                data.data;

        }

        else {

            APPOINTMENTS = [];

        }


    }
    catch (error) {

        console.error(
            "Unable to load appointments:",
            error
        );

        APPOINTMENTS = [];

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initializePage() {

    await loadAppointmentsFromAPI();


    populateDoctors();


    render();

}


/* =====================================================
   START
===================================================== */

initializePage();

</script>
